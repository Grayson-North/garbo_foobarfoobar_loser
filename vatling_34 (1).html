<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VATLING — Colony Economy</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111823; --panel2:#0d141d; --edge:#1e2b3a;
    --ink:#cfe3f5; --dim:#7d93a8; --accent:#3fd1c7; --accent2:#7b9cff;
    --warn:#ff6b6b; --good:#5fe08a; --gold:#f5c451;
    /* v0.31 — DEBT HAS A COLOUR. Gold now means exactly one thing: you can pay for this
       right now, out of credits in hand. Purple means this borrows — either because the
       action would take you into debt, or because it IS debt you already carry. The two
       are a clean binary, so affordability can be read off the board without reading a
       number. Red stays reserved for actual danger (foreclosure, starvation). */
    --debt:#a97bff; --debt-dim:#a97bff55; --debt-bg:#a97bff22; --debt-ink:#150a26;
    --font:'Segoe UI',system-ui,sans-serif; --mono:'Consolas','SF Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 800px at 70% -10%,#13203000,#060a10),var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;overflow:hidden}
  #app{display:grid;grid-template-rows:auto auto auto 1fr auto;height:100vh;--gbarh:0px;--abarh:30px}
  /* v0.31 — the clock, speed and head count are STATUS, not decisions, so they moved out of
     the top bar's prime real estate into a footer. What they vacated is now the finance
     panel, because the loss condition is financial and the debt figure was an 11px aside. */
  #botbar{display:flex;align-items:center;gap:14px;padding:5px 14px;background:linear-gradient(180deg,#0a1019,#0e1622);
    border-top:1px solid var(--edge);font-family:var(--mono);font-size:11px;color:var(--dim)}
  #botbar .bb-s{display:flex;gap:3px}
  #botbar b{color:var(--ink)}
  #botbar .bb-i{display:flex;align-items:center;gap:5px;white-space:nowrap}
  #fin{display:flex;gap:9px;flex:none;align-items:stretch}
  .finbox{background:var(--panel2);border:1px solid var(--edge);border-radius:9px;padding:5px 11px;
    display:flex;flex-direction:column;justify-content:center;min-width:140px}
  .finbox.clickable{cursor:pointer} .finbox.clickable:hover{border-color:var(--accent)}
  .finbox.owing{border-color:var(--debt-dim);background:#150e22}
  .finbox.crisis{border-color:var(--warn);background:#1c0f12}
  .finbox .fk{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
  .finbox .fv{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .finbox .fv.debt{color:var(--debt)}
  .finbox .fv small{font-size:11px;font-weight:400;color:var(--dim);font-family:var(--mono)}
  .finbox .fsub{font-size:10px;font-family:var(--mono);color:var(--dim);white-space:nowrap}
  .finbox .fbar{height:4px;background:#0c1119;border-radius:2px;overflow:hidden;margin-top:3px}
  .finbox .fbar>i{display:block;height:100%;background:var(--debt)}
  .finbox .fore{color:var(--warn);font-weight:700;font-size:10px;animation:blink 1s steps(2,start) infinite}
  /* ALERTS — a strip pinned under the resource bar, above the gestation bar. Same place on
     every tab, collapses to nothing when quiet, and never overlaps the board. This is the
     surface later systems (disasters, missions, faction events) write into: raiseAlert()
     is the whole API. */
  /* v0.32 — FIXED HEIGHT, ALWAYS. The strip used to grow and shrink with the alert count,
     so every appearance and expiry shoved the gestation bar, the tabs and the whole board
     down or up — including under the cursor mid-click. It is now exactly one row tall at
     all times: the first alert renders inline, and any others float in an overlay anchored
     beneath it. Nothing below the strip ever moves again. --abarh is a constant now, kept
     only so the two viewport-height panes still read one number. */
  #alertbar{position:relative;height:var(--abarh);padding:3px 12px;box-sizing:border-box;
    background:transparent;border-bottom:1px solid transparent;transition:background .15s}
  #alertbar.live{background:linear-gradient(180deg,#140f0f,#0b0d12);border-bottom-color:var(--edge)}
  #alertbar .al-first{height:100%;display:flex;align-items:stretch;gap:6px}
  #alertbar .al-first .alert{height:100%;flex:1;min-width:0}
  /* The overflow hangs over whatever is below rather than displacing it — and what is
     below is the gestation bar. v0.33 gave these floating rows pointer-events:auto
     unconditionally, so a stacked alert sat on top of a Gestate button and ate the click.
     v0.34: the overflow is GLASS. It is readable, so a second alert is still not a
     surprise, but it cannot take a pointer until the player opens it with the ＋N handle —
     and an overlay you deliberately opened is allowed to cover what is beneath it. */
  #alertbar .al-more{position:absolute;left:12px;right:12px;top:100%;z-index:60;
    display:flex;flex-direction:column;gap:3px;padding-top:3px;pointer-events:none}
  /* frosted rather than opaque, so it reads as something floating over the gestation bar
     rather than as the gestation bar having gone away */
  #alertbar .al-more .alert{box-shadow:0 8px 22px #0009;background:rgba(9,14,20,.8);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #alertbar .al-more .alert .al-x{visibility:hidden}
  #alertbar .al-more.open .alert{pointer-events:auto;background:#0c1219;backdrop-filter:none}
  #alertbar .al-more.open .alert .al-x{visibility:visible}
  #alertbar .al-more-t{flex:0 0 auto;align-self:center;height:100%;padding:0 9px;
    background:#0c1219;border:1px solid var(--edge);border-radius:7px;color:var(--dim);
    font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
  #alertbar .al-more-t:hover{color:var(--fg);border-color:var(--accent2)}
  #alertbar .al-more-t.on{color:var(--accent2);border-color:var(--accent2);background:#101a24}
  .alert{display:flex;align-items:center;gap:8px;border:1px solid var(--alc);border-left-width:3px;border-radius:7px;
    padding:4px 9px;background:#0c1219;font-size:12px;animation:alertin .18s ease-out}
  .alert[onclick]{cursor:pointer} .alert[onclick]:hover{background:#111a24}
  @keyframes alertin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .alert.danger{--alc:var(--warn)} .alert.warn{--alc:var(--gold)}
  .alert.info{--alc:var(--accent2)} .alert.good{--alc:var(--good)}
  .alert .al-i{font-size:14px;line-height:1;color:var(--alc)}
  .alert .al-t{flex:1;line-height:1.35}
  .alert .al-n{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--edge);border-radius:4px;padding:0 4px}
  /* it is always in the markup so the in-place patch has a target, but an empty chip
     rendered as a stray 1px box beside the dismiss button */
  .alert .al-n:empty{display:none}
  .alert .al-x{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
  .alert .al-x:hover{color:var(--ink)}
  #gestbar{background:linear-gradient(180deg,#0d1722,#0a1119);border-bottom:1px solid var(--edge);display:flex;align-items:stretch;gap:7px;padding:5px 12px;overflow-x:auto;overflow-y:hidden}
  #gestbar.hidden{display:none}
  #gestbar::-webkit-scrollbar{height:7px}
  .gb-lead{flex:none;display:flex;flex-direction:column;justify-content:center;gap:3px;padding-right:10px;border-right:1px solid var(--edge);min-width:112px}
  .gb-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .gb-title:hover{filter:brightness(1.25)}
  .gb-sub{font-size:10px;font-family:var(--mono);color:var(--dim)}
  .gchip{flex:none;width:186px;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;gap:2px}
  .gchip.run{border-color:#2b6c66}
  .gchip.blocked{border-color:var(--warn)}
  .gc-h{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden}
  .gc-h .stars{color:var(--gold);font-size:10px;letter-spacing:0}
  .gc-tr{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden;height:14px}
  .gc-tr .trait{font-size:9px;padding:0 4px;white-space:nowrap}
  .gc-bar{height:5px;background:#081016;border-radius:3px;overflow:hidden;border:1px solid var(--edge)}
  .gc-bar>i{display:block;height:100%;background:linear-gradient(90deg,#2b8c86,#5fe0d6)}
  .gc-act{display:flex;gap:4px;align-items:center}
  .gc-act .act{flex:1;padding:3px 6px;font-size:11px}
  .gc-act .ghost{padding:3px 7px;font-size:11px}
  .gc-cost{font-size:9px;font-family:var(--mono);color:var(--dim);white-space:nowrap}
  #gestbar.collapsed .gchip,#gestbar.collapsed .gb-sub{display:none}
  #gestbar.collapsed{padding:3px 12px}
  /* nowrap: the finance panel is pinned to the right of the row. #resbar wraps its own
     chips internally, so a long resource strip grows downward WITH the panel beside it
     rather than shoving the panel onto a second line. */
  #topbar{background:linear-gradient(180deg,#0e1622,#0a1019);border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:nowrap}
  /* The brand was carrying a long tagline that ate a third of the bar. It is now a mark
     and a version, and the resource strip takes the reclaimed width. */
  .brand{font-weight:700;letter-spacing:2px;color:var(--accent);font-size:15px;display:flex;gap:6px;align-items:baseline;flex:none;
    cursor:pointer;user-select:none;padding:3px 7px;border:1px solid transparent;border-radius:8px}
  .brand:hover{border-color:var(--edge);background:#0d1622}
  .brand.open{border-color:var(--accent);background:#0e1a24}
  .brand .bcaret{font-size:9px;color:var(--dim)}
  /* the colony's file operations were four ghost buttons on the Colony toolbar, which put
     "New Colony" one slip of the mouse from the board. They live behind the brand now. */
  #brandmenu{position:fixed;z-index:95;display:none;min-width:212px;background:var(--panel);
    border:1px solid var(--accent);border-radius:10px;padding:5px;box-shadow:0 14px 34px #000c}
  #brandmenu.open{display:block}
  #brandmenu .bm-i{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px}
  #brandmenu .bm-i:hover{background:#132030}
  #brandmenu .bm-i.warn{color:var(--warn)} #brandmenu .bm-i.warn:hover{background:#241016}
  #brandmenu .bm-k{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding:6px 9px 3px}
  #brandmenu .bm-sep{height:1px;background:var(--edge);margin:4px 6px}
  #brandmenu .bm-s{font-size:10px;font-family:var(--mono);color:var(--dim);padding:2px 9px 6px}
  .brand small{color:var(--dim);letter-spacing:1px;font-weight:400;font-size:10px;font-family:var(--mono)}
  #resbar{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
  .res{background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:4px 9px;display:flex;flex-direction:column;min-width:96px;flex:1 1 96px;max-width:150px}
  .res.util{border-color:#263647;background:#0b141d}
  .res.clickable{cursor:pointer} .res.clickable:hover{border-color:var(--accent)}
  .res.fresh{animation:resin .9s ease-out}
  @keyframes resin{from{opacity:0;transform:translateY(-4px);border-color:var(--accent)}to{opacity:1;transform:none}}
  .ricon{cursor:help}
  .res .top{display:flex;align-items:center;gap:5px;font-weight:600}
  .res .icon{font-size:14px}
  .res .val{font-variant-numeric:tabular-nums}
  .res .rate{font-size:10px;font-family:var(--mono)}
  .res .rate.pos{color:var(--good)} .res .rate.neg{color:var(--warn)} .res .rate.zero{color:var(--dim)}
  .res .bar{height:3px;background:#0c1119;border-radius:2px;margin-top:3px;overflow:hidden}
  .res .bar > i{display:block;height:100%;background:var(--accent)}
  .clock{display:flex;align-items:center;gap:10px;flex:none}
  .speed{display:flex;gap:3px}
  .speed button{background:var(--panel2);color:var(--dim);border:1px solid var(--edge);border-radius:6px;padding:5px 9px;cursor:pointer;font-weight:700;font-family:var(--mono)}
  .speed button.on{background:var(--accent);color:#04120f;border-color:var(--accent)}
  .speed button:hover{color:var(--ink)}
  .cyc{font-family:var(--mono);color:var(--dim);text-align:right;line-height:1.3;font-size:11px}
  .cyc b{color:var(--ink)} .cyc .fin{color:var(--gold)} .cyc .debt{color:var(--debt)}
  .dbg{background:var(--warn);color:#2a0808;font-weight:700;font-size:10px;letter-spacing:1px;padding:1px 6px;border-radius:5px;margin-left:6px}
  .cyc .foreclose{font-weight:700;animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}

  /* v0.33 — `grid-template-rows:auto 1fr` plus min-height:0 is what lets #view take exactly
     the space the app grid gave #body, no more. Without the explicit rows this was a
     two-row auto grid sized by its content, which is the layout quirk carried as an open
     item since v0.24; without min-height:0 a grid item refuses to shrink below its content
     and the overflow reappears one level up. */
  #body{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:hidden;min-height:0}
  #tabs{display:flex;gap:2px;padding:8px 14px 0;flex-wrap:wrap}
  .tab{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--dim);padding:8px 15px;cursor:pointer;border-radius:8px 8px 0 0;font-weight:600}
  .tab.on{background:var(--panel);color:var(--ink);border-color:var(--edge)}
  .tab .pip{background:var(--accent);color:#04120f;border-radius:10px;font-size:10px;padding:0 6px;margin-left:6px;font-weight:700}
  #view{background:var(--panel);border:1px solid var(--edge);margin:0 14px 14px;border-radius:0 10px 10px 10px;overflow:auto;padding:16px;position:relative;min-height:0}

  h2.sec{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin:16px 0 12px;border-bottom:1px solid var(--edge);padding-bottom:6px}
  h2.sec:first-child{margin-top:2px}
  .grid{display:grid;gap:12px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .cards.cdense{grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
  .card{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .card h3{font-size:14px;display:flex;align-items:center;gap:7px}
  .card .desc{color:var(--dim);font-size:12px;line-height:1.4}
  .io{font-family:var(--mono);font-size:11px;display:flex;flex-wrap:wrap;gap:4px 10px}
  .io .in{color:var(--warn)} .io .out{color:var(--good)}
  .tag{background:#0c141e;border:1px solid var(--edge);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--dim)}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .spacer{flex:1}
  button.act{background:var(--accent);color:#04120f;border:none;border-radius:7px;padding:7px 12px;font-weight:700;cursor:pointer}
  button.act:hover{filter:brightness(1.1)} button.act:disabled{background:#233140;color:#5a6b7d;cursor:not-allowed}
  /* v0.32 — DISABLED BEATS EVERY AFFORDABILITY COLOUR. .debt and .gold are declared after
     :disabled and carry equal specificity, so a button that could not be pressed was still
     being painted "this would borrow" — which answers a question the player cannot act on.
     Whether it is unaffordable is irrelevant when it is unavailable. */
  button.act.debt:disabled, button.act.gold:disabled{background:#233140;color:#5a6b7d;cursor:not-allowed}
  button.act.sm{padding:4px 9px;font-size:12px}
  button.gold{background:var(--gold);color:#2a1e05}
  /* the same shape as .gold, but meaning "this will borrow" rather than "you can pay" */
  button.act.debt{background:var(--debt);color:var(--debt-ink)}
  button.ghost.debt{border-color:var(--debt);color:var(--debt)}
  button.ghost{background:transparent;border:1px solid var(--edge);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer;flex:none;white-space:nowrap}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  button.ghost.sm{padding:3px 8px;font-size:12px}
  /* overclock selector — a three-state cycle, each step louder than the last */
  .ocbtn{flex:1;text-align:center;font-weight:700;font-size:11px;letter-spacing:.5px}
  .ocbtn.on{background:#0e1a24}
  .lvl{font-family:var(--mono);color:var(--gold)}
  .cost{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .cost.bad{color:var(--warn)}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:5px 8px;font-family:var(--font);width:100%}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .hint{color:var(--dim);font-size:12px}
  .empty{color:var(--dim);font-style:italic;padding:20px;text-align:center}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1c2836;border-radius:6px}

  /* These used to be `calc(100vh - 200px - …)`: a hand-counted total of the top bar, the
     tabs and the margins. Every chrome change since had to be remembered here, and the
     v0.31 footer was not — so the board hung 30px past the bottom and the whole tab
     scrolled. `height:100%` inside a properly-sized #view needs no arithmetic and cannot
     drift again. The floor is deliberately small: on a short window the panes scroll
     internally rather than pushing the page. */
  /* `#view.tall` turns the tab into a flex column so the pane can claim whatever is left
     after the toolbar above it, instead of claiming the whole box and overflowing by the
     toolbar's height. Only the two full-height tabs opt in; every other tab keeps ordinary
     block flow and its existing margins. */
  #view.tall{display:flex;flex-direction:column}
  .colwrap{display:flex;gap:12px;flex:1 1 auto;min-height:180px}
  .palette{width:212px;flex:none;overflow:auto;background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:9px}
  .detail{width:256px;flex:none;overflow:auto;background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:11px}
  .boardwrap{flex:1;overflow:auto;border:1px solid var(--edge);border-radius:10px;position:relative;background-color:#04070c;
    background-image:radial-gradient(1px 1px at 15% 25%,#ffffff66,transparent),radial-gradient(1px 1px at 65% 55%,#ffffff44,transparent),radial-gradient(1px 1px at 42% 82%,#ffffff33,transparent),radial-gradient(1px 1px at 82% 18%,#ffffff44,transparent),radial-gradient(1px 1px at 30% 60%,#ffffff22,transparent),radial-gradient(1px 1px at 92% 75%,#ffffff33,transparent)}
  .board{position:relative;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px)}
  .scaf.pending{opacity:.5;border-style:dotted}
  .scaf.pending>i{position:absolute;left:2px;bottom:2px;height:2px;background:var(--gold);border-radius:1px}
  .scaf{position:absolute;border:1px dashed #5b7f96;background:repeating-linear-gradient(45deg,#5b7f9618,#5b7f9618 4px,transparent 4px,transparent 8px);border-radius:4px;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#5b7f96}
  .tile{position:absolute;border:1.5px solid var(--tc);border-radius:8px;background:radial-gradient(120% 120% at 50% 0%,#16202b,#0b1119);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;box-shadow:0 0 10px #000a,inset 0 0 22px #00000055;transition:box-shadow .15s;padding:2px}
  .tile:hover{box-shadow:0 0 14px var(--tc),inset 0 0 22px #00000055}
  .tile .ticon{font-size:20px;line-height:1;filter:drop-shadow(0 0 4px var(--tc))}
  .tile.big .ticon{font-size:30px}
  /* .tname retired in v0.30 — tiles are icon-only; the name lives in the title attribute */
  .tile .ticon{margin-bottom:1px}
  .tile .tlvl{position:absolute;top:2px;right:4px;font-size:9px;font-family:var(--mono);color:var(--tc)}
  .tile .tstat{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:9px;font-family:var(--mono);color:var(--ink)}
  .tile.sel{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 18px var(--accent)}
  /* v0.26 — adjacency highlight. Dashed, so it never reads as the solid selection outline.
     Colour is carried on --ahc by the adj-* class, one per bonus kind. */
  .tile.adjhl{outline:2px dashed var(--ahc);outline-offset:2px}
  .tile.shaped.adjhl{outline:none}
  .tile.shaped.adjhl .tcell{outline:2px dashed var(--ahc);outline-offset:2px}
  .tile.adj-supply{--ahc:#5fe08a} .tile.adj-gene{--ahc:#e07ad6} .tile.adj-hab{--ahc:#7b9cff}
  .tile.adj-store{--ahc:#f5c451} .tile.adj-core{--ahc:#3fd1c7}
  .adjkey{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 2px}
  .adjkey span{font-size:10px;font-family:var(--mono);border:1px dashed currentColor;border-radius:4px;padding:0 4px}
  .tile.gest{animation:pulse 1.6s infinite}
  /* a redlined module should be visible from across the board without reading its label */
  .tile.oc1{border-color:var(--gold)}
  .tile.oc2{border-color:var(--warn);animation:redline 1.1s infinite}
  .tile.oc2 .ticon{filter:drop-shadow(0 0 6px var(--warn))}
  @keyframes redline{0%,100%{box-shadow:0 0 10px #000a,inset 0 0 22px #00000055}50%{box-shadow:0 0 16px var(--warn),inset 0 0 22px #00000055}}
  .tile.starved{border-style:dotted}
  .tile.bldg{border-style:dashed;opacity:.62;background:radial-gradient(120% 120% at 50% 0%,#121a24,#090e15)}
  .tile.bldg .ticon{filter:grayscale(.7) drop-shadow(0 0 3px var(--tc))}
  .tile.shaped{background:none;border:none;box-shadow:none}
  .tile.shaped:hover{box-shadow:none}

<script>
/* =====================================================================
   VATLING — data-driven colony economy + spatial station builder.
   v0.10 — construction time, scaffolding, salvage, affinity traits,
           eyedropper, gestation queue, per-colonist augments.
   v0.23 — input gating, unfinanceable costs, globalMod funnel,
           two-tier overclocking, progressive resource reveal.
   v0.24 — tooltip pass across the data blocks.
   v0.25 — gestation crew lock replaces the vat seal, queued-seed settlement,
           scroll retention across renders, structural refresh for Staffing/Citizens.
   v0.26 — animation-layer groundwork: __vat test API, `view` namespace, render
           decoupled from mutation, visualSeed, per-module work verbs,
           workPositions, adjacency highlighting.
   v0.27 — everything that changes a colony now takes time: salvage, upgrades and
           research all run on the construction clock. Cancelling a build refunds on
           a sliding scale and leaves no frames behind. Like bonuses ADD instead of
           compounding. Overclocked power producers pay in materials, not in phantom
           power. Gene Lab gated behind the Composite Fabricator. Research with unmet
           prerequisites is undiscovered rather than merely locked.
   v0.28 — stacked bonuses are SUMMED FOR THE PLAYER on the card instead of listed one
           per source. Price thresholds are a slider bounded by the real market clamp and
           annotated with the range that good has actually reached. Systems Telemetry
           unlocks a Ledger tab: every module's production and draw, line by line, for
           every resource. Staffing shows empty modules and pins its group headers.
   v0.29 — Jake's balance pass, applied directly to the v0.28 file: module footprints

           reactor gated behind the Composite Fabricator, Systems Telemetry moved to

function rectCells(w,h){ const c=[]; for(let dx=0;dx<w;dx++)for(let dy=0;dy<h;dy++)c.push([dx,dy]); return c; }
function shapeCells(type){ const s=SHAPES[type]; if(s) return s.map(c=>[c[0],c[1]]);

function cellBounds(cells){ let w=0,h=0; cells.forEach(([x,y])=>{ if(x+1>w)w=x+1; if(y+1>h)h=y+1; }); return [w,h]; }
function rotateCells(cells){ const h=cellBounds(cells)[1]; return cells.map(([dx,dy])=>[h-1-dy,dx]); }

/* ---------- 4c. OVERCLOCKING ----------
   A researched ability to push a single module past its rated output. Output and material
   draw rise linearly; POWER draw rises far faster, which is the whole decision.
   Only modules that both produce AND consume can be pushed — a Solar Array has no input
   to strain, so overclocking it would be free output from nothing.

   v0.27 — the generator case. A module with no energy line of its own cannot be charged in
   power: multiplying a consumption it does not have is a no-op, and the old workaround —
   a phantom energy draw billed to a machine whose entire job is making energy — read as
   nonsense on the card and hid the real cost. Those modules now take the POWER multiplier
   on their MATERIAL inputs instead. A redlined Fusion Reactor burns 6.5× the alloys, which
   puts the decision back where it belongs: on the Foundry chain feeding it. */
const OC_TIERS = [
  {name:'Normal',      tag:'',   out:1,   mat:1,   pwr:1,   col:'var(--dim)'},
  {name:'Overclocked', tag:'⚙',  out:1.5, mat:1.5, pwr:3.0, col:'var(--gold)'},
  {name:'Redlined',    tag:'🔥', out:2.0, mat:2.2, pwr:6.5, col:'var(--warn)'},
];
function canOverclock(b){ if(!b||!isBuilt(b)||!techHas('oc_protocol')) return false;
  const d=BUILDINGS[b.type]; if(d.gestate||d.unique) return false;
  return !!(d.production&&Object.keys(d.production).length) && !!(d.consumption&&Object.keys(d.consumption).length); }
function ocLevel(b){ return canOverclock(b)? Math.max(0,Math.min(OC_TIERS.length-1, b.oc||0)) : 0; }
function ocTier(b){ return OC_TIERS[ocLevel(b)]; }
/* Does this module have a power bill the overclock multiplier can actually land on? */
function ocPaysPower(b){ const d=BUILDINGS[b.type]; return !!(d.consumption && d.consumption.energy); }
/* Per-input multiplier. Energy always takes the power figure. Everything else takes the
   material figure — unless the module pays no power at all, in which case ALL of its inputs
   take the power figure, and that is what makes a redlined generator expensive. */
function ocInMul(b,r){ const T=ocTier(b);
  if(r==='energy') return T.pwr;
  return ocPaysPower(b)? T.mat : T.pwr; }
function ocMatMul(b){ return ocInMul(b,'__mat'); }
function setOverclock(id,t){ const b=byId(id); if(!b||!canOverclock(b)) return;
  t=Math.max(0,Math.min(OC_TIERS.length-1,Number(t)||0));
  if((b.oc||0)===t) return; b.oc=t; const T=OC_TIERS[t];
  if(t>=OC_TIERS.length-1) state.stats.redlined=(state.stats.redlined||0)+1;
  logMsg(t? T.tag+' '+BUILDINGS[b.type].name+' set to '+T.name+' — ×'+T.out+' output, ×'+T.pwr+(ocPaysPower(b)?' power draw.':' material draw (it pays no power).')
          : BUILDINGS[b.type].name+' returned to rated output.', t>1?'warn':'info');
  progRender(); }
function ocCount(){ let n=0; state.buildings.forEach(b=>{ if(ocLevel(b)>0) n++; }); return n; }

  Utility: {name:'Utilities & Storage',icon:'🔋'},
  Commerce:{name:'Commerce',           icon:'📡'},
  Cyber:   {name:'Cybernetics',        icon:'🦾'},

/* 'Locked' is gone as a filter because locked techs are no longer rendered at all. */
const TECH_FILTERS = { all:'All', avail:'Available now', done:'Researched' };

function techState(id){ const t=TECHS[id];
  if(state.techs[id]) return 'done';
  return t.requires.every(r=>state.techs[r]) ? 'avail' : 'locked'; }
/* --- v0.27: DISCOVERY -------------------------------------------------------------
   A tech whose prerequisites are unmet does not appear in the tree at all. It is not a
   greyed-out card explaining what you are missing — it does not exist yet, and finishing
   the project that unlocks it announces it in the log. techState() still reports 'locked'
   for the benefit of anything that asks directly; every list filters on techDiscovered(). */
function techDiscovered(id){ return techState(id)!=='locked'; }
function techBusy(id){ return !!(state.research && state.research.id===id); }
function discoveredIn(cat){ return Object.keys(TECHS).filter(id=>TECHS[id].cat===cat && techDiscovered(id)); }
function techMatches(id){ const t=TECHS[id], st=techState(id);
  if(!techDiscovered(id)) return false;
  if(view.techFilter!=='all' && view.techFilter!==st) return false;
  const q=view.techQuery.trim().toLowerCase();
  if(q && !(t.name.toLowerCase().includes(q) || (t.desc||'').toLowerCase().includes(q))) return false;
  return true; }

/* --- v0.27: RESEARCH TAKES TIME ----------------------------------------------------
   Buying a tech no longer grants it. It starts a PROJECT: the cost is paid up front, and
   the colony then works through it at a rate set by how much science capacity is actually
   staffed. One project at a time — the tree is a queue of decisions, not a shopping list.
   Base seconds come from the 🔬 price, so the ordering of the tree already tunes it. */
const RESEARCH_SEC_PER_POINT = 0.25;
const RESEARCH_MIN_SEC       = 8;
const RESEARCH_BASE_RATE     = 0.25;   // a colony with no lab still creeps forward
function techSeconds(id){ const c=(TECHS[id]&&TECHS[id].cost)||{};
  return Math.max(RESEARCH_MIN_SEC, (c.research||0)*RESEARCH_SEC_PER_POINT); }
/* Every finished Research Lab contributes its operating factor — the same number that
   drives its 🔬 output — so staffing labs with trained scientists shortens projects as well
   as paying for them. This is the answer to "what are labs for once I am 🔬-rich". */
function researchRate(){ let p=RESEARCH_BASE_RATE;
  state.buildings.forEach(b=>{ if(b.type!=='lab'||!isBuilt(b)) return; p+=staffing(b).factor; });
  return Math.max(0.05, p); }
function researchEta(){ const R=state.research; if(!R) return 0;
  return Math.max(0,(R.target-R.progress)/Math.max(0.0001,researchRate())); }
function researchPct(){ const R=state.research; if(!R) return 0;
  return Math.max(0,Math.min(100, R.progress/Math.max(0.0001,R.target)*100)); }
function toggleTechCat(c){ view.techCatClosed[c]=!view.techCatClosed[c]; renderTechList(); }
function setTechQuery(v){ view.techQuery=v; renderTechList(); }
function setTechFilter(v){ view.techFilter=TECH_FILTERS[v]?v:'all'; renderTechList(); }

/* ---------- 5a. EXCHANGE TERMINAL — programmable trade slots ----------
   Every slot runs one standing order and needs a broker posted to it; an unstaffed slot
   does nothing at all. Throughput and price impact both scale off the broker's Logistics
   skill, so WHO you post matters as much as what the order says. */
const TRADE_BASE_RATE  = 1.5;    // units/second a skill-0 broker can move
const TRADE_SKILL_RATE = 0.25;   // +25% throughput per Logistics point (skill 10 → 3.5×)
const TRADE_IMPACT_MIN = 0.30;   // a skill-10 broker suffers only 30% of the price impact
const REFI_PER_SLOT    = 0.010;  // refinance: flat interest cut per staffed slot…
const REFI_PER_SKILL   = 0.004;  // …plus this per Logistics point
const REFI_CAP         = 0.06;   // total interest reduction ceiling (percentage points)
const INTEREST_FLOOR   = 0.03;
const AUTOPAY_SKILL_EFF= 0.02;   // each credit retires (1 + skill*this) of principal
const TRADE_MODES = {
  off:            {name:'— choose an action —', kind:'none'},
  sell_all:       {name:'Sell all',         kind:'sell', help:'Continuously sells everything of this good.'},
  sell_excess:    {name:'Sell excess',      kind:'sell', nums:[{k:'limit',label:'keep'}], help:'Sells anything above the stock level you keep in reserve.'},
  sell_high:      {name:'Sell high',        kind:'sell', nums:[{k:'pricePct',label:'≥ % of base'},{k:'limit',label:'keep'}], help:'Sells while the price is at or above your threshold, down to the reserve level.'},
  buy_low:        {name:'Buy low',          kind:'buy',  nums:[{k:'pricePct',label:'≤ % of base'},{k:'limit',label:'up to'}], help:'Buys up to your target stock while the price is at or below your threshold.'},
  buy_limit:      {name:'Buy to limit',     kind:'buy',  nums:[{k:'limit',label:'target'}], help:'Buys at any price until stock reaches your target.'},
  debt_autopay:   {name:'Debt · autopay',   kind:'debt', nums:[{k:'rate',label:'💰/cycle'}], help:'Diverts credits to the debt every cycle. A skilled broker retires more principal per credit.'},
  debt_refinance: {name:'Debt · refinance', kind:'debt', help:'Standing order that lowers the colony interest rate, scaling with the broker’s skill.'},
};
const TRADE_GOODS = Object.keys(PRICES);
/* A slot targets either a tradeable good or the colony debt. You pick the TARGET first,
   then the action list narrows to what makes sense for it. */
const DEBT_TARGET = '__debt';
const MODES_FOR = { res:['off','sell_all','sell_excess','sell_high','buy_low','buy_limit'],
                    debt:['off','debt_autopay','debt_refinance'] };
/* v0.28: 130/70 were unreachable defaults — drift alone holds the price inside roughly
   ±7% of base, so a "sell above 130%" order sat armed forever and never fired once. The
   defaults now sit just outside the natural band, where they actually trigger. */
function defaultProg(){ return {target:null, mode:'off', res:'alloys', limit:100, pricePct:108, rate:60, credit:false, active:false, cit:null}; }
/* null means "not chosen yet" — the console reveals each control only once the previous
   one is answered, so a fresh slot shows nothing but a broker picker. */
function progTarget(p){ if(TRADE_MODES[p.mode]&&TRADE_MODES[p.mode].kind==='debt') return 'debt';
  return p.target==='debt'?'debt':(p.target==='res'?'res':null); }
function progReady(p){ const M=TRADE_MODES[p.mode]; return !!(p.cit!=null && progTarget(p) && M && M.kind!=='none'); }
function progsOf(b){ b.progs=b.progs||[]; const n=jobSlots(b);
  while(b.progs.length<n) b.progs.push(defaultProg()); return b.progs; }
/* the broker for a slot, or null — must still actually be posted to this terminal */
function slotBroker(b,p){ if(!p||p.cit==null) return null;
  const c=state.citizens.find(x=>x.id===p.cit); return (c&&c.assign===b.id)? c : null; }
/* globalMod('tradeRate') is the Bulk Freight multiplier — it scales the WHOLE rate, so an
   untrained broker benefits exactly as much proportionally as a skill-10 one. */
function brokerRate(c){ return TRADE_BASE_RATE*(1+(c.skills.Economy||0)*TRADE_SKILL_RATE)*cEffect(c,'prod',1)*(c.health/100)*globalMod('tradeRate',1); }
function brokerImpact(c){ return Math.max(TRADE_IMPACT_MIN, 1-(c.skills.Economy||0)*0.07); }
function refinanceCut(){ let cut=0;
  state.buildings.forEach(b=>{ if(b.type!=='trade'||!isBuilt(b)||!b.progs) return; const n=jobSlots(b);
    b.progs.forEach((p,i)=>{ if(i>=n||!p||p.mode!=='debt_refinance') return;
      const c=slotBroker(b,p); if(!c) return;
      cut += REFI_PER_SLOT + (c.skills.Economy||0)*REFI_PER_SKILL; }); });
  return Math.min(REFI_CAP, cut); }
/* silent market ops — the logged sellRes/buyRes would flood the event log 4×/second */
function mktSell(r,amount,impactMul){ const m=state.market[r]; if(!m||amount<=0) return 0;
  const rev=amount*m.price; state.res[r]-=amount; state.res.credits+=rev; state.stats.creditsEarned+=rev;
  const impact=amount/(amount+150); m.price=Math.max(m.base*PRICE_MIN_MUL, m.price*(1-impact*0.4*impactMul)); priceTouch(m); return rev; }
function mktBuy(r,amount,impactMul){ const m=state.market[r]; if(!m||amount<=0) return 0;
  const cost=amount*m.price; chargeCredits(cost); state.res[r]+=amount;
  const impact=amount/(amount+150); m.price=Math.min(m.base*PRICE_MAX_MUL, m.price*(1+impact*0.4*impactMul)); priceTouch(m); return cost; }
/* Spend ceiling for a buy slot. Without the credit box it can only use cash on hand; with it
   ticked it may borrow, but never past the same 80%-of-ceiling line that gates construction. */
function buySpendCap(p){ const cash=state.res.credits||0;
  if(!p.credit) return cash;
  return cash + Math.max(0, guardLimit()-state.debt); }
function runTradeSlot(b,p,dt){
  if(!p.active) return;                                   // slots ship disarmed; you arm them
  const c=slotBroker(b,p); if(!c) return;                 // unstaffed slots are inert, by design
  const M=TRADE_MODES[p.mode]; if(!M||M.kind==='none') return;
  const skill=c.skills.Economy||0;
  if(M.kind==='debt'){
    if(p.mode==='debt_autopay'){
      if(state.debt<=0) return;
      const eff=1+skill*AUTOPAY_SKILL_EFF;
      /* spend only what the remaining debt actually needs — paying the full rate into a
         nearly-cleared debt used to burn the surplus credits for nothing */
      const spend=Math.min(state.res.credits, Math.max(0,p.rate)/60*dt, state.debt/eff);
      if(spend<=0) return;
      ledAdd('credits','cons','debt',spend/dt);
      state.res.credits-=spend; state.debt-=spend*eff;
      if(state.debt<=0.5){ state.debt=0; if(state.hasLoan){ state.stats.loansRepaid++; state.hasLoan=false; logMsg('🏦 Broker '+c.name+' cleared the colony debt in full.','good'); } }
    }
    return;                                                // refinance is a standing effect
  }
  const r=p.res; if(!state.market[r]) return;
  const cap=resCap(r), stock=state.res[r]||0, price=state.market[r].price, base=state.market[r].base;
  const budgetUnits=brokerRate(c)*dt, impact=brokerImpact(c);
  if(M.kind==='sell'){
    let avail=0;
    if(p.mode==='sell_all')         avail=stock;
    else if(p.mode==='sell_excess') avail=Math.max(0, stock-Math.max(0,p.limit));
    else if(p.mode==='sell_high')   avail=(price>=base*Math.max(0,p.pricePct)/100)? Math.max(0, stock-Math.max(0,p.limit)) : 0;
    const qty=Math.min(budgetUnits, avail);
    if(qty>1e-6){ const rev=mktSell(r,qty,impact); ledAdd(r,'cons','trade',qty/dt); ledAdd('credits','prod','trade',rev/dt); }
  } else {
    let want=0;
    if(p.mode==='buy_low')        want=(price<=base*Math.max(0,p.pricePct)/100)? Math.max(0, Math.min(Math.max(0,p.limit),cap)-stock) : 0;
    else if(p.mode==='buy_limit') want=Math.max(0, Math.min(Math.max(0,p.limit),cap)-stock);
    let qty=Math.min(budgetUnits, want);
    const spendCap=buySpendCap(p);
    if(price>0) qty=Math.min(qty, spendCap/price);
    if(qty>1e-6){ const cost=mktBuy(r,qty,impact); ledAdd(r,'prod','trade',qty/dt); ledAdd('credits','cons','trade',cost/dt); }
  }
}
function runTradeHubs(dt){ state.buildings.forEach(b=>{ if(b.type!=='trade'||!isBuilt(b)) return;
  const n=jobSlots(b), progs=progsOf(b);
  for(let i=0;i<n;i++) runTradeSlot(b,progs[i],dt); }); }

/* ---------- 5c. ALERTS ----------------------------------------------------------------
   The player should never be surprised by something the log already knew. An alert is a
   short-lived banner raised by CODE THAT DETECTS A CONDITION, deduplicated by `key`.

   Lifecycle: everything expires on a timer. Re-raising a live key refreshes its text and
   resets its clock, so a condition that persists keeps its banner alive without any
   sticky-state bookkeeping, and one that resolves simply stops being re-raised and fades.
   That is what makes this usable as a framework: a disaster or a mission tick calls
   raiseAlert() on the same key every tick it is true and gets correct behaviour for free.

   The clock is WALL time (`wallSec`, advanced by the interval regardless of game speed),
   not `state.tSec` — at 4× a sim-time TTL would blink past in five seconds, and alerts
   should not expire at all while the game is paused.

   Alerts live in `view` (never serialized): they are a notification surface, not save data. */
const ALERT_TTL = 22;      // seconds of wall time an EVENT banner survives
/* --- v0.31: CONDITIONS vs EVENTS ------------------------------------------------------
   A utility deficit is not an event, it is a state, and treating it as an event was the
   spam: it re-raised four times a second, the repeat counter climbed into the hundreds,
   and a single-tick blip earned a banner that then sat for 22 seconds.

   A condition now has to HOLD for ALERT_DEBOUNCE before it earns a banner at all, reports
   how long it has been going instead of how many times it fired, and expires on a much
   shorter clock once it stops being re-raised — so it disappears a few seconds after the
   problem actually goes away rather than lingering. Its text is patched in place, which
   also stops the strip rebuilding under the cursor four times a second.
   Events (a research finishing, a score rising) keep the old behaviour. */
const ALERT_DEBOUNCE = 3;  // seconds a condition must hold before it is worth interrupting for
const ALERT_COND_TTL = 5;  // …and how quickly its banner goes once it stops
const ALERT_MAX = 4;       // the strip is a headline, not an inbox
const ALERT_KINDS = { danger:{icon:'⚠'}, warn:{icon:'⚑'}, info:{icon:'ℹ'}, good:{icon:'✔'} };
let wallSec = 0;
function raiseAlert(key, kind, text, go, opts){
  if(!ALERT_KINDS[kind]) kind='info';
  opts = opts || {};
  view.alerts = view.alerts || [];
  const live = view.alerts.find(a=>a.key===key);
  if(live){ live.text=text; live.kind=kind; live.go=go||null; live.at=wallSec; live.n++; return live; }
  const a = {key, kind, text, go:go||null, at:wallSec, n:1,
             cond:!!opts.cond, since:(opts.since!=null?opts.since:wallSec),
             ttl:(opts.ttl!=null?opts.ttl:ALERT_TTL)};
  view.alerts.unshift(a);
  if(view.alerts.length>ALERT_MAX) view.alerts.length=ALERT_MAX;
  return a; }
/* A condition reports itself every tick it is true; this decides when that is worth a
   banner. `view.condAt` remembers when each one started — settleConditions() forgets the
   ones that stopped, which is what makes the debounce re-arm for the next occurrence. */
function raiseCondition(key, kind, text, go){
  view.condAt = view.condAt || {};
  if(view.condAt[key]==null) view.condAt[key]=wallSec;
  if(wallSec-view.condAt[key] < ALERT_DEBOUNCE) return null;
  return raiseAlert(key, kind, text, go, {cond:true, since:view.condAt[key], ttl:ALERT_COND_TTL}); }
function settleConditions(live){ view.condAt = view.condAt || {};
  Object.keys(view.condAt).forEach(k=>{ if(!live.has(k)) delete view.condAt[k]; }); }
function alertHeld(a){ return a && a.cond ? Math.max(0, Math.round(wallSec-a.since)) : 0; }
function alertMeta(a){ if(a.cond) return 'ongoing '+alertHeld(a)+'s';
  return a.n>1 ? '×'+a.n : ''; }
function dropAlert(key){ view.alerts=(view.alerts||[]).filter(a=>a.key!==key); renderAlerts(true); }
function clearAlerts(){ view.alerts=[]; renderAlerts(true); }
function expireAlerts(){ const list=view.alerts||[], n=list.length;
  view.alerts = list.filter(a=> wallSec-a.at < (a.ttl||ALERT_TTL));
  return view.alerts.length!==n; }
/* Every condition worth interrupting the player for, evaluated once per tick. Financial
   danger first because the loss condition is financial. */
function checkAlerts(){
  if(state.gameOver) return;
  /* Every key raised as a CONDITION this tick. Anything absent has stopped being true and
     is forgotten, so its debounce re-arms rather than firing instantly next time. */
  const live=new Set();
  const cond=(key,kind,text,go)=>{ live.add(key); raiseCondition(key,kind,text,go); };

  /* Foreclosure is the exception: it is already a countdown the player must not miss, so
     it skips the debounce and reports immediately. */
  if(state.overCeiling>0){ live.add('fin.foreclose');
    view.condAt=view.condAt||{}; if(view.condAt['fin.foreclose']==null) view.condAt['fin.foreclose']=wallSec;
    raiseAlert('fin.foreclose','danger',
      'FORECLOSURE IN '+Math.ceil(FORECLOSE_GRACE-state.overCeiling)+'s — debt '+Math.round(state.debt)
      +' 💰 is above your ceiling of '+debtCeiling()+'. Sell stock or repay now.', "switchTab('market')",
      {cond:true, since:view.condAt['fin.foreclose'], ttl:ALERT_COND_TTL}); }
  else if(state.debt>guardLimit())
    cond('fin.guard','warn',
      'Debt '+Math.round(state.debt)+' 💰 is past the '+Math.round(guardLimit())
      +' construction guard — new builds, upgrades and augments are being refused.', "switchTab('market')");

  UTIL.forEach(u=>{ const g=state.grid&&state.grid[u]; if(!g) return;
    if(g.net < -1e-6)
      cond('grid.'+u,'danger',
        RESOURCES[u].icon+' '+RESOURCES[u].name+' deficit of '+Math.abs(g.net).toFixed(1)
        +'/s — the shortfall is being bought at '+(UTIL_PRICE[u]||0).toFixed(2)+' 💰/unit and booked as debt.',
        techHas('telemetry') ? "switchTab('ledger')" : "switchTab('colony')"); });

  const starved=state.buildings.filter(b=>isBuilt(b)&&b._sat!=null&&b._sat<0.999&&b._short);
  if(starved.length){ const b=starved[0], r=b._short;
    cond('supply.throttle','warn',
      starved.length+' module'+(starved.length>1?'s':'')+' throttled — short of '+RESOURCES[r].name+' '+RESOURCES[r].icon
      +', which cannot be bought on the market. Produce more or cut the draw.', 'gotoModule('+b.id+')'); }

  settleConditions(live);

  /* --- events ------------------------------------------------------------------------
     Creditworthiness only ever moves on an achievement, and it moves silently: the number
     in the corner ticks up while you are looking at something else. It is one of the few
     unambiguously GOOD things that happens, and it changes what you can borrow. */
  const sc=creditScore(), why=(state._newAch||[]);
  if(state._score!=null && sc>state._score)
    raiseAlert('fin.score','good',
      (why.length? '🏅 '+why.join(' + ')+' — ' : '')
      +'credit score increased by '+(sc-state._score)+' to '+sc
      +'. Borrowing limit is now '+borrowLimit()+' 💰 at '+Math.round(interestRate()*100)
      +'%/cycle, ceiling '+debtCeiling()+'.', "switchTab('market')");
  state._score=sc; state._newAch=[]; }

   it. Everything the player is currently looking at lives here; everything the simulation
   needs lives in `state`. Sprite caches, camera position, animation phase and LOD tier land
   here when the canvas board arrives — that is the whole point of naming it now. --- */
const view = {
  /* what is on screen */

/* --- v0.34: THE INTERACTION LATCH ------------------------------------------------------
   A browser only fires `click` when the mousedown and the mouseup resolve to the SAME
   element. Almost every panel here is rebuilt by replacing its subtree wholesale on a
   timer: the resource strip, the finance panel, the tabs and the bottom bar go four times
   a second; Market, Research, the Ledger and the Log once a second; Staffing and the
   roster whenever their signature moves; the detail card twice a second. Any of those
   landing between a press and a release destroys the node the press happened on, the
   browser finds no common target, and the click is silently swallowed — no error, no
   feedback, the button simply does not respond. It is not a browser limitation; it is
   this code repainting under the player's finger.

   So: stop repainting while a finger is down. `pointerdown` stamps a deadline and every
   live-update path returns early until it passes; `click` clears it, so the paint caused
   BY the click is never delayed. HOLD_MAX_MS caps the freeze in case a pointerup never
   arrives (dragged out of the window, an extension eating the event), and a pointermove
   with a button held refreshes the stamp so a long drag — the Market slider, most of all
   — is protected for its whole duration rather than only the first second and a half.
   The old `contains(document.activeElement)` guard stays, but it was never enough on its
   own: most clickable surfaces here are plain divs that never take focus. --- */
const HOLD_GRACE_MS = 140;   // after release: let the click land before repainting
const HOLD_MAX_MS   = 1500;  // ceiling, in case pointerup never arrives
function nowMs(){ return (typeof performance!=='undefined' && performance.now)? performance.now() : Date.now(); }
function holdingPointer(){ return view.holdUntil > nowMs(); }
function latchDown(){ view.holdUntil = nowMs() + HOLD_MAX_MS; }
function latchUp(){ view.holdUntil = Math.min(view.holdUntil, nowMs() + HOLD_GRACE_MS); }
function latchClear(){ view.holdUntil = 0; }
if(typeof document!=='undefined'){
  document.addEventListener('pointerdown', latchDown, true);
  document.addEventListener('pointermove', e=>{ if(e.buttons) latchDown(); }, true);
  document.addEventListener('pointerup', latchUp, true);
  document.addEventListener('pointercancel', latchClear, true);
  document.addEventListener('click', latchClear, true);
}

const NAME_A=['Vex','Incan','Cas','Juno','Kip','Lira','Mox','Nyx','Pel','Quil','Ren','Sab','Tarn','Vesp','Wren','Ve','Yara','Zeph','Bram','Cor','Luci','Jord','Jac','Dax','Sol','Ix','Nov','Vi','Ken','Kir','Jax','Jak','Gre','Hod','Bro','Kai','Chan','Iv','Ned','Jor','Ax', 'Zim','Gir', 'Dag', 'Miz', 'Ur','Em'];

const pick=a=>a[Math.floor(Math.random()*a.length)];
function blankSkills(){ const s={}; SKILL_CATS.forEach(k=>s[k]=0); return s; }
function blankGenome(){ return {traits:[], skills:blankSkills()}; }
function rollGenome(q){
  const traits=[], pool=[];
  const n=1+(Math.random()<0.30+q*0.14?1:0)+(Math.random()<0.10+q*0.12?1:0)+(Math.random()<Math.max(0,q-1.5)*0.12?1:0);
  Object.keys(TRAITS).forEach(id=>{ if(TRAITS[id].aff) return;
    let w=TRAITS[id].rarity; if(TRAITS[id].good) w*=Math.max(0.12,1+q*0.8); else w*=Math.max(0.1,1-q*0.45);
    for(let i=0;i<Math.round(w*4);i++) pool.push(id); });
  while(traits.length<Math.max(1,n) && pool.length){ const t=pick(pool); if(!traits.includes(t)) traits.push(t); }
  /* affinity gets its own independent slot so it never crowds out ordinary traits */
  const affChance=Math.min(0.6, 0.16+Math.max(0,q)*0.09);
  if(Math.random()<affChance){
    const majorShare=Math.min(0.45, 0.05+Math.max(0,q)*0.10);
    const wantMajor=Math.random()<majorShare;
    const bag=AFF_IDS.filter(a=> (a.tier.id==='attn')===wantMajor );
    const chosen=pick(bag.length?bag:AFF_IDS);
    if(chosen && !traits.includes(chosen.id)) traits.push(chosen.id);
  }
  const skills=blankSkills(), spec=pick(SKILL_CATS); skills[spec]=1+Math.floor(Math.random()*2);
  let sb=0; traits.forEach(t=>{ if(TRAITS[t].effects.startSkill) sb+=TRAITS[t].effects.startSkill; }); if(sb) skills[spec]+=sb;

function addCitizen(g){ const c={id:state.nextId++,name:makeName(),traits:g.traits,skills:g.skills,assign:null,health:100,born:state.tSec,augs:[]}; state.citizens.push(c); return c; }

/* ---------- effect helpers (traits + installed augments) ---------- */
const MULT_KEYS = {prod:1, skillGain:1, upkeep:1};
/* --- v0.27: LIKE BONUSES ADD, THEY DO NOT COMPOUND ---------------------------------
   Percentage modifiers used to multiply, so +20% and +50% learning came out at +80%.
   Every source now contributes its DELTA to one pool and the pool is applied once:
   +20% and +50% is +70%, which is what the two chips on the card say.

   The rule, stated once so later systems follow it: modifiers of the same kind from the
   same POOL add. There are three pools and they multiply against each other, because they
   are answers to different questions —
     · per-colonist  (genetic traits + installed augments)   — who is doing the work
     · colony-wide   (research, and later stimulants/prestige) — what the colony has learned
     · per-module    (overclock tier, adjacency)              — how this machine is being run
   MULT_FLOOR stops a stack of reductions from reaching zero or going negative. */
const MULT_FLOOR = 0.05;
function poolMul(delta){ return Math.max(MULT_FLOOR, 1+delta); }
function cEffect(c,key,base){
  if(MULT_KEYS[key]){ let d=0;
    (c.traits||[]).forEach(t=>{ const e=TRAITS[t]&&TRAITS[t].effects[key]; if(e!=null) d+=e-1; });
    (c.augs||[]).forEach(a=>{ const e=AUGMENTS[a]&&AUGMENTS[a].effects[key]; if(e!=null) d+=e-1; });
    return base*poolMul(d); }
  let v=base;
  (c.traits||[]).forEach(t=>{ const e=TRAITS[t]&&TRAITS[t].effects[key]; if(e!=null) v+=e; });
  (c.augs||[]).forEach(a=>{ const e=AUGMENTS[a]&&AUGMENTS[a].effects[key]; if(e!=null) v+=e; });
  return v; }
/* Affinity is a learning-rate bonus like any other, so it joins the same pool rather than
   multiplying on top of it: Ingenious (+50%) plus an Industry Affinity (+65%) trains
   Industry at +115%, not +147.5%. */
function skillGainRate(c,cat){ let d=0;
  (c.traits||[]).forEach(t=>{ const T=TRAITS[t]; if(!T) return;
    if(T.effects.skillGain!=null) d+=T.effects.skillGain-1;
    const a=T.effects.affinity; if(a&&a.cat===cat) d+=a.mul-1; });
  (c.augs||[]).forEach(x=>{ const A=AUGMENTS[x]; if(A&&A.effects.skillGain!=null) d+=A.effects.skillGain-1; });
  return 0.02*poolMul(d); }
const TECH_MULT = {vatSpeed:1, prodMul:1, capMul:1, upkeepMul:1, buildRate:1, tradeRate:1};
/* Defensive: an unrecognised tech id in a save must never break the tick loop.
   v0.27 — the colony-wide pool follows the same additive rule as the per-colonist one, so
   two techs that each grant +20% output will grant +40%, not +44%. Nothing stacks today;
   the rule is written down now because the roadmap's stimulants and prestige bonuses land
   in this pool and would otherwise each pick their own arithmetic. */
function tech(k,def){
  if(TECH_MULT[k]){ let d=0;
    for(const id in state.techs){ if(!state.techs[id]) continue; const T=TECHS[id]; if(!T||!T.effect) continue;
      const e=T.effect[k]; if(e!=null) d+=e-1; }
    return def*poolMul(d); }
  let v=def; for(const id in state.techs){ if(!state.techs[id]) continue; const T=TECHS[id]; if(!T||!T.effect) continue;
    const e=T.effect[k]; if(e!=null) v+=e; } return v; }
function techHas(id){ return !!state.techs[id]; }

/* --- GLOBAL MODIFIERS ---------------------------------------------------
   One funnel for every colony-wide modifier. Research is the only source today, but
   stimulants, faction perks and prestige bonuses are all coming, and each one patching
   the tick loop separately is how a tick loop rots. Register a function here instead:
   it receives (key, valueSoFar) and returns the new value. Sources MUST respect
   TECH_MULT — for the keys listed there return `v * poolMul(delta)` so the source joins
   the colony-wide additive pool rather than compounding on top of it; add for everything
   else. A source that writes `v *= 1.2` is the bug this note exists to prevent. */
const GLOBAL_MODS = [];
function registerGlobalMod(fn){ if(typeof fn==='function') GLOBAL_MODS.push(fn); }
function globalMod(k,def){ let v=tech(k,def);
  for(let i=0;i<GLOBAL_MODS.length;i++) v=GLOBAL_MODS[i](k,v);
  return v; }

/* --- v0.28: THE LEDGER ---------------------------------------------------------------
   A per-tick record of every flow, keyed by resource, written by the tick as it does the
   real arithmetic. It lives on `state._ledger`: the underscore means serializeState() drops
   it, so it is transient like b._op rather than saved state, and — critically — it is
   produced by the SAME loop that moves the resources, so the Ledger tab can never drift
   from the simulation the way a second implementation would.
   Every amount is a RATE PER SECOND, so utilities (already rates) and materials (computed
   per dt) read on one scale. `id` is a building id, or a string tag for the flows that do
   not belong to a module: 'pop', 'gest:<id>', 'trade', 'cover', 'interest'. */
function ledReset(){ state._ledger={}; }
function ledFor(r){ const L=state._ledger; if(!L) return null;
  return L[r] || (L[r]={prod:[], cons:[], capped:false}); }
function ledAdd(r,kind,id,rate){ if(!(rate>1e-9)) return; const E=ledFor(r); if(!E) return;
  E[kind].push({id, amt:rate}); }
function ledCap(r){ const E=ledFor(r); if(E) E.capped=true; }
function ledRows(r,kind){ const L=state._ledger, E=L&&L[r]; if(!E) return [];
  const m={}; E[kind].forEach(x=>{ m[x.id]=(m[x.id]||0)+x.amt; });   // one row per source
  /* object keys stringify, and a building id that arrives back as "1" instead of 1 falls
     through ledLabel's number branch and renders as an anonymous row. Coerce it back. */
  return Object.keys(m).map(k=>({id:(/^\d+$/.test(k)? Number(k) : k), amt:m[k]}))
    .sort((a,b)=>b.amt-a.amt); }
function ledTotal(r,kind){ return ledRows(r,kind).reduce((a,x)=>a+x.amt,0); }
function ageOf(c){ return (state.tSec-c.born)/60; }
function lifespanOf(c){ return Math.max(3, BASE_LIFESPAN + cEffect(c,'lifespan',0) + globalMod('lifeAdd',0)); }
function byId(id){ return state.buildings.find(x=>x.id===id); }
/* --- v0.27: TIMED JOBS -------------------------------------------------------------
   A module can be running exactly one timed job at a time, and each is a plain
   {progress,target} advanced by the construction clock:
     b.build — being assembled.   Not present, not staffable, produces nothing.
     b.demo  — being dismantled.  Same: offline, crew ejected when the job started.
     b.upg   — being upgraded.    STILL RUNNING at its current level, crew untouched;
                                  the new level (and any new slot) lands on completion.
   `isBuilt` is the engine's "this module counts" predicate — it gates production,
   staffing, storage, adjacency and unlock prerequisites — so build and demo clear it and
   an upgrade deliberately does not. Anything that draws a progress bar must go through
   jobOf(), because b.build is null during a demolition. */
const isBuilt = b => !b.build && !b.demo;
const JOB_KINDS = { build:{icon:'🏗', verb:'assembling'}, demo:{icon:'🧱', verb:'dismantling'},
                    upg:{icon:'⬆', verb:'upgrading'} };
function jobOf(b){ if(!b) return null;
  if(b.build) return {kind:'build', j:b.build};
  if(b.demo)  return {kind:'demo',  j:b.demo};
  if(b.upg)   return {kind:'upg',   j:b.upg};
  return null; }
function jobPct(b){ const o=jobOf(b); return o? Math.min(100, o.j.progress/Math.max(0.0001,o.j.target)*100) : 0; }

/* ---------- adjacency ---------- */
function neighborsOf(b,occ){ occ=occ||occMap(); const own=new Set(), set=new Set();
  for(let dx=0;dx<b.w;dx++)for(let dy=0;dy<b.h;dy++) own.add((b.x+dx)+','+(b.y+dy));
  for(let dx=0;dx<b.w;dx++)for(let dy=0;dy<b.h;dy++){ [[1,0],[-1,0],[0,1],[0,-1]].forEach(([ux,uy])=>{ const k=(b.x+dx+ux)+','+(b.y+dy+uy); if(!own.has(k)&&occ[k]!=null) set.add(occ[k]); }); }
  return [...set]; }
function nbrIds(b){ return b._nbr||neighborsOf(b); }
function prodAdjLinks(b){ const def=BUILDINGS[b.type]; if(!def.production||!def.consumption) return 0; let c=0;
  nbrIds(b).forEach(id=>{ const n=byId(id); if(!n||!isBuilt(n))return; const nd=BUILDINGS[n.type]; if(!nd.production) return; for(const r in def.consumption){ if(!isUtil(r)&&nd.production[r]){ c++; break; } } }); return c; }
function prodAdjBonus(b){ return Math.min(0.24, prodAdjLinks(b)*0.08); }
function vatBoost(b){ let q=0,spd=0; nbrIds(b).forEach(id=>{ const n=byId(id); if(n&&isBuilt(n)&&n.type==='genelab'){ q+=0.7*n.level; spd+=0.18*n.level; } }); return {quality:q, speed:Math.min(1.0,spd)}; }
function habitatLinks(b){ let c=0; nbrIds(b).forEach(id=>{ const n=byId(id); if(n&&isBuilt(n)&&n.type==='habitat') c+=n.level; }); return c; }
function upkeepDiscount(b){ return Math.min(0.5, habitatLinks(b)*0.25); }

/* ---------- capacity & finance ---------- */
/* A store sitting next to something that MAKES the good it holds gets +50% capacity for
   that good specifically — so siting a depot beside the foundry actually matters. */
const STORAGE_ADJ_BONUS = 0.5;
function storageAdjMul(b,rid){ let hit=false;
  nbrIds(b).forEach(id=>{ const n=byId(id); if(!n||!isBuilt(n)) return;
    const p=BUILDINGS[n.type].production; if(p&&p[rid]) hit=true; });
  return hit? 1+STORAGE_ADJ_BONUS : 1; }
function resCap(rid){ const R=RESOURCES[rid]; if(R.cap>=9999999) return R.cap; let bonus=0;
  state.buildings.forEach(b=>{ if(!isBuilt(b))return; const s=BUILDINGS[b.type].storage; if(s&&s[rid]) bonus+=s[rid]*b.level*storageAdjMul(b,rid); });
  return Math.round((R.cap+bonus)*globalMod('capMul',1)); }
function bufferCap(u){ let c=0; state.buildings.forEach(b=>{ if(!isBuilt(b))return; const bf=BUILDINGS[b.type].buffer; if(bf&&bf[u]) c+=bf[u]*b.level; }); return c; }
function housingCap(){ let h=0; state.buildings.forEach(b=>{ if(!isBuilt(b))return; const hh=BUILDINGS[b.type].housing; if(hh) h+=hh*b.level; }); return h; }
function creditScore(){ let s=300; for(const id in ACHIEVEMENTS){ if(state.achievements[id]) s+=ACHIEVEMENTS[id].pts; } return Math.min(850,s); }
function scoreBand(s){ return s>=780?'Excellent':s>=680?'Good':s>=580?'Fair':s>=450?'Building':'Poor'; }
function borrowLimit(){ return Math.max(100, Math.round((creditScore()-250)*3 + state.citizens.length*15)); }
function baseInterestRate(){ return Math.max(0.06, Math.min(0.18, 0.18-(creditScore()-300)*0.0002)); }
function interestRate(){ return Math.max(INTEREST_FLOOR, baseInterestRate()-refinanceCut()); }
function debtCeiling(){ return borrowLimit()*2; }
function priceOf(r){ return state.market[r]?state.market[r].price:(UTIL_PRICE[r]||0); }
/* Session watermarks. Natural drift only moves the price a few percent (see the Terminal's

   where a good has ACTUALLY been is what makes a threshold slider meaningful instead of a
   number you guess at. */
function priceTouch(m){ if(!m) return;
  if(typeof m.lo!=='number'||m.price<m.lo) m.lo=m.price;
  if(typeof m.hi!=='number'||m.price>m.hi) m.hi=m.price; }
function pricePct(r){ const m=state.market[r]; return m? m.price/m.base*100 : 100; }
function priceSeen(r){ const m=state.market[r]; if(!m) return null;
  return {lo:(m.lo!=null?m.lo/m.base*100:100), hi:(m.hi!=null?m.hi/m.base*100:100)}; }
/* The epsilon matters: automated trade slots spend right down to their cash ceiling, and a
   sub-cent floating-point remainder would otherwise open a "loan" and flip hasLoan. */
function chargeCredits(amount){ if(amount<=0) return;
  if(state.res.credits>=amount){ state.res.credits-=amount; return; }
  const rem=amount-state.res.credits; state.res.credits=0;
  if(rem>1e-6){ state.debt+=rem; state.hasLoan=true; } }
function autoBuy(r,amount){ if(amount<=0) return; const unit=priceOf(r);
  if(!(unit>0)) return;                       // research & friends aren't tradeable — never grant them free
  const cost=amount*unit; chargeCredits(cost); state._cover=(state._cover||0)+cost; if(state.market[r]){ const m=state.market[r], impact=amount/(amount+400); m.price=Math.min(m.base*PRICE_MAX_MUL, m.price*(1+impact*0.3)); priceTouch(m); } }
function payCostWithCredit(cost){
  if(state.debug){ for(const r in cost) state.res[r]=Math.max(0,(state.res[r]||0)-cost[r]); return; }  // spend what you have, forgive the rest
  for(const r in cost){ if(r==='credits'){ chargeCredits(cost.credits); continue; } const have=state.res[r]||0, need=cost[r]; if(have>=need) state.res[r]-=need; else { state.res[r]=0; autoBuy(r, need-have); } } }

/* --- credit guard: refuse DISCRETIONARY spending that would push debt past 80% of the
   ceiling. Automatic deficit cover is never blocked — the grid must keep running. --- */
function creditNeed(cost){ let need=0; for(const r in cost){ if(r==='credits'){ need+=cost.credits; } else { const have=state.res[r]||0; if(have<cost[r]) need+=(cost[r]-have)*priceOf(r); } } return need; }
