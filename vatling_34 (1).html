  state.buildings.forEach(b=>{ const t=document.querySelector('.tile[data-id="'+b.id+'"]'); if(!t){ structural=true; return; }
    const el=t.querySelector('.tstat'); if(el) el.textContent=tileStatus(b);
    const bd=!isBuilt(b); if(t.classList.contains('bldg')!==bd) structural=true;
    /* any timed job drives the same bar; a module that gains or loses one restructures */
    const hasBar=!!t.querySelector('.bbar'), wantBar=!!jobOf(b);
    if(hasBar!==wantBar){ structural=true; return; }
    if(wantBar){ const i=t.querySelector('.bbar > i'); if(i) i.style.width=jobPct(b)+'%'; }
    t.classList.toggle('gest', !!(!bd&&BUILDINGS[b.type].gestate&&b.gestation));
    const lvl=ocLevel(b);
    t.classList.toggle('oc1', lvl===1); t.classList.toggle('oc2', lvl===2);
    t.classList.toggle('starved', !!(!bd&&b._sat!=null&&b._sat<0.999));
    const hl=view.adjHL[b.id]||null;
    t.classList.toggle('adjhl', !!hl);
    for(const k in ADJ_KINDS) t.classList.toggle('adj-'+k, hl===k); });
  if(structural){ renderColonyFull(); return; }
  let scafChanged=false;
  document.querySelectorAll('.scaf.pending').forEach(el=>{ const v=state.scaffold[el.dataset.scaf];
    if(!v||v===true){ scafChanged=true; return; }
    const i=el.querySelector('i'); if(i) i.style.width=Math.min(100,(v.p||0)/(v.t||SCAF_BUILD_SEC)*100)+'%'; });
  if(scafChanged){ renderColonyFull(); return; }
  updateDetailLive();
  document.querySelectorAll('.palitem[data-type]').forEach(pi=>{ const type=pi.dataset.type, cost=(type===SCAF_TOOL)?SCAF_COST:buildCost(type,0);
    const cel=pi.querySelector('.pi-cost'); if(!cel) return;
    const blocked=guardBlocked(cost);
    cel.classList.toggle('bad', blocked);
    cel.style.cssText = blocked? '' : costStyle(cost); });
  const hint=$('#colhint'); if(hint) hint.textContent=colHint(); }

/* Keep the selected building's card current while the clock runs — worker counts, vat
   progress and live trade-slot status all change under you. Skipped whenever focus is
   inside the panel, so an open dropdown or a half-typed number is never clobbered. */

function updateDetailLive(){ view.detailAcc+=TICK_MS; if(view.detailAcc<500) return; view.detailAcc=0;
  const d=$('#detail'); if(!d||view.selectedBuilding==null) return;
  if(d.contains(document.activeElement)) return;
  const b=state.buildings.find(x=>x.id===view.selectedBuilding); if(!b) return;
  const st=d.scrollTop; d.innerHTML=renderDetail(b); d.scrollTop=st; }
/* Rebuild ONLY the detail card and keep its scroll position. Editing a trade slot used to
   call a full render(), which threw the panel back to the top on every dropdown change. */
function refreshDetailPanel(){ const d=$('#detail'); if(!d||view.selectedBuilding==null) return false;
  const st=d.scrollTop; d.innerHTML=detailHTML(); d.scrollTop=st;
  renderTop(); renderGestBar(); renderTabs(); return true; }
function progRender(){ if(!refreshDetailPanel()) render(); }
function selectPending(type){ if(!isUnlocked(type)) return;
  if(view.pending&&view.pending.type===type){ view.pending=null; }
  else if(type===SCAF_TOOL){ view.pending={type,w:1,h:1,cells:rectCells(1,1)}; view.selectedBuilding=null; }
  else { const cells=shapeCells(type), bb=cellBounds(cells); view.pending={type,w:bb[0],h:bb[1],cells}; view.selectedBuilding=null; }
  render(); }
function cellFromEvent(e){ const b=$('#board'); const r=b.getBoundingClientRect(); return {x:Math.floor((e.clientX-r.left)/CELL), y:Math.floor((e.clientY-r.top)/CELL)}; }
function positionGhost(){ const g=$('#ghost'); if(!g)return; if(!view.pending||!view.hoverCell){ g.style.display='none'; return; }
  if(view.pending.type===SCAF_TOOL){ const x=view.hoverCell.x,y=view.hoverCell.y, occ=occMap(), on=isScaffold(x,y);
    g.style.display='flex'; g.style.left=x*CELL+'px'; g.style.top=y*CELL+'px'; g.style.width=CELL+'px'; g.style.height=CELL+'px';
    if(x<0||y<0||x>=COLS||y>=ROWS||occ[x+','+y]!=null){ g.className='pghost bad'; g.innerHTML=`<span>🧱</span><small>occupied</small>`; }
    else if(on){ g.className='pghost credit'; g.innerHTML=`<span>🧱</span><small>remove</small>`; }
    else if(guardBlocked(SCAF_COST)){ g.className='pghost bad'; g.innerHTML=`<span>🧱</span><small>credit limit</small>`; }
    else { g.className='pghost ok'; g.innerHTML=`<span>🧱</span><small>${canAfford(SCAF_COST)?'✓ frame':'⚑ on credit'}</small>`; }
    return; }
  const w=view.pending.w,h=view.pending.h,cells=view.pending.cells||rectCells(w,h);
  const ox=view.hoverCell.x-Math.floor(w/2),oy=view.hoverCell.y-Math.floor(h/2),chk=canPlace(view.pending.type,ox,oy,w,h,cells);
  g.style.display='flex'; g.style.left=ox*CELL+'px'; g.style.top=oy*CELL+'px'; g.style.width=w*CELL+'px'; g.style.height=h*CELL+'px';
  const shaped=cells.length!==w*h;
  const mask=shaped? cells.map(([dx,dy])=>`<div class="gcell" style="left:${dx*CELL}px;top:${dy*CELL}px;width:${CELL}px;height:${CELL}px"></div>`).join('') : '';
  const paint=(cls,label)=>{ g.className='pghost '+cls+(shaped?' shaped':'');
    g.innerHTML=mask+`<div class="gover"><span>${BUILDINGS[view.pending.type].icon}</span><small>${label}</small></div>`; };
  if(!chk.ok){ paint('bad',chk.reason); return; }
  const cost=siteCost(view.pending.type,0,absCells(cells,ox,oy)), disc=coreAdjacent(absCells(cells,ox,oy));
  if(!financeable(cost)&&!canAfford(cost)){ paint('bad','need '+unbuyableShort(cost).join(' ')); return; }
  if(guardBlocked(cost)){ paint('bad','credit limit'); return; }
  const scafN=scaffoldCountAt(cells,ox,oy), st=costState(cost);
  const scafTxt=scafN>0?` · 🧱${scafN} +${Math.round(scaffoldBonus(scafN)*100)}%`:'';
  const discTxt=disc?` · 🛰️ −${Math.round(CORE_COST_DISCOUNT*100)}%`:'';
  if(state.debug){ paint('ok', '🐞 debug — free'+scafTxt); return; }
  if(st==='stock'){ paint('ok', '✓ place'+discTxt+scafTxt); return; }
  if(st==='cash'){ paint('cash', `✓ buys ${Math.round(creditNeed(cost))} 💰 of stock${discTxt}${scafTxt}`); return; }
  /* Spell out the whole bill: what it actually costs in credits (materials bought at market
     included), how much of that becomes debt, and where that leaves you against the limit. */
  const need=creditNeed(cost), after=debtAfter(cost), incurred=Math.max(0, after-state.debt);
  const shortfall=[]; for(const r in cost){ if(r==='credits') continue;
    const miss=cost[r]-(state.res[r]||0); if(miss>0) shortfall.push(Math.ceil(miss)+RESOURCES[r].icon); }
  paint('credit', `⚑ borrows ${Math.round(incurred)} 💰${discTxt}${scafTxt}`
    + `</small><small>buys ${shortfall.join(' ')||'—'} · +${Math.round(incurred)} debt → ${Math.round(after)}/${Math.round(guardLimit())}`); }
function wireBoard(){ const board=$('#board'); if(!board) return;
  board.onmousemove=e=>{ view.hoverCell=cellFromEvent(e); positionGhost(); };
  board.onmouseleave=()=>{ const g=$('#ghost'); if(g) g.style.display='none'; };
  board.onclick=e=>{ const cell=cellFromEvent(e);
    if(view.pending){
      if(view.pending.type===SCAF_TOOL){ if(placeScaffold(cell.x,cell.y)) render(); else positionGhost(); return; }
      const {w,h}=view.pending,ox=cell.x-Math.floor(w/2),oy=cell.y-Math.floor(h/2);
      if(placeBuild(view.pending.type,ox,oy,w,h,view.pending.cells)) render(); else positionGhost();
    } else { const occ=occMap(); const id=occ[cell.x+','+cell.y]; view.selectedBuilding=id!=null?id:null; render(); } };
  /* right-click: eyedropper an existing module when nothing is selected, else cancel */
  board.oncontextmenu=e=>{ e.preventDefault();
    if(view.pending){ view.pending=null; view.selectedBuilding=null; render(); return; }
    const cell=cellFromEvent(e), occ=occMap(), id=occ[cell.x+','+cell.y];
    if(id!=null){ const b=byId(id), def=BUILDINGS[b.type];
      if(def.unique) logMsg('The '+def.name+' is unique — nothing to copy.','warn');
      else if(!isUnlocked(b.type)) logMsg('Cannot copy '+def.name+' — '+lockReason(b.type)+'.','warn');
      else { view.pending={type:b.type, w:b.w, h:b.h, cells:cellsOf(b).map(c=>[c[0],c[1]])}; view.selectedBuilding=null; view.palCat=def.cat;
        logMsg('Copied '+def.name+' — click to place another.','info'); render(); return; } }
    view.selectedBuilding=null; render(); }; }

/* ---------- Citizens ---------- */
function topSkills(c){ const a=Object.keys(c.skills||{}).filter(s=>IS_SKILL.has(s)).map(s=>[s,c.skills[s]]).filter(x=>x[1]>=0.3).sort((x,y)=>y[1]-x[1]).slice(0,4); return a.length? a.map(([s,v])=>`${CATSKILL[s].icon}<b>${CATSKILL[s].short}</b> ${v.toFixed(1)}`).join(' · ') : '<span class="hint">untrained</span>'; }
/* every trait render path goes through this, so a stale id can't crash a panel */
function knownTraits(list){ return (list||[]).filter(t=>TRAITS[t]); }
/* Traits & augments that actually matter for a posting in category `cat`, so you can see
   at a glance that a candidate has Science Affinity before assigning them to a lab.
   An affinity for a DIFFERENT category is irrelevant here and is omitted entirely — output
   and learning-rate modifiers apply to any posting, so those always show. */
/* v0.28 — DO THE ARITHMETIC FOR THE PLAYER.
   This used to emit one chip per source, so a colonist with Industrious, Adaptable and a
   Servo Frame showed "+25% out · +15% out · 🦾+35% out" and left you to add them up in a
   dropdown. Since v0.27 those genuinely do add, so the card can just say +75% and put the
   breakdown in the tooltip. At most two chips now — one for output, one for learning —
   and the ✦ affinity marker rides on the learning chip when one is contributing to it. */
function perkPools(c,cat){
  const pool={ out:{d:0, src:[], any:false}, learn:{d:0, src:[], any:false, aff:false} };
  const add=(k,delta,name)=>{ const P=pool[k]; P.d+=delta; P.any=true;
    P.src.push(name+' '+(delta>0?'+':'')+Math.round(delta*100)+'%'); };
  knownTraits(c.traits).forEach(t=>{ const T=TRAITS[t], e=T.effects;
    if(e.prod!=null)      add('out',   e.prod-1,      T.name);
    if(e.skillGain!=null) add('learn', e.skillGain-1, T.name);
    /* an affinity for a DIFFERENT tree is irrelevant to this posting and is left out
       entirely — that scoping predates this change and is still right */
    if(e.affinity && e.affinity.cat===cat){ pool.learn.aff=true; add('learn', e.affinity.mul-1, T.name); } });
  (c.augs||[]).forEach(a=>{ const A=AUGMENTS[a]; if(!A) return; const e=A.effects;
    if(e.prod!=null)      add('out',   e.prod-1,      '🦾 '+A.name);
    if(e.skillGain!=null) add('learn', e.skillGain-1, '🦾 '+A.name); });
  return pool; }
function relevantPerks(c,cat){ const pool=perkPools(c,cat), out=[];
  const chip=(k,label,pre)=>{ const P=pool[k]; if(!P.any) return;
    const pct=Math.round(P.d*100);
    /* the tooltip is where the individual sources live now — one line per source, then the
       net, so the number on the chip is always traceable */
    const full = P.src.length>1 ? P.src.join(' · ')+'  →  net '+(pct>0?'+':'')+pct+'%' : P.src[0];
    out.push({txt:(pre||'')+(pct>0?'+':'')+pct+'% '+label, full, good:P.d>0, sources:P.src.length}); };
  chip('out','out');
  chip('learn','learn', pool.learn.aff? '✦'+CATSKILL[cat].icon+' ' : '');
  return out; }
function perkText(c,cat){ const p=relevantPerks(c,cat); return p.length? ' · '+p.map(x=>x.txt).join(' · ') : ''; }
function perkChips(c,cat){ return relevantPerks(c,cat).map(x=>
  `<span class="perk${x.good?' good':''}${x.dim?' dim':''}" title="${x.full}">${x.txt}${x.sources>1?'<sup style="opacity:.6">×'+x.sources+'</sup>':''}</span>`).join(''); }
function traitChips(list,empty){ const t=knownTraits(list);
  return t.length? t.map(x=>`<span class="trait" style="color:${TRAITS[x].color};border-color:${TRAITS[x].color}55" title="${TRAITS[x].desc}">${TRAITS[x].name}</span>`).join('') : (empty||''); }
function openSlotCount(){ return state.buildings.filter(b=>BUILDINGS[b.type].role).reduce((a,b)=>a+Math.max(0,jobSlots(b)-jobFilled(b)),0); }
function assignOptions(c){ const cur=c.assign, byCat={};
  state.buildings.forEach(b=>{ const def=BUILDINGS[b.type]; if(!def.role||!isBuilt(b)) return; if(jobFilled(b)<jobSlots(b) || b.id===cur){ (byCat[def.cat]=byCat[def.cat]||[]).push(b); } });
  let o=`<option value="">— Unassigned —</option>`;
  CAT_ORDER.forEach(cat=>{ if(!byCat[cat]) return; byCat[cat].sort((a,b)=>a.id-b.id);
    o+=`<optgroup label="${cat}">`+byCat[cat].map(b=>`<option value="${b.id}" ${b.id===cur?'selected':''}>${BUILDINGS[b.type].icon} ${BUILDINGS[b.type].name} (${jobFilled(b)}/${jobSlots(b)})${cat==='Core'?'':perkText(c,cat)}</option>`).join('')+`</optgroup>`; });
  return o; }
/* One place decides whether a colonist's posting dropdown is live. Someone held by a
   gestation they started still shows their posting, but cannot be moved out of it. */
function assignSelectHTML(c){ const lock=crewLockOf(c);
  if(lock) return `<select disabled title="Held in the ${BUILDINGS[lock.type].name} until this embryo decants">${assignOptions(c)}</select>`;
  return `<select onchange="assignCitizen(${c.id},this.value)">${assignOptions(c)}</select>`; }
function ageChip(c){ const age=ageOf(c), life=lifespanOf(c), lp=Math.min(100,age/life*100), lc=lp<60?'var(--good)':lp<85?'var(--gold)':'var(--warn)'; return {age,life,lp,lc}; }
function citizenCard(c){ const a=ageChip(c), augs=c.augs||[], lock=crewLockOf(c);
  return `<div class="citizen" data-id="${c.id}"><div class="name">${lock?`<span title="Held in the ${BUILDINGS[lock.type].name} until this embryo decants">🔒</span>`:'🧑‍🚀'} ${c.name}<span class="spacer"></span><span class="cage" style="color:${a.lc}">⧗ ${a.age.toFixed(1)}/${a.life.toFixed(0)}</span></div>
    <div class="clifebar"><i style="width:${a.lp}%;background:${a.lc}"></i></div>
    <div class="traits">${traitChips(c.traits,'<span class="hint">no genetic traits</span>')}</div>
    ${augs.length?`<div class="traits">${augs.map(x=>`<span class="trait" style="color:#9fd0ff;border-color:#9fd0ff55" title="${AUGMENTS[x].desc}">${AUGMENTS[x].icon} ${AUGMENTS[x].name}</span>`).join('')}</div>`:''}
    <div class="skills">${topSkills(c)}</div>
    <div class="row">${assignSelectHTML(c)}</div></div>`; }
function autoAssignIdle(){ const idle=state.citizens.filter(c=>c.assign==null); let placed=0;
  idle.forEach(c=>{ const open=state.buildings.filter(b=>BUILDINGS[b.type].role && isBuilt(b) && jobFilled(b)<jobSlots(b)); if(!open.length) return;
    /* Core duty trains nothing, so it is always the last resort — never a tie-break winner.
       (catIdx puts Core at 0, so the old sort actively preferred it on ties.) */
    open.sort((a,b)=>{ const ca=BUILDINGS[a.type].cat==='Core'?1:0, cb=BUILDINGS[b.type].cat==='Core'?1:0;
      if(ca!==cb) return ca-cb;
      const sa=c.skills[BUILDINGS[a.type].cat]||0, sb=c.skills[BUILDINGS[b.type].cat]||0;
      return (sb-sa)||(catIdx(a)-catIdx(b)); });
    c.assign=open[0].id; placed++; });
  logMsg(placed? 'Auto-assigned '+placed+' idle citizen'+(placed>1?'s':'')+' by best skill fit.' : 'No open slots for idle citizens.', placed?'good':'info'); render(); }
/* Everything on this screen that is STRUCTURE rather than a moving number: who exists, where
   they are posted, which modules are finished, and how many slots each one offers. The live
   updater only patches ages and skill readouts, so anything in here needs a real rebuild —
   previously it watched the citizen id list alone, which meant a module finishing
   construction, a decant landing in the Core, or a posting changed from another tab left
   the groups, slot counts and assign dropdowns stale until you switched tabs and back. */
function staffSig(){
  return state.citizens.map(c=>c.id+'>'+(c.assign==null?'-':c.assign)+(isCrewLocked(c)?'L':'')).join(',')
    + '|' + state.buildings.filter(b=>BUILDINGS[b.type].role).map(b=>b.id+':'+(isBuilt(b)?1:0)+':'+jobSlots(b)).join(',')
    + '|' + housingCap(); }

function renderStaffing(){
  const view=$('#view'); const keep=view?view.scrollTop:0;
  view.staffSig=staffSig();
  const cits=state.citizens, idle=cits.filter(c=>c.assign==null), emp=cits.length-idle.length, open=openSlotCount();
  const avgAge=cits.length?(cits.reduce((a,c)=>a+ageOf(c),0)/cits.length):0;
  let h=`<div class="toolbar">
    <div class="stat"><span class="k">Population</span><span class="v" id="st-pop">${cits.length}/${housingCap()}</span></div>
    <div class="stat"><span class="k">Idle</span><span class="v" id="st-idle" style="color:${idle.length?'var(--gold)':'var(--ink)'}">${idle.length}</span></div>
    <div class="stat"><span class="k">Employed</span><span class="v" id="st-emp">${emp}</span></div>
    <div class="stat"><span class="k">Open Slots</span><span class="v" id="st-open">${open}</span></div>
    <div class="stat"><span class="k">Avg Age</span><span class="v" id="st-age">${avgAge.toFixed(1)}</span></div>
    <span class="spacer"></span>
    <button class="act gold" ${(idle.length&&open)?'':'disabled'} onclick="autoAssignIdle()">⚡ Auto-assign idle${idle.length?' ('+idle.length+')':''}</button></div>`;
  if(!cits.length){ h+=`<div class="empty">No citizens. Grow some in the Command Core or a Gestation Vat.</div>`; $('#view').innerHTML=h; return; }
  if(state.citizens.some(isCrewLocked)) h+=`<div class="hint" style="margin:-4px 0 8px">🔒 marks crew held by a gestation they started. Free slots on a growing vat stay open — anyone you post there now counts toward the next embryo, not the one in the tank.</div>`;
  /* --- v0.28: vacancies -------------------------------------------------------------
     A module with nobody posted to it used to be absent from this screen entirely, which
     is exactly backwards: an empty module is the one you most need to see. Every built
     staffable module now gets a group, empty ones included, the headers pin while you
     scroll, and the jump bar lists everything with an open slot. */
  const mods=state.buildings.filter(b=>BUILDINGS[b.type].role && isBuilt(b))
    .sort((a,b)=> (catIdx(a)-catIdx(b))||(a.id-b.id));
  const vac=mods.filter(b=>jobSlots(b)-jobFilled(b)>0);
  if(vac.length) h+=`<div class="vacbar"><span class="vb-h">🪧 Open slots</span>${vac.map(b=>{
      const def=BUILDINGS[b.type], free=jobSlots(b)-jobFilled(b);
      return `<button class="vacchip" onclick="jumpToStaffGroup(${b.id})" title="${def.name} · ${CATSKILL[def.cat].name} — ${free} free of ${jobSlots(b)}">
        <span>${def.icon}</span><span>${def.name}</span><b>${free}</b></button>`; }).join('')}
    <span class="spacer"></span><span class="hint" style="font-size:10px">${open} slot${open>1?'s':''} across ${vac.length} module${vac.length>1?'s':''}</span></div>`;
  h+=`<div class="cgroup-h idle">🚶 Unassigned <span class="cnt">${idle.length}</span></div>`;
  h+= idle.length? `<div class="grid cards cdense">${idle.map(citizenCard).join('')}</div>` : `<div class="hint" style="padding:2px 0 4px">Everyone's working. Grow more citizens to expand the workforce.</div>`;
  const byB={}; cits.forEach(c=>{ if(c.assign!=null)(byB[c.assign]=byB[c.assign]||[]).push(c); });
  mods.forEach(b=>{ const def=BUILDINGS[b.type], here=byB[b.id]||[], free=jobSlots(b)-jobFilled(b);
    h+=`<div class="cgroup-h" id="sg-${b.id}" style="color:${catColor(def.cat)}">${def.icon} ${def.name} · ${CATSKILL[def.cat].name}
        ${free>0?`<span class="free">${free} free</span>`:''}<span class="cnt">${jobFilled(b)}/${jobSlots(b)}</span></div>`;
    h+= here.length? `<div class="grid cards cdense">${here.map(citizenCard).join('')}</div>`
                   : `<div class="emptymod"><div class="em-h">${jobSlots(b)} job${jobSlots(b)>1?'s':''} unfulfilled.${def.cat==='Core'?'':', training no '+CATSKILL[def.cat].name}.</div>
        ${hirePool(b).length? `<select onchange="assignCitizen(this.value,${b.id})"><option value="">+ post someone here…</option>${hirePool(b).map(c=>
          `<option value="${c.id}">${c.name}${def.cat==='Core'?'':' · '+CATSKILL[def.cat].short+' '+(c.skills[def.cat]||0).toFixed(1)+perkText(c,def.cat)}</option>`).join('')}</select>`
        : `<div class="hint" style="font-size:11px">Zero unemployment.</div>`}</div>`; });
  $('#view').innerHTML=h;
  /* called straight from the tick when structure changes, so it holds its own scroll */
  if(keep>0){ const v=$('#view'); if(v){ void v.offsetHeight; v.scrollTop=keep; } }
}
function jumpToStaffGroup(id){ const el=document.getElementById('sg-'+id), v=$('#view');
  if(el&&v) v.scrollTop=Math.max(0, el.offsetTop-8); }
function updateStaffingLive(){
  if(staffSig()!==view.staffSig){
    /* never yank the page out from under an open dropdown — retry on the next tick */
    const v=$('#view'); if(v && v.contains(document.activeElement)) return;
    renderStaffing(); return; }
  state.citizens.forEach(c=>{ const a=ageChip(c); const card=document.querySelector('.citizen[data-id="'+c.id+'"]'); if(!card) return;
    const cg=card.querySelector('.cage'); if(cg){ cg.textContent='⧗ '+a.age.toFixed(1)+'/'+a.life.toFixed(0); cg.style.color=a.lc; }
    const bar=card.querySelector('.clifebar>i'); if(bar){ bar.style.width=a.lp+'%'; bar.style.background=a.lc; }
    const sk=card.querySelector('.skills'); if(sk) sk.innerHTML=topSkills(c); });
  const idle=state.citizens.filter(c=>c.assign==null).length, emp=state.citizens.length-idle, avgAge=state.citizens.length?(state.citizens.reduce((a,c)=>a+ageOf(c),0)/state.citizens.length):0;
  if($('#st-pop'))$('#st-pop').textContent=state.citizens.length+'/'+housingCap();
  if($('#st-idle')){ $('#st-idle').textContent=idle; $('#st-idle').style.color=idle?'var(--gold)':'var(--ink)'; }
  if($('#st-emp'))$('#st-emp').textContent=emp; if($('#st-open'))$('#st-open').textContent=openSlotCount(); if($('#st-age'))$('#st-age').textContent=avgAge.toFixed(1); }

/* =====================================================================
   CITIZENS ROSTER — colonist-first browsing, sorting and augment fitting.
   The old augment flow was augment-first (pick an implant, then a name from a
   dropdown), which asked you to choose a person by a name that carries no
   information. Here you look at the people, then decide what to fit.
   ===================================================================== */

function lifeLeft(c){ return Math.max(0, lifespanOf(c)-ageOf(c)); }
function goodTraits(c){ return knownTraits(c.traits).filter(t=>TRAITS[t].good).length; }
function badTraits(c){ return knownTraits(c.traits).filter(t=>!TRAITS[t].good).length; }
function bestSkill(c){ let k=null,v=-1; SKILL_CATS.forEach(s=>{ if((c.skills[s]||0)>v){ v=c.skills[s]||0; k=s; } }); return {k,v}; }
function postKey(c){ if(c.assign==null) return '￿'; const b=byId(c.assign); return b?BUILDINGS[b.type].name:'￾'; }
/* Columns are the sort control — click a header to sort, click again to reverse. The
   dropdowns are left for things a header can't express: filtering and which skill to show. */
const CIT_COLS = {
  name:  {cls:'cx-name',  label:()=>'Colonist',  cmp:(a,b)=>a.name.localeCompare(b.name),                 dir: 1},
  life:  {cls:'cx-life',  label:()=>'Life left', cmp:(a,b)=>lifeLeft(a)-lifeLeft(b),                       dir:-1},
  skill: {cls:'cx-skill', label:()=>CATSKILL[view.citSkill].short, cmp:(a,b)=>(a.skills[view.citSkill]||0)-(b.skills[view.citSkill]||0), dir:-1},
  traits:{cls:'cx-tr',    label:()=>'Traits',    cmp:(a,b)=>(goodTraits(a)-badTraits(a))-(goodTraits(b)-badTraits(b)), dir:-1},
  augs:  {cls:'cx-aug',   label:()=>'Aug',       cmp:(a,b)=>(a.augs||[]).length-(b.augs||[]).length,       dir:-1},
  post:  {cls:'cx-post',  label:()=>'Post',      cmp:(a,b)=>postKey(a).localeCompare(postKey(b)),          dir: 1},
};
const CIT_SHOWS = {
  all:   {name:'Everyone',            fn:()=>true},
  idle:  {name:'Idle only',           fn:c=>c.assign==null},
  posted:{name:'Posted only',         fn:c=>c.assign!=null},
  free:  {name:'Free augment slot',   fn:c=>(c.augs||[]).length<AUG_SLOTS},
  unaug: {name:'Unaugmented',         fn:c=>!(c.augs||[]).length},
  aug:   {name:'Augmented',           fn:c=>!!(c.augs||[]).length},
  aff:   {name:'Affinity for skill',  fn:c=>knownTraits(c.traits).some(t=>TRAITS[t].effects.affinity&&TRAITS[t].effects.affinity.cat===view.citSkill)},
};
function rosterList(){ const q=view.citQuery.trim().toLowerCase(), col=CIT_COLS[view.citSort]||CIT_COLS.life;
  return state.citizens
    .filter(c=>CIT_SHOWS[view.citShow].fn(c))
    .filter(c=>!q||c.name.toLowerCase().includes(q))
    .slice().sort((a,b)=>col.cmp(a,b)*view.citSortDir || a.name.localeCompare(b.name)); }
function setCitSort(k){ if(!CIT_COLS[k]) return;
  if(view.citSort===k) view.citSortDir=-view.citSortDir; else { view.citSort=k; view.citSortDir=CIT_COLS[k].dir; }
  renderRosterBody(); }
function setCitShow(v){ view.citShow=v; renderRosterBody(); }
function setCitSkill(v){ view.citSkill=v; renderRosterBody(); }
function setCitQuery(v){ view.citQuery=v; renderRosterBody(); }
function selectCitizen(id){ view.selectedCitizen=(view.selectedCitizen===id)?null:id; renderRosterBody(); }
function lifeColor(c){ const p=ageOf(c)/lifespanOf(c); return p<0.6?'var(--good)':p<0.85?'var(--gold)':'var(--warn)'; }
/* ---- batch selection: the filter picks the cohort, one click fits the augment ---- */
function toggleCitPick(id,ev){ if(ev&&ev.stopPropagation) ev.stopPropagation();
  if(view.citPicked.has(id)) view.citPicked.delete(id); else view.citPicked.add(id); renderRosterBody(); }
function pickedVisible(){ return rosterList().filter(c=>view.citPicked.has(c.id)); }
function pickAllFiltered(){ const list=rosterList(), all=list.length&&list.every(c=>view.citPicked.has(c.id));
  list.forEach(c=> all? view.citPicked.delete(c.id) : view.citPicked.add(c.id)); renderRosterBody(); }
function clearPick(){ view.citPicked.clear(); renderRosterBody(); }
function augEligible(id,list){ return list.filter(c=>!(c.augs||[]).includes(id) && (c.augs||[]).length<AUG_SLOTS); }
function augTip(a){ const cost=Object.keys(a.install).map(r=>a.install[r]+' '+RESOURCES[r].name).join(', ');
  return (a.name+'\n'+a.desc+'\nFit cost: '+cost+'\nTakes 1 of '+AUG_SLOTS+' slots · lost with the host unless Reclamation is researched').replace(/"/g,'&quot;'); }
function batchFit(id){ const a=AUGMENTS[id]; if(!a||!state.augments[id]) return;
  const target = pickedVisible().length? pickedVisible() : (view.selectedCitizen!=null? state.citizens.filter(c=>c.id===view.selectedCitizen) : []);
  const elig=augEligible(id,target);
  if(!elig.length){ logMsg('Nobody selected can take another '+a.name+'.','warn'); renderRosterBody(); return; }
  let done=0, halted=false;
  for(const c of elig){ if(guardBlocked(a.install)){ halted=true; break; }
    const before=(c.augs||[]).length; installAug(id,c.id,{quiet:true});
    if((c.augs||[]).length>before) done++; }
  logMsg(done? '🦾 '+a.name+' fitted to '+done+' colonist'+(done>1?'s':'')+(halted?' — stopped at the credit limit.':'.')
             : 'Could not fit '+a.name+' — over the credit limit.', done?'good':'warn');
  rosterRender(); }
/* One strip, context-sensitive: informational when nothing is picked, a bulk fitter when it
   is, and a one-click fitter for the colonist open in the detail panel. */
function augBarInner(){ if(!techHas('cybernetics')) return '';
  const unlocked=Object.keys(AUGMENTS).filter(id=>state.augments[id]);
  if(!unlocked.length) return `<span class="hint">No augments unlocked yet — unlock them in the Augments tab and they will appear here.</span>`;
  const picked=pickedVisible(), sel=state.citizens.find(c=>c.id===view.selectedCitizen);
  const target = picked.length? picked : (sel?[sel]:[]);
  const scope = picked.length? picked.length+' selected' : sel? sel.name : 'nobody selected';
  let h=`<span class="ab-h">🦾 Fit to <b>${scope}</b></span>`;
  unlocked.forEach(id=>{ const a=AUGMENTS[id], elig=augEligible(id,target);
    const total={}; for(const r in a.install) total[r]=a.install[r]*elig.length;
    const blocked=guardBlocked(a.install);
    h+=`<button class="augchip ${blocked?'off':costState(total)==='debt'?'credit':costState(total)==='cash'?'cash':''}" ${(!elig.length||blocked)?'disabled':''}
      title="${augTip(a)}" onclick="batchFit('${id}')">${a.icon} ${a.name}
      <small>${elig.length? '×'+elig.length+' · '+costStr(total) : (target.length?'none eligible':'pick colonists')}</small></button>`; });
  if(picked.length) h+=`<span class="spacer"></span><button class="ghost sm" onclick="clearPick()">clear selection</button>`;
  return h; }
function rosterRowHTML(c){ const left=lifeLeft(c), b=bestSkill(c), augs=c.augs||[];
  const post=c.assign!=null?(byId(c.assign)?BUILDINGS[byId(c.assign).type]:null):null;
  return `<div class="citrow ${view.selectedCitizen===c.id?'on':''} ${view.citPicked.has(c.id)?'picked':''}" data-cid="${c.id}" onclick="selectCitizen(${c.id})">
    <div class="cx-pick"><input type="checkbox" ${view.citPicked.has(c.id)?'checked':''} onclick="toggleCitPick(${c.id},event)"></div>
    <div class="cx-name">🧑‍🚀 ${c.name}</div>
    <div class="cx-life"><span style="color:${lifeColor(c)}">⧗ ${left.toFixed(1)}</span>
      <div class="clifebar"><i style="width:${Math.min(100,ageOf(c)/lifespanOf(c)*100)}%;background:${lifeColor(c)}"></i></div></div>
    <div class="cx-skill">${CATSKILL[view.citSkill].icon}${(c.skills[view.citSkill]||0).toFixed(1)}
      <span class="hint">· best ${b.k?CATSKILL[b.k].short+' '+b.v.toFixed(1):'—'}</span></div>
    <div class="cx-tr">${goodTraits(c)?`<span class="perk good">+${goodTraits(c)}</span>`:''}${badTraits(c)?`<span class="perk" style="color:var(--warn);border-color:#ff6b6b55">−${badTraits(c)}</span>`:''}</div>
    <div class="cx-aug">${augs.length?augs.map(a=>AUGMENTS[a]?`<span title="${augTip(AUGMENTS[a])}">${AUGMENTS[a].icon}</span>`:'').join(''):`<span class="hint">${techHas('cybernetics')?'—':''}</span>`}</div>
    <div class="cx-post" title="${post?post.name:'Unassigned'}">${post?post.icon:'<span class="hint">—</span>'}</div></div>`; }
function augSlotsHTML(c){ const augs=c.augs||[];
  let h=`<div class="palcat">Augments · ${augs.length}/${AUG_SLOTS}</div>`;
  if(!techHas('cybernetics')) return h+`<div class="hint">Research <b>Cybernetics</b> to fit augments.</div>`;
  const unlocked=Object.keys(AUGMENTS).filter(id=>state.augments[id]);
  if(!unlocked.length) h+=`<div class="hint">Nothing unlocked yet — unlock augments in the Augments tab, then fit them here.</div>`;
  let pickerShown=false;
  for(let i=0;i<AUG_SLOTS;i++){ const id=augs[i];
    if(id&&AUGMENTS[id]){ const a=AUGMENTS[id];
      h+=`<div class="augslot filled" title="${augTip(a)}"><div class="as-h">${a.icon} ${a.name}</div><div class="hint" style="font-size:11px">${a.desc}</div></div>`; continue; }
    const cands=unlocked.filter(x=>!augs.includes(x));
    /* the picker is drawn once, not repeated in every empty slot */
    if(!pickerShown && cands.length){ pickerShown=true;
      h+=`<div class="augslot"><div class="hint" style="font-size:10px;margin-bottom:3px">${AUG_SLOTS-augs.length} free slot${AUG_SLOTS-augs.length>1?'s':''} — hover for details, click to fit</div>
        <div class="augpick">${cands.map(x=>{ const a=AUGMENTS[x], aff=canAfford(a.install), blocked=guardBlocked(a.install);
          const ast=costState(a.install);
          return `<button class="augchip ${blocked?'off':ast==='debt'?'credit':ast==='cash'?'cash':''}" ${blocked?'disabled':''} title="${augTip(a)}" onclick="installAug('${x}',${c.id})">${a.icon} ${a.name}<small>${costStr(a.install)}${blocked?' · over limit':ast==='debt'?' · ⚑ borrows':ast==='cash'?' · 💰 bought':''}</small></button>`; }).join('')}</div></div>`; }
    else if(!cands.length) h+=`<div class="augslot empty">— empty · nothing left to fit —</div>`; }
  const left=lifeLeft(c), frac=globalMod('augReclaim',0);
  if(augs.length||left<8) h+=`<div class="cost ${(left<6&&!frac)?'bad':''}">${left.toFixed(1)} cycles remain · ${frac>0
      ? `♻ ${Math.round(frac*100)}% of install materials reclaimed on death`
      : 'augments are lost with the host — research Augment Reclamation'}</div>`;
  return h; }
function citizenDetailHTML(c){ if(!c) return `<div class="palhdr">Colonist</div><div class="hint">Pick someone from the roster to inspect them and fit augments.</div>`;
  const a=ageChip(c), post=c.assign!=null?byId(c.assign):null;
  let h=`<div class="palhdr">🧑‍🚀 ${c.name}</div>
    <div class="drow"><span class="cage" style="color:${a.lc}">⧗ ${a.age.toFixed(1)} / ${a.life.toFixed(0)}</span><span class="tag">${lifeLeft(c).toFixed(1)} left</span><span class="tag">❤ ${Math.round(c.health)}%</span></div>
    <div class="clifebar"><i style="width:${a.lp}%;background:${a.lc}"></i></div>
    <div class="palcat">Traits</div><div class="traits">${traitChips(c.traits,'<span class="hint">no genetic traits</span>')}</div>
    <div class="palcat">Skills</div>`;
  SKILL_CATS.forEach(s=>{ const v=c.skills[s]||0;
    h+=`<div class="skrow"><span class="sk-n">${CATSKILL[s].icon} ${CATSKILL[s].short}</span>
      <div class="skbar"><i style="width:${v/10*100}%"></i></div><span class="sk-v">${v.toFixed(1)}</span></div>`; });
  h+=`<div class="palcat">Posting</div>
    ${assignSelectHTML(c)}
    ${post?`<div class="cost">${BUILDINGS[post.type].icon} ${BUILDINGS[post.type].name}${BUILDINGS[post.type].cat==='Core'?' · trains no skill':' · trains '+CATSKILL[BUILDINGS[post.type].cat].name}</div>`:'<div class="cost">Unassigned — training nothing.</div>'}`;
  if(crewLockOf(c)) h+=`<div class="cost" style="color:var(--gold)">🔒 Held until the embryo decants — their skill was rolled into it.</div>`;
  h+=augSlotsHTML(c);
  const prod=cEffect(c,'prod',1), up=cEffect(c,'upkeep',1);
  h+=`<div class="palcat">Net effect</div><div class="perks">
    <span class="perk ${prod>1?'good':''}">output ×${prod.toFixed(2)}</span>
    <span class="perk ${up<1?'good':''}">upkeep ×${up.toFixed(2)}</span>
    <span class="perk">lifespan ${a.life.toFixed(0)}</span></div>`;
  return h; }
function rosterHeadHTML(){ const list=rosterList(), allPicked=list.length&&list.every(c=>view.citPicked.has(c.id));
  const head=Object.keys(CIT_COLS).map(k=>{ const col=CIT_COLS[k], on=view.citSort===k;
    return `<div class="${col.cls} sortable ${on?'on':''}" onclick="setCitSort('${k}')" title="sort by ${col.label()}">${col.label()}${on?(view.citSortDir>0?' ▲':' ▼'):''}</div>`; }).join('');
  return `<div class="citrow head"><div class="cx-pick"><input type="checkbox" ${allPicked?'checked':''} onclick="pickAllFiltered()" title="select everything the filter shows"></div>${head}</div>`; }
function rosterRowsHTML(){ const list=rosterList();
  return list.length? list.map(rosterRowHTML).join('') : '<div class="empty">Nobody matches that filter.</div>'; }
/* The toolbar is built ONCE and never rebuilt, so the search box keeps focus and the caret
   while you type. Everything that changes lives in #augbar / #citlist / #citdetail, each of
   which restores its own scroll position. */
/* Same idea as staffSig: the roster's Post column, its lock markers and the detail panel's
   posting dropdown all depend on state the row-level live patch never touches. */
function rosterSig(){
  return state.citizens.map(c=>c.id+'>'+(c.assign==null?'-':c.assign)+'>'+(c.augs||[]).length+(isCrewLocked(c)?'L':'')).join(',')
    + '|' + state.buildings.filter(b=>BUILDINGS[b.type].role).map(b=>b.id+':'+(isBuilt(b)?1:0)+':'+jobSlots(b)).join(',')
    + '|' + view.selectedCitizen + '|' + view.citSort + view.citSortDir + view.citShow + view.citSkill + '|' + view.citQuery; }

function renderRosterBody(force){ const lst=$('#citlist'); if(!lst){ renderRoster(); return; }
  view.rosterSig=rosterSig();
  const s1=lst.scrollTop; lst.innerHTML=rosterHeadHTML()+rosterRowsHTML(); lst.scrollTop=s1;
  const ab=$('#augbar'); if(ab){ const inner=augBarInner(); ab.innerHTML=inner; ab.style.display=inner?'':'none'; }
  const det=$('#citdetail');
  if(det && (force || !det.contains(document.activeElement))){ const s2=det.scrollTop;
    det.innerHTML=citizenDetailHTML(state.citizens.find(x=>x.id===view.selectedCitizen)||null); det.scrollTop=s2; }
  const showing=$('#rs-showing'); if(showing){ const p=pickedVisible().length;
    showing.innerHTML=`${rosterList().length}${p?` <span style="font-size:12px;color:var(--accent)">· ${p} picked</span>`:''}`; }
  const augd=$('#rs-aug'); if(augd) augd.textContent=state.citizens.filter(c=>(c.augs||[]).length).length+'/'+state.citizens.length;
  const idle=$('#rs-idle'); if(idle){ const n=state.citizens.filter(c=>c.assign==null).length;
    idle.textContent=n; idle.style.color=n?'var(--gold)':'var(--ink)'; }
  const pop=$('#rs-pop'); if(pop) pop.textContent=state.citizens.length; }
/* full rebuild — only when the tab is first drawn or the view was replaced wholesale */
function renderRoster(){
  const cits=state.citizens;
  const prevL=$('#citlist'), prevD=$('#citdetail');
  const s1=prevL?prevL.scrollTop:0, s2=prevD?prevD.scrollTop:0;
  let h=`<div class="toolbar" id="rosterbar">
    <div class="stat"><span class="k">Colonists</span><span class="v" id="rs-pop">${cits.length}</span></div>
    <div class="stat"><span class="k">Idle</span><span class="v" id="rs-idle">${cits.filter(c=>c.assign==null).length}</span></div>
    ${techHas('cybernetics')?`<div class="stat"><span class="k">Augmented</span><span class="v" id="rs-aug">0/0</span></div>`:''}
    <div class="stat"><span class="k">Showing</span><span class="v" id="rs-showing"></span></div>
    <span class="spacer"></span>
    <input class="citq" placeholder="search name…" value="${view.citQuery}" oninput="setCitQuery(this.value)">
    <select onchange="setCitShow(this.value)" title="filter the roster">${Object.keys(CIT_SHOWS).map(k=>`<option value="${k}" ${view.citShow===k?'selected':''}>${CIT_SHOWS[k].name}</option>`).join('')}</select>
    <select onchange="setCitSkill(this.value)" title="which skill column to show">${SKILL_CATS.map(k=>`<option value="${k}" ${view.citSkill===k?'selected':''}>${CATSKILL[k].icon} ${CATSKILL[k].name}</option>`).join('')}</select>
    </div>`;
  if(!cits.length){ h+=`<div class="empty">No colonists yet. Grow some in the Command Core or a Gestation Vat.</div>`; $('#view').innerHTML=h; return; }
  h+=`<div class="augbar" id="augbar"></div>
    <div class="citwrap">
      <div class="citlist" id="citlist"></div>
      <div class="citdetail" id="citdetail"></div></div>`;
  $('#view').innerHTML=h;
  renderRosterBody(true);
  const l=$('#citlist'), d=$('#citdetail'); if(l&&s1) l.scrollTop=s1; if(d&&s2) d.scrollTop=s2; }
function rosterRender(){ if(view.uiTab==='citizens' && $('#citlist')){ renderTop(); renderGestBar(); renderTabs(); renderRosterBody(true); }
  else render(); }
function updateRosterLive(){ const lst=$('#citlist');
  /* Gate on the CONTAINER, not on the row count. A search that matches nobody legitimately
     renders zero rows, and treating that as "the view was replaced" triggered a full
     renderRoster() every tick — which rebuilds the toolbar and steals focus from the search
     box you are still typing in. */
  if(!lst){ if(state.citizens.length) renderRoster(); return; }
  const rows=[...document.querySelectorAll('.citrow[data-cid]')];
  if(rows.length!==rosterList().length || rosterSig()!==view.rosterSig){
    const d0=$('#citdetail'); if(d0 && d0.contains(document.activeElement)) return;
    renderRosterBody(); return; }   // birth/death/repost: rebuild body, keep scroll
  rows.forEach(r=>{ const c=state.citizens.find(x=>x.id===+r.dataset.cid); if(!c) return;
    const l=r.querySelector('.cx-life span'); if(l){ l.textContent='⧗ '+lifeLeft(c).toFixed(1); l.style.color=lifeColor(c); }
    const bar=r.querySelector('.clifebar>i'); if(bar){ bar.style.width=Math.min(100,ageOf(c)/lifespanOf(c)*100)+'%'; bar.style.background=lifeColor(c); } });
  const d=$('#citdetail');
  if(d && !d.contains(document.activeElement)){ const sc=d.scrollTop;
    d.innerHTML=citizenDetailHTML(state.citizens.find(x=>x.id===view.selectedCitizen)||null); d.scrollTop=sc; } }

/* =====================================================================
   GESTATION BAR — promoted out of a tab and pinned under the resource strip,
   because growing citizens is the loop everything else feeds. Concise by design:
   quality, trait preview, progress, seed button, and a ⌖ jump to the module.
   ===================================================================== */

function gestModules(){ return state.buildings.filter(b=>BUILDINGS[b.type].gestate); }
function toggleGestBar(){ view.gestBarOpen=!view.gestBarOpen; view.gbSig=''; renderGestBar(); }
function gotoModule(id){ const b=byId(id); if(!b) return;
  view.uiTab='colony'; view.pending=null; view.selectedBuilding=id; closeResPop(); renderNow();
  const bw=$('#boardwrap'); if(bw){ bw.scrollLeft=(b.x+b.w/2)*CELL-bw.clientWidth/2; bw.scrollTop=(b.y+b.h/2)*CELL-bw.clientHeight/2; } }
/* The affordability flag used to be a single colony-wide "is there any gel at all", which
   is almost never false — so once a chip's Gestate button went gold for being unaffordable
   it stayed gold after the gel came back, until something else forced a rebuild. It is now
   PER CHIP, and updateGestBarLive patches the class every tick besides. */
function gestBarSig(){ return gestModules().map(b=>[b.id, isBuilt(b)?1:0, b.gestation?1:0, b.queued||0,
    b._housingBlocked?1:0, gestSeedCost(b), (state.res.nutrients>=gestSeedCost(b))?1:0,
    b.gestation?qualityStars(b.gestation.q||0):'',
    b.gestation?knownTraits(b.gestation.genome.traits).join('|'):'' ].join('~')).join(';')
  + '|' + (view.gestBarOpen?1:0) + (techHas('vat_sync')?'S':'') + (techHas('tandem_gest')?'T':''); }
function gestChipHTML(b){ const def=BUILDINGS[b.type], core=!!def.gestate.core, g=b.gestation, qc=queueCap();
  const label=core?'Command Core':'Gestation Vat';
  if(!isBuilt(b)) return `<div class="gchip" data-gid="${b.id}"><div class="gc-h">${def.icon} ${label}</div>
    <div class="gc-cost">${b.demo?'🧱 dismantling':'🏗 building'} — ${Math.round(jobPct(b))}%</div>
    <div class="gc-bar"><i style="width:${jobPct(b)}%;background:var(--gold)"></i></div>
    <div class="gc-act"><button class="ghost sm" onclick="gotoModule(${b.id})" title="go to this module">⌖</button></div></div>`;
  const q=gestQuality(b), defect=core&&!techHas('core_matrix');
  /* The stars sit right beside the trait preview for the embryo actually in the tank, so
     while something is growing they must show ITS locked quality, not what the crew would
     roll now. The tooltip carries both, and the seed button still prices the next roll. */
  const shownQ=(g&&g.q!=null)?g.q:q, stars=qualityStars(shownQ);
  const starTip=g? 'In the tank: '+qualityLabel(shownQ)+' — locked when this embryo was seeded. With the crew posted now, the next roll would be '+qualityLabel(q)+'.'
                 : 'Next roll: '+qualityLabel(q)+' — set by whoever is posted here at the moment you seed.';
  const pct=g?Math.min(100,g.progress/g.target*100):0;
  const cost=gestSeedCost(b), can=state.res.nutrients>=cost;
  /* the gel you are short is bought at market; whether that borrows is a credit question */
  const gst=costState({nutrients:cost});
  /* Nothing can be started or queued here right now: either the queue is full, or there is
     no queue at all because Tandem Gestation is unresearched and something is already
     growing. Say which — "queue full" on a vat with no queue is a confusing lie. */
  const full=!!(g&&(b.queued||0)>=qc);
  const why=full ? (qc? 'Queue is full — it decants before another can start.'
                      : 'Already gestating. Research Tandem Gestation to queue a second.')
                 : (can? 'Seed a citizen — paid from gel in hand'
                       : gst==='cash' ? 'Seed a citizen — the gel shortfall is bought at market, covered by credits'
                                      : 'Seed a citizen — the gel shortfall is bought on credit and becomes debt');
  return `<div class="gchip ${g?'run':''} ${b._housingBlocked?'blocked':''}" data-gid="${b.id}">
    <div class="gc-h">${def.icon} ${label} ${defect?'<span class="stars" style="color:var(--warn)" title="Core clones skew toward bad traits until the Somatic Cloning Matrix is researched.">defect-prone</span>':`<span class="stars" title="${starTip}">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span>`}${(b.queued||0)?`<span class="tag" style="padding:0 5px" title="embryos queued behind the one growing">+${b.queued}</span>`:''}</div>
    <div class="gc-tr">${g?traitChips(g.genome.traits,'<span class="hint" style="font-size:9px">plain genome</span>'):'<span class="hint" style="font-size:9px">idle</span>'}</div>

function renderGestBar(force){ const el=$('#gestbar'); if(!el) return;

  /* The bar scrolls horizontally once you have a few vats, and setting innerHTML resets

  const sx=el.scrollLeft;

function updateGestBarLive(){ gestModules().forEach(b=>{ const el=document.querySelector('.gchip[data-gid="'+b.id+'"]'); if(!el) return;
    const bar=el.querySelector('.gc-bar>i');
    if(bar){ if(!isBuilt(b)) bar.style.width=jobPct(b)+'%';
      else if(b.gestation) bar.style.width=Math.min(100,b.gestation.progress/b.gestation.target*100)+'%';
      else bar.style.width='0%'; }
    /* The seed button is cyan when you can pay for it and gold when it would go on credit.
       Both the price (quality moves it) and the balance change every tick, so patch both
       here rather than waiting for a signature change to force a rebuild. */
    if(!isBuilt(b)) return;
    const btn=el.querySelector('.gc-act .act'); if(!btn) return;
    const cost=gestSeedCost(b), can=state.res.nutrients>=cost, qc=queueCap();
    const full=!!(b.gestation && (b.queued||0)>=qc);
    /* unavailable outranks unaffordable — see the :disabled note in the stylesheet */
    const gst=costState({nutrients:cost});
    btn.classList.toggle('debt', !full && gst==='debt');
    btn.classList.toggle('gold', !full && gst==='cash');
    btn.disabled=full;
    btn.title = full ? (qc? 'Queue is full — it decants before another can start.'
                          : 'Already gestating. Research Tandem Gestation to queue a second.')
                     : (can? 'Seed a citizen — paid from gel in hand'
                           : 'Seed a citizen — the gel shortfall is bought on credit');
    const want=(b.gestation?'⧉ Queue ':'⬡ Gestate ')+cost+'🧫';
    if(btn.textContent!==want) btn.textContent=want; });
  /* Seed All prices every free vat at once, so it moves for the same reasons */
  const sa=document.querySelector('#gestbar .gb-lead button.ghost');
  if(sa && techHas('vat_sync')){ const free=gestModules().filter(gestFree);
    const total=free.reduce((a,b)=>a+gestSeedCost(b),0);
    sa.disabled=!free.length;

/* =====================================================================
   LEDGER — every flow in the colony, line by line, one row per source.
   Unlocked by Systems Telemetry. The numbers are not recomputed here: the tick writes
   state._ledger as it does the real arithmetic, so this tab cannot disagree with the
   simulation. Everything is a rate per second.
   ===================================================================== */
const LED_ORDER = ['energy','water','oxygen','minerals','alloys','composites','biomass','nutrients','research','credits'];
function ledLabel(id){
  if(typeof id==='number'){ const b=byId(id); if(!b) return {icon:'▪', name:'(removed module)', meta:''};
    const def=BUILDINGS[b.type], oc=ocLevel(b);
    const meta=[ 'Lv'+b.level, '('+b.x+','+b.y+')',
                 def.role? jobFilled(b)+'/'+jobSlots(b)+'👷' : '',
                 (b._op!=null? Math.round(b._op*100)+'%' : ''),
                 oc? OC_TIERS[oc].tag : '',
                 (b._sat!=null&&b._sat<0.999)? '⚠'+Math.round(b._sat*100)+'%' : ''
               ].filter(Boolean).join(' · ');
    return {icon:def.icon, name:def.name, meta, bid:b.id}; }
  if(id==='pop')   return {icon:'👥', name:'Colonist upkeep', meta:state.citizens.length+' colonists'};
  if(id==='trade') return {icon:'📡', name:'Standing trade orders', meta:'Exchange Terminal'};
  if(id==='debt')  return {icon:'🏦', name:'Debt autopay', meta:'broker order'};
  if(id==='cover') return {icon:'⚑', name:'Automatic deficit cover', meta:'bought at market, booked as debt'};
  if(String(id).startsWith('gest:')){ const b=byId(Number(String(id).slice(5)));
    return {icon:'⬡', name:'Gestation feed', meta:b?BUILDINGS[b.type].name+' ('+b.x+','+b.y+')':'—'}; }
  return {icon:'▪', name:String(id), meta:''}; }
/* Always unsigned — every call site supplies its own +/− prefix, and letting the number
   carry a sign too produced "−-0.02/s" on any negative net. */
function ledFmt(n){ const a=Math.abs(n);
  return (a>=100? a.toFixed(0) : a>=10? a.toFixed(1) : a.toFixed(2)); }
function ledNet(r){ return ledTotal(r,'prod')-ledTotal(r,'cons'); }
/* Anything actually going backwards is worth a pip on the tab. Utilities that are running a
   deficit are being bought on credit; a stored good draining is a slower version of the same
   problem, so both count. */
function ledAlertCount(){ if(!state._ledger) return 0; let n=0;
  LED_ORDER.forEach(r=>{ if(r==='credits'||r==='research') return;
    if(ledNet(r) < -1e-6) n++; });
  return n; }
function ledRowHTML(r,kind,row){ const L=ledLabel(row.id), cls=kind==='prod'?'p':'c';
  const click = L.bid!=null? ` onclick="gotoModule(${L.bid})" style="cursor:pointer"` : '';
  return `<div class="ledrow ${cls}"${click}><span>${L.icon}</span><span>${L.name}</span>
    <span class="lr-m">${L.meta}</span><span class="lr-a">${kind==='prod'?'+':'−'}${ledFmt(row.amt)}</span></div>`; }
function ledResHTML(r){ const R=RESOURCES[r], util=isUtil(r);
  const prod=ledRows(r,'prod'), cons=ledRows(r,'cons');
  const tp=ledTotal(r,'prod'), tc=ledTotal(r,'cons'), net=tp-tc;
  const E=(state._ledger||{})[r]||{};
  let stockLine='';
  if(util){ const cap=bufferCap(r), buf=state.res[r]||0;
    stockLine = cap>0? `buffer ${Math.round(buf)}/${cap}` : 'no buffer — deficits are bought at '+(UTIL_PRICE[r]||0).toFixed(2)+' 💰/unit';
    if(net<-1e-6 && cap>0) stockLine += ` · drains in ${Math.round(buf/-net)}s`;
  } else if(r==='research' || r==='credits'){
    /* v0.30 — neither has a meaningful cap (9,999,999 is a sentinel, not a warehouse), so a
       "x / y stored" figure and a fill ETA were noise on the two rows that never fill. */
    stockLine = `${fmt(state.res[r]||0)} held`;
  } else { const cap=resCap(r), have=state.res[r]||0;
    stockLine = `${fmt(have)} / ${fmt(cap)} stored`;
    if(net>1e-6 && have<cap) stockLine += ` · full in ${Math.round((cap-have)/net)}s`;

/* ---------- save / load ---------- */
const SAVE_KEY='vatling_save_v10', OLD_KEYS=['vatling_save_v7'];
function migrate(s){ s.grid=s.grid||{}; s.achievements=s.achievements||{}; s.augments=s.augments||{}; s.autoAug=s.autoAug||{}; s.scaffold=s.scaffold||{}; s.stats=s.stats||{}; s.techs=s.techs||{}; s.log=s.log||[];
  s.seenRes=s.seenRes||{};
  ['creditsEarned','loansRepaid','eldest','augsInstalled','salvaged','redlined'].forEach(k=>{ if(s.stats[k]==null) s.stats[k]=0; });
  s.debt=s.debt||0; s.hasLoan=s.hasLoan||false; s.gameOver=false; s.overCeiling=0; s.debug=!!s.debug; s.flow=s.flow||{cover:0,debt:0};
  /* Backfill per-resource, not just the whole object — a v0.11 save predates composites, so
     a bare `if(!s.market)` would leave it with no price entry and no stockpile number. */
  s.market=s.market||{};
  for(const r in PRICES) if(!s.market[r]||typeof s.market[r].price!=='number') s.market[r]={base:PRICES[r],price:PRICES[r],lo:PRICES[r],hi:PRICES[r]};
  /* v0.28: session watermarks. A save from before this round has never recorded them, so
     seed both from the current price rather than from base — that is the only figure we
     can honestly claim this market has reached. */
  for(const r in PRICES){ const m=s.market[r];
    if(typeof m.lo!=='number') m.lo=m.price; if(typeof m.hi!=='number') m.hi=m.price;
    m.lo=Math.min(m.lo,m.price); m.hi=Math.max(m.hi,m.price); }
  Object.keys(s.market).forEach(r=>{ if(!PRICES[r]) delete s.market[r]; });
  s.res=s.res||{};
  for(const r in RESOURCES) if(typeof s.res[r]!=='number') s.res[r]=0;
  Object.keys(s.res).forEach(r=>{ if(!RESOURCES[r]) delete s.res[r]; });
  Object.keys(s.seenRes).forEach(r=>{ if(!RESOURCES[r]) delete s.seenRes[r]; });
  /* Drop anything this build no longer knows about. An unknown tech id used to throw
     inside tech() and kill the whole tick loop; unknown skills / traits / module types
     crashed the panels that render them. */
  Object.keys(s.techs).forEach(id=>{ if(!TECHS[id]) delete s.techs[id]; });
  Object.keys(s.augments).forEach(id=>{ if(!AUGMENTS[id]) delete s.augments[id]; });
  Object.keys(s.autoAug).forEach(id=>{ if(!AUGMENTS[id]) delete s.autoAug[id]; });
  Object.keys(s.achievements).forEach(id=>{ if(!ACHIEVEMENTS[id]) delete s.achievements[id]; });
  s.buildings=(s.buildings||[]).filter(b=>!!BUILDINGS[b.type]);
  s.citizens=(s.citizens||[]).forEach?s.citizens:[];
  s.citizens.forEach(c=>{ if(c.born==null) c.born=s.tSec;
    if(!c.skills||Array.isArray(c.skills)) c.skills=blankSkills();
    Object.keys(c.skills).forEach(k=>{ if(!IS_SKILL.has(k)) delete c.skills[k]; });
    SKILL_CATS.forEach(k=>{ if(typeof c.skills[k]!=='number') c.skills[k]=0; });
    if(typeof c.health!=='number') c.health=100;
    c.augs=Array.isArray(c.augs)?c.augs.filter(a=>AUGMENTS[a]):[]; c.traits=(c.traits||[]).filter(t=>TRAITS[t]); });
  /* The Exchange Terminal became unique in v0.13. Older saves may hold several old-style
     Trade Hubs: keep the first, refund the rest rather than silently deleting them. */
  const hubs=s.buildings.filter(b=>b.type==='trade');
  if(hubs.length>1){ const keep=hubs[0]; let refund=0;
    hubs.slice(1).forEach(x=>{ const c=BUILDINGS.trade.cost;
      for(const r in c){ if(r==='credits') continue; s.res[r]=(s.res[r]||0)+Math.floor(c[r]*x.level*SALVAGE_REFUND); }
      refund++; });
    s.buildings=s.buildings.filter(b=>b.type!=='trade'||b===keep);
    s.log.unshift({t:'--',text:'The Exchange Terminal is now unique — '+refund+' surplus trade hub'+(refund>1?'s were':' was')+' decommissioned and half its materials returned.',kind:'warn'}); }
  s.buildings.forEach(b=>{ const def=BUILDINGS[b.type]; if(b.w==null)b.w=def.size[0]; if(b.h==null)b.h=def.size[1];
    if(typeof b.level!=='number'||b.level<1) b.level=1; b.level=Math.min(b.level, def.maxLevel||1);
    /* v0.23: overclock state. Anything unrecognised falls back to rated output; ocLevel()

       tech (or one loaded after debug stripped it) can never run hot by accident. */
    if(typeof b.oc!=='number'||!OC_TIERS[b.oc]) b.oc=0;
    /* Keep pre-v0.13 hubs on their old rectangular footprint — remasking a placed building
       to the T could overlap its neighbours. New ones get the real shape. */
    if(!Array.isArray(b.cells)||!b.cells.length) b.cells=rectCells(b.w,b.h);
    else { const bb=cellBounds(b.cells); b.w=bb[0]; b.h=bb[1]; }
    if(b.type==='trade'){ b.progs=Array.isArray(b.progs)?b.progs:[];
      b.progs=b.progs.map(p=>{ const d=defaultProg(); if(!p||typeof p!=='object') return d;
        const mode=TRADE_MODES[p.mode]?p.mode:'off';
        return {mode, target:(TRADE_MODES[mode].kind==='debt')?'debt':(p.target==='debt'?'debt':(p.target==='res'?'res':(mode!=='off'?'res':null))),
                active: (typeof p.active==='boolean')? p.active : (mode!=='off'),   // pre-v0.18 orders were always live
                res:PRICES[p.res]?p.res:'alloys',
                limit:typeof p.limit==='number'?p.limit:d.limit, pricePct:typeof p.pricePct==='number'?p.pricePct:d.pricePct,
                rate:typeof p.rate==='number'?p.rate:d.rate, credit:!!p.credit,

    }

      if(typeof b.build.scafN!=='number') b.build.scafN=Math.round((b.build.scaf||0)*n);
      b.build.scaf=n?b.build.scafN/n:0;
      /* v0.27: what the placement was charged and which raised frames it ate, so a cancel
         can hand both back. A pre-v0.27 save has neither — price it at the base cost and
         assume it consumed nothing, which is the conservative reading in both directions. */
      if(!b.build.paid || typeof b.build.paid!=='object') b.build.paid=buildCost(b.type,0);
      if(!Array.isArray(b.build.scafCells)) b.build.scafCells=[];

    /* v0.27: the two other timed jobs. Anything malformed is simply dropped — a module

    if(!okJob(b.demo)) delete b.demo; else b.demo={progress:Math.max(0,+b.demo.progress||0), target:b.demo.target};
    if(b.demo) delete b.upg;
    else if(!okJob(b.upg)) delete b.upg;
    else b.upg={progress:Math.max(0,+b.upg.progress||0), target:b.upg.target,
                paid:(b.upg.paid&&typeof b.upg.paid==='object')?b.upg.paid:{}, toLevel:b.level+1};
    if(b.upg && b.level>=(def.maxLevel||1)) delete b.upg;   // maxed while the save sat idle
    if(b.build) delete b.upg;                                // an unbuilt module cannot be upgrading
    if(def.gestate){ if(typeof b.queued!=='number') b.queued=0; b.queued=Math.max(0,Math.floor(b.queued));
      /* v0.25: what each queued embryo was actually charged, so the roll can be settled
         when it starts. A pre-v0.25 save has no record — `null` means "charge nothing
         either way", which is exactly the old behaviour. */
      b.qpaid = Array.isArray(b.qpaid) ? b.qpaid.slice(0,b.queued).map(x=> typeof x==='number'? x : null) : [];
      while(b.qpaid.length<b.queued) b.qpaid.push(null);
      if(b.gestation){ const g=b.gestation;
        if(!g.genome||!Array.isArray(g.genome.traits)) b.gestation=null;
        else { g.genome.traits=g.genome.traits.filter(t=>TRAITS[t]);
               if(!g.genome.skills||Array.isArray(g.genome.skills)) g.genome.skills=blankSkills();
               if(g.target==null) g.target=def.gestate.time; if(g.progress==null) g.progress=0;
               if(typeof g.q!=='number') g.q=0;
               /* v0.25: crew held by this roll. Old saves sealed the vat instead, so an

    } else { delete b.gestation; delete b.queued; delete b.qpaid; } });
  /* v0.27: the research project. Drop it if the tech is gone, already owned, or its
     prerequisites no longer hold — the cost is refunded rather than silently eaten. */
  { const R=s.research;
    if(R && typeof R==='object' && TECHS[R.id] && !s.techs[R.id]
        && TECHS[R.id].requires.every(r=>s.techs[r]) && typeof R.target==='number' && R.target>0){
      s.research={id:R.id, progress:Math.max(0,+R.progress||0), target:R.target,
                  paid:(R.paid&&typeof R.paid==='object')?R.paid:{}}; }
    else { if(R && R.paid) for(const r in R.paid) s.res[r]=(s.res[r]||0)+R.paid[r];
      s.research=null; } }
  const cmd=s.buildings.find(b=>b.type==='command'); if(cmd){ cmd.build=null; delete cmd.demo; delete cmd.upg; if(cmd.x==null){ cmd.x=Math.floor(COLS/2-cmd.w/2); cmd.y=Math.floor(ROWS/2-cmd.h/2); } }
  state=s; s.buildings.forEach(b=>{ if(b.x==null||b.y==null){ const spot=findSpot(b.type,b.w,b.h,b.cells)||{x:0,y:0}; b.x=spot.x; b.y=spot.y; } });

  const live=new Set(s.buildings.map(b=>b.id));
  s.citizens.forEach(c=>{ if(c.assign!=null && !live.has(c.assign)) c.assign=null; });
  /* the terminal shed slots (was 2+level, now == level), so trim over-capacity postings */
  s.buildings.forEach(b=>{ if(!BUILDINGS[b.type].role) return; const cap=BUILDINGS[b.type].slots+(b.level-1);
    let staff=s.citizens.filter(c=>c.assign===b.id);

  reconcileTradeSlots();
  if(typeof s.nextId!=='number' || s.nextId<=0) s.nextId=1;
  const maxId=Math.max(0,...s.buildings.map(b=>b.id||0),...s.citizens.map(c=>c.id||0));
  if(s.nextId<=maxId) s.nextId=maxId+1;

     re-reveals everything it has already touched, so nothing vanishes on load */
  view.shownRes=''; refreshSeenRes(); }
/* Transient per-tick fields are prefixed with "_" (b._workers held live references to
   citizen objects, so a naive stringify duplicated every crew member's full record into
   its building and ballooned the save). Drop them all on the way out. */
function serializeState(){ return JSON.stringify(state, (k,v)=> (k.charAt&&k.charAt(0)==='_') ? undefined : v); }
function saveGame(quiet){ try{ localStorage.setItem(SAVE_KEY,serializeState()); if(!quiet) logMsg('Game saved.','good'); }catch(e){ if(!quiet) logMsg('Save failed (storage blocked). Use Export.','warn'); } if(!quiet) render(); }
function loadGame(){ try{ let s=localStorage.getItem(SAVE_KEY);
    if(!s){ for(const k of OLD_KEYS){ s=localStorage.getItem(k); if(s){ logMsg('Loading an older save — migrating.','info'); break; } } }
    if(!s){ logMsg('No save found.','warn'); render(); return; }
    const p=JSON.parse(s); migrate(p); view.pending=null; view.selectedBuilding=null; logMsg('Game loaded.','good'); render();
  }catch(e){ logMsg('Load failed.','warn'); } }
function exportGame(){ const blob=new Blob([serializeState()],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='vatling-save.json'; a.click(); logMsg('Exported save file.','info'); }
function importGame(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const p=JSON.parse(r.result); migrate(p); view.pending=null; view.selectedBuilding=null; logMsg('Save imported.','good'); render(); }catch(x){ logMsg('Invalid save file.','warn'); } }; r.readAsText(f); }; inp.click(); }
function confirmReset(){ if(confirm('Start a new colony? Unsaved progress will be lost.')){ newGame(); render(); } }

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{ if((e.key==='r'||e.key==='R')&&view.pending&&view.pending.type!==SCAF_TOOL){
    view.pending.cells=rotateCells(view.pending.cells||rectCells(view.pending.w,view.pending.h));
    const bb=cellBounds(view.pending.cells); view.pending.w=bb[0]; view.pending.h=bb[1]; positionGhost(); }
  if(e.code==='Space'){ const tn=(e.target&&e.target.tagName)||'';
    if(/INPUT|TEXTAREA|SELECT/.test(tn)) return;
    e.preventDefault();                                  // also stops Space activating a focused button
    togglePause(); return; }
  { const tn=(e.target&&e.target.tagName)||'';
    if(!/INPUT|TEXTAREA|SELECT/.test(tn)){
      konamiKey(e.key);                                        // don't eat the roster search box
      const SPEED_KEYS={'0':0,'1':1,'2':2,'3':4};
      if(e.key in SPEED_KEYS && !state.gameOver){ setSpeed(SPEED_KEYS[e.key]); return; } } }
  if(e.key==='Escape'){
    /* layered escape: clear what's in hand first, then fall back to the Colony screen */
    let cleared=false;
    if(view.popRes){ closeResPop(); cleared=true; }
    if(view.pending||view.selectedBuilding!=null){ view.pending=null; view.selectedBuilding=null; cleared=true; }
    if(!cleared && view.uiTab!=='colony'){ switchTab('colony'); return; }
    if(view.uiTab==='colony') render(); } });
const KONAMI=['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a','enter'];

function konamiKey(k){ view.kseq.push(String(k).toLowerCase()); if(view.kseq.length>KONAMI.length) view.kseq.shift();
  if(view.kseq.length===KONAMI.length && KONAMI.every((x,i)=>x===view.kseq[i])){ view.kseq=[]; toggleDebug(); } }
function toggleDebug(){ state.debug=!state.debug;
  logMsg(state.debug? '🐞 DEBUG MODE ON — unlocks are free and construction ignores the debt limit.'
                    : '🐞 Debug mode off.', state.debug?'warn':'info');
  render(); }
function togglePause(){ if(state.gameOver) return;
  if(state.speed===0) state.speed=state._resume||1; else { state._resume=state.speed; state.speed=0; }
  renderTop(); }

/* =====================================================================
   v0.26 — ANIMATION LAYER GROUNDWORK
   Enabling seams only. Nothing here draws anything, and nothing here is read by the tick.
   The rule this round establishes:
       `state` is SIMULATION and is serialized.
       `view`  is PRESENTATION, is never serialized and is never read by the tick.
   Sprite caches, camera position, animation phase and LOD tier all land in `view` later.
   ===================================================================== */

/* ---------- deterministic per-citizen visual identity ----------
   Lifted verbatim from claude/citizen-composer-proto.html so the prototype and the game
   produce the SAME clone from the same id. Do not "improve" these — if they drift, every
   colonist changes appearance and the prototype stops being a preview of anything.
   Pure functions of c.id: no new state, nothing saved, nothing in migrate(). */
function hash32(n){ n=Math.imul(n^0x9E3779B9,0x85EBCA6B); n^=n>>>13; n=Math.imul(n,0xC2B2AE35); n^=n>>>16; return n>>>0; }
function mulberry32(a){ return function(){ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pickR=(arr,r)=>arr[Math.floor(r()*arr.length)];
const VISUAL_WORLD_SEED = 1337;                     // the prototype's WORLD_SEED
function visualSeed(c){ const id=(c&&c.id!=null)?c.id:0; return hash32(id ^ VISUAL_WORLD_SEED); }
/* the prototype re-seeds sprite params independently of the genome roll — same formula here */
function spriteSeed(c){ const id=(c&&c.id!=null)?c.id:0; return hash32((id*7919) ^ 0xBEEF ^ VISUAL_WORLD_SEED); }
function visualRng(c){ return mulberry32(visualSeed(c)); }
function spriteRng(c){ return mulberry32(spriteSeed(c)); }

/* ---------- where workers stand inside a module ----------
   N deterministic positions across the footprint, N = jobSlots(b). Returned in GRID units
   (fractional cells), so it is independent of CELL / zoom. Spreads across cells rather than
   filling them in order, which is what keeps the Exchange Terminal's brokers along the T's
   bar instead of stacked on its stem; workers that must share a cell are spaced within it.
   Unwired — the animation layer is its only consumer. */
function workPositions(b){ if(!b) return []; const n=jobSlots(b); if(n<=0) return [];
  const cells=cellsOf(b), m=cells.length, per={}, out=[];
  for(let i=0;i<n;i++){ const ci=Math.min(m-1, Math.floor(i*m/n)); (per[ci]=per[ci]||[]).push(i); }
  Object.keys(per).forEach(ci=>{ const grp=per[ci], k=grp.length, c=cells[ci];
    grp.forEach((i,j)=>{ const t=(k===1)?0.5:(j+1)/(k+1);
      out[i]={ slot:i, cell:[b.x+c[0], b.y+c[1]], x:b.x+c[0]+t, y:b.y+c[1]+0.5 }; }); });
  return out; }

/* ---------- __vat — test-facing query surface ----------
   The suites used to assert against DOM selectors (.tile[data-id], .citizen[data-id], …),
   which makes every render change a test change and blocks ever moving the board to canvas.
   Everything below is a READ, except the clearly-fenced __vat.test.* constructors.
   Those exist because two of the recurring harness pitfalls were construction bugs:
   buildNew() silently no-ops when findSpot can't satisfy the anchor rule, and reading
   state.buildings[length-1] afterwards then refers to the PREVIOUS building. spawn()
   bypasses placement entirely and hands back the object it made. */
const __vat = {
  version: '0.34',
  /* v0.34 — the interaction latch, in the terms a test wants to ask about it: is a paint
     currently held, and how long is the ceiling. */
  holding:          () => holdingPointer(),
  holdMax:          () => HOLD_MAX_MS,
  holdGrace:        () => HOLD_GRACE_MS,
  alertMoreOpen:    () => !!view.alMoreOpen,
  /* v0.32 — display ordering and the overflow split, so a test can assert which alert holds
     the always-visible row without reading the DOM. */
  alertsShown:      () => alertsForDisplay().map(a=>a.key),
  alertPrimary:     () => { const l=alertsForDisplay(); return l.length? l[0].key : null; },
  /* v0.31 — condition alerts, the finance panel, and the one predicate every purple
     surface colours on, so a test can check the rule rather than each call site. */
  wouldBorrow:    cost => costsDebt(cost||{}),
  costState:      cost => costState(cost||{}),
  alertKind:        k  => { const a=(view.alerts||[]).find(x=>x.key===k); return a? a.kind : null; },
  alertCond:        k  => { const a=(view.alerts||[]).find(x=>x.key===k); return a? !!a.cond : null; },
  alertHeld:        k  => { const a=(view.alerts||[]).find(x=>x.key===k); return a? alertHeld(a) : null; },
  condPending:      () => Object.keys(view.condAt||{}),
  alertDebounce:    () => ALERT_DEBOUNCE,
  alertCondTtl:     () => ALERT_COND_TTL,
  finance:          () => ({ debt:state.debt, ceiling:debtCeiling(), limit:borrowLimit(),
                             guard:guardLimit(), score:creditScore(), rate:interestRate() }),
  /* v0.30 — alerts, freight, and the wall clock the TTLs run on */
  alerts:           () => (view.alerts||[]).map(a=>({key:a.key, kind:a.kind, text:a.text, n:a.n, at:a.at, go:a.go})),
  alert:            k  => (view.alerts||[]).find(a=>a.key===k) || null,
  wallSec:          () => wallSec,
  alertTtl:         () => ALERT_TTL,
  brokerRate:      cid => { const c=state.citizens.find(x=>x.id===cid); return c? brokerRate(c) : null; },
  /* v0.28 — the ledger, market watermarks and the aggregated perk chips */
  ledger:           () => state._ledger || null,
  ledgerNet:        r  => ledNet(r),
  ledgerRows:  (r,k)   => ledRows(r,k),
  market:           r  => { const m=state.market[r]; return m? {price:m.price, base:m.base,
                              pct:m.price/m.base*100, lo:m.lo, hi:m.hi,
                              loPct:m.lo/m.base*100, hiPct:m.hi/m.base*100} : null; },
  priceRails:       () => ({min:PRICE_MIN_PCT, max:PRICE_MAX_PCT}),
  perks:       (cid,cat)=> { const c=state.citizens.find(x=>x.id===cid); return c? relevantPerks(c,cat) : null; },
  vacancies:        () => state.buildings.filter(b=>BUILDINGS[b.type].role && isBuilt(b))
                            .map(b=>({id:b.id, type:b.type, free:jobSlots(b)-jobFilled(b)})).filter(x=>x.free>0),
  dirty:            () => !!view.dirty,
  /* v0.27 — timed jobs and the research project, so suites never poke at b.build directly */
  job:              id => { const b=byId(id), o=jobOf(b); return o? {kind:o.kind, progress:o.j.progress,
                              target:o.j.target, pct:jobPct(b), eta:etaSeconds(b)} : null; },
  jobTimes:         id => { const b=byId(id); return b? {build:buildSeconds(cellsOf(b).length),
                              salvage:salvageSeconds(b), upgrade:upgradeSeconds(b)} : null; },
  research:         () => { const R=state.research; if(!R) return null;
                            return {id:R.id, progress:R.progress, target:R.target, pct:researchPct(),
                                    eta:researchEta(), rate:researchRate(), paid:{...(R.paid||{})}}; },
  researchRate:     () => researchRate(),
  techState:        id => techState(id),
  discovered:       () => Object.keys(TECHS).filter(techDiscovered),
  ocMul:        (id,r) => { const b=byId(id); return b? ocInMul(b,r) : null; },
  renderNow:        () => renderNow(),
  state:            () => state,
  ui:               () => ({ tab:view.uiTab, buildingId:view.selectedBuilding, citizenId:view.selectedCitizen,
                             pendingType: view.pending? view.pending.type : null, gestBar:view.gestBarOpen }),
  building:         id => byId(id) || null,
  buildingsOfType:  t  => state.buildings.filter(b=>b.type===t),
  buildingAt:     (x,y)=> { const id=occMap()[x+','+y]; return id!=null ? (byId(id)||null) : null; },
  isBuilt:          id => { const b=byId(id); return !!b && isBuilt(b); },
  citizen:          id => state.citizens.find(c=>c.id===id) || null,
  citizensAt:      bid => state.citizens.filter(c=>c.assign===bid),
  idle:             () => state.citizens.filter(c=>c.assign==null),
  slots:            id => { const b=byId(id); return b? {total:jobSlots(b), filled:jobFilled(b),
                              open:Math.max(0,jobSlots(b)-jobFilled(b))} : null; },
  slot:          (bid,i)=> { const b=byId(bid); if(!b||b.type!=='trade') return null;
                             const p=progsOf(b)[i]; if(!p) return null;
                             return { prog:p, broker:slotBroker(b,p), ready:progReady(p), active:!!p.active }; },
  res:              k  => state.res[k],
  cap:              k  => resCap(k),
  buffer:           u  => bufferCap(u),
  grid:             u  => (state.grid && state.grid[u]) || null,
  housing:          () => ({ pop:state.citizens.length, cap:housingCap() }),
  debt:             () => ({ owed:state.debt, ceiling:debtCeiling(), guard:guardLimit(),
                             rate:interestRate(), score:creditScore() }),
  /* neighbour ids plus which bonuses are actually live, so a test never re-derives them */
  adjacency:        id => { const b=byId(id); if(!b) return null; refreshAdjacency();
                            const def=BUILDINGS[b.type];
                            return { neighbors: nbrIds(b).slice(),
                                     supplyLinks: prodAdjLinks(b), supplyBonus: prodAdjBonus(b),
                                     habitatLinks: habitatLinks(b), upkeepDiscount: upkeepDiscount(b),
                                     geneLab: vatBoost(b),
                                     coreDiscount: b.type!=='command' && coreAdjacent(footprint(b)),
                                     storageBoosted: def.storage
                                       ? Object.keys(def.storage).filter(r=>storageAdjMul(b,r)>1) : [] }; },
  gestation:        id => { const b=byId(id); if(!b||!BUILDINGS[b.type].gestate) return null;
                            const g=b.gestation;
                            return { growing:!!g, q: g? g.q : null, progress: g? g.progress/g.target : 0,
                                     crew: g? (g.crew||[]).slice() : [], queued: b.queued||0,
                                     qpaid: (b.qpaid||[]).slice(), nextQuality: gestQuality(b),
                                     seedCost: gestSeedCost(b), holdsCrew: gestCrewMatters(b) }; },
  crewLock:        cid => { const c=state.citizens.find(x=>x.id===cid); if(!c) return null;
                            const b=crewLockOf(c); return b? b.id : null; },
  verb:             id => { const b=byId(id); return b? (BUILDINGS[b.type].verb||null) : null; },
  workPositions:    id => workPositions(byId(id)),
  visualSeed:      cid => visualSeed({id:cid}),
  spriteSeed:      cid => spriteSeed({id:cid}),
  /* --- constructors: the only mutating members, deliberately fenced --- */
  test: {
    spawn(type,x,y,opts){ opts=opts||{};
      /* Placement rules are bypassed on purpose, but UNIQUENESS is not a placement rule —
         it is a save invariant. A second Exchange Terminal loads fine and is then quietly
         decommissioned by migrate(), which surfaces as an unrelated building-count failure
         much later. Fail loudly here instead. */
      if(BUILDINGS[type].unique && countOf(type)>0 && !opts.force)
        throw new Error('__vat.test.spawn: '+BUILDINGS[type].name+' is unique and one already exists — '
                      + 'change the existing one, or pass {force:true} if you are deliberately '
                      + 'testing migrate() repairing a duplicate.');
      const o=inst(type,x,y);
      if(opts.building) o.build={progress:0, target:buildSeconds(cellsOf(o).length), scafN:0, scaf:0};
      else o.build=null;
      if(opts.level) o.level=Math.min(opts.level, BUILDINGS[type].maxLevel||1);
      state.buildings.push(o); return o; },
    finish(id){ const b=byId(id); if(b) b.build=null; return b||null; },
    citizen(opts){ opts=opts||{}; const c=addCitizen(opts.genome||blankGenome());
      if(opts.skills) for(const k in opts.skills) if(IS_SKILL.has(k)) c.skills[k]=opts.skills[k];
      if(opts.assign!==undefined) c.assign=opts.assign;
      return c; },
    post(cid,bid){ assignCitizen(cid,bid); return state.citizens.find(x=>x.id===cid)||null; },
  },
};
if(typeof window!=='undefined') window.__vat = __vat;

/* ---------- BOOT ---------- */
newGame(); renderNow();
function renderLoop(){ renderIfDirty(); requestAnimationFrame(renderLoop); }
if(typeof requestAnimationFrame==='function') requestAnimationFrame(renderLoop);
setInterval(()=>{
  /* wall clock, so alert TTLs do not accelerate with game speed and do not run while paused */
  wallSec += TICK_MS/1000;
  if(expireAlerts() && !holdingPointer()) renderAlerts(true);   /* the next tickLive redraws it */
  tick(); trackRates(); renderIfDirty(); }, TICK_MS);
setInterval(()=>{ if(!state.gameOver) saveGame(true); }, 30000);
</script>
</body>
