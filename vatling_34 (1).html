function guardLimit(){ return debtCeiling()*CREDIT_GUARD; }
/* --- v0.33: THREE STATES, NOT TWO ------------------------------------------------------
   The colour was keyed on canAfford(), which asks "is every line item already in stock?".
   That is the wrong question. A build costing 25🔩 when you hold none but have 9,000💰 is
   paid for outright — payCostWithCredit buys the alloys at market and books no debt — yet
   it rendered purple, promising a loan that never happened.

   What matters is whether the spend ends with you owing more than you did:
     stock — everything is on the shelf; nothing is bought, nothing is borrowed
     cash  — something has to be bought at market, and credits on hand cover it   → GOLD
     debt  — credits do not cover it, so the shortfall becomes debt               → PURPLE
   Everything that colours a price goes through costState(); nothing calls canAfford() to
   decide a colour any more. */
function costState(cost){ if(!cost) return 'stock';
  if(debtAfter(cost) > state.debt + 1e-6) return 'debt';
  return canAfford(cost) ? 'stock' : 'cash'; }
function costsDebt(cost){ return costState(cost)==='debt'; }
function costClass(cost){ const st=costState(cost); return st==='debt'?'debt':st==='cash'?'gold':''; }
function costStyle(cost){ const st=costState(cost);
  return st==='debt'?'color:var(--debt)':st==='cash'?'color:var(--gold)':''; }
/* A resource with no market price cannot be bought, so a cost containing one cannot be
   financed at all — it has to come out of stock. Without this, creditNeed() prices the
   shortfall at zero, the guard waves it through, and payCostWithCredit's autoBuy silently
   no-ops: you would get the module for free. Research already dodged this because buyTech
   gates on canAfford; every other spend path needs the same rule stated once. */
function financeable(cost){ for(const r in cost){ if(r==='credits') continue;
    if(!(priceOf(r)>0)) return false; } return true; }
function unbuyableShort(cost){ const miss=[];
  for(const r in cost){ if(r==='credits'||priceOf(r)>0) continue;
    const m=cost[r]-(state.res[r]||0); if(m>0) miss.push(Math.ceil(m)+' '+RESOURCES[r].icon); }
  return miss; }
function guardBlocked(cost){ if(state.debug) return false;
  if(!financeable(cost) && !canAfford(cost)) return true;
  const after=debtAfter(cost); return after>guardLimit() && after>state.debt+1e-6; }
function guardMsg(){ return '⛔ Blocked: that would push debt past '+Math.round(CREDIT_GUARD*100)+'% of your ceiling ('+Math.round(guardLimit())+' 💰). Sell stock, repay debt, or raise your credit score first.'; }
function blockMsg(cost){ if(cost && !financeable(cost) && !canAfford(cost)){
    const miss=unbuyableShort(cost);
    const m='⛔ Blocked: short '+(miss.join(' ')||'materials')+' — that cannot be bought on the market, so you have to produce it first.';
    raiseAlert('spend.stock','warn', m, "switchTab('colony')");
    return m; }
  raiseAlert('spend.guard','warn', guardMsg(), "switchTab('market')");
  return guardMsg(); }

/* ---------- resource visibility ----------
   The strip only shows what the colony can actually get its hands on. On cycle 1 that
   trims the wall of numbers a new player faces, and later it turns each new material into
   a small reveal instead of a row that has read 0 for an hour. Once seen, a resource stays
   seen — the bar must never reflow backwards under the cursor. */
function touchesRes(type,set){ const d=BUILDINGS[type];
  if(d.production) for(const r in d.production) set.add(r);
  if(d.consumption) for(const r in d.consumption) set.add(r); }
function refreshSeenRes(){ const s=state.seenRes=state.seenRes||{};
  s.credits=true;
  for(const k in RESOURCES) if((state.res[k]||0)>1e-4) s[k]=true;
  const set=new Set();
  /* anything a module you already own touches, in any direction */
  state.buildings.forEach(b=>{ const d=BUILDINGS[b.type]; touchesRes(b.type,set);
    if(d.storage) for(const r in d.storage) set.add(r);
    if(d.buffer)  for(const r in d.buffer)  set.add(r);
    if(d.cost)    for(const r in d.cost)    set.add(r); });
  /* plus the flows of anything you could build right now — reveals a step ahead of need */
  for(const t in BUILDINGS) if(isUnlocked(t)) touchesRes(t,set);
  let gained=null;
  set.forEach(r=>{ if(RESOURCES[r] && !s[r]){ s[r]=true; gained=gained||r; } });
  return gained; }
function resShown(k){ return !!(state.seenRes&&state.seenRes[k]); }

function endGame(msg){ state.gameOver=true; state.speed=0; state._goMsg=msg; logMsg('💀 COLONY LOST — '+msg,'warn'); }
function restartGame(){ newGame(); render(); }

/* ---------- staffing & gestation quality ---------- */
/* def.skillScale (default 1) multiplies how hard a module rewards skill — the Composite
   Fabricator leans on it, so a trained crew matters far more there than at a mining rig. */
const SKILL_PER_POINT = 0.08;
function workerProd(c,b){ const def=BUILDINGS[b.type];
  let p=0.25+(c.skills[def.cat]||0)*SKILL_PER_POINT*(def.skillScale||1);
  p=cEffect(c,'prod',p); p*=(c.health/100); return p; }
function staffing(b){ const def=BUILDINGS[b.type]; let auto=def.autonomy!=null?def.autonomy:0; if(def.role) auto=Math.min(1,auto+globalMod('autonomyAdd',0));
  if(!def.role) return {factor:auto, workers:[]};
  const workers=state.citizens.filter(c=>c.assign===b.id); let sum=0; workers.forEach(c=>sum+=workerProd(c,b)); return {factor:auto+sum, workers}; }
function vatQuality(b){ let q=0; state.citizens.filter(c=>c.assign===b.id).forEach(c=> q += 0.5 + (c.skills.Vats||0)*0.12 ); return q + vatBoost(b).quality + globalMod('traitQuality',0)*0.8; }
function coreQuality(b){ if(techHas('core_matrix')){ let q=0.6; state.citizens.filter(c=>c.assign===b.id).forEach(c=> q += 0.3 + (c.skills.Vats||0)*0.1 ); return q + vatBoost(b).quality + globalMod('traitQuality',0)*0.8; } return -1.3; }
function gestQuality(b){ return BUILDINGS[b.type].gestate.core ? coreQuality(b) : vatQuality(b); }
function qualityStars(q){ return Math.max(0,Math.min(5,Math.round(q*1.2))); }
function qualityLabel(q){ return q<0.6?'Basic':q<1.5?'Standard':q<2.5?'Good':q<3.5?'High':'Elite'; }
function qualityHTML(b){ const def=BUILDINGS[b.type];
  if(def.gestate.core && !techHas('core_matrix')) return `<div class="cost" style="color:var(--warn)">⚠ Low-grade cloning — defect-prone</div><div class="hint" style="font-size:10px">Core clones skew toward bad traits. Research <b>Somatic Cloning Matrix</b> to upgrade the core into a proper vat.</div>`;
  const q=gestQuality(b), s=qualityStars(q);
  const stars=v=>`<span class="stars">${'★'.repeat(qualityStars(v))}${'☆'.repeat(5-qualityStars(v))}</span>`;
  /* While something is growing, the live crew figure is NOT what is in the tank — that was
     rolled and stored at seed time. Show both, or restaffing looks like it did nothing. */
  if(b.gestation && b.gestation.q!=null){ const lq=b.gestation.q;
    return `<div class="cost">In the tank: ${stars(lq)} ${qualityLabel(lq)} <span class="hint">· locked at seed</span></div>
      <div class="cost">Next roll: ${stars(q)} ${qualityLabel(q)} <span class="hint">· current crew</span></div>
      <div class="hint" style="font-size:10px">Raised by skilled gene-crafters, attached Gene Labs &amp; Gene Splicing. Crew added now improve the <b>next</b> embryo, including one already queued.</div>`; }
  return `<div class="cost">Quality: ${stars(q)} ${qualityLabel(q)}</div><div class="hint" style="font-size:10px">Raised by skilled gene-crafters, attached Gene Labs & Gene Splicing.</div>`; }
function queueCap(){ return globalMod('queue',0); }
function gestFree(b){ return isBuilt(b) && (!b.gestation || (b.queued||0) < queueCap()); }
/* Everything about a gestation card that changes its LAYOUT (not just its progress bar).
   The live updater compares this and does a full rebuild when it shifts — otherwise the
   card silently keeps showing a finished build, a stale queue count, or the previous
   genome's trait preview after a queued birth chains. */
function gestSig(b){ return [isBuilt(b)?1:0, b.gestation?1:0, b.queued||0, b._housingBlocked?1:0,
  b.gestation&&b.gestation.genome? knownTraits(b.gestation.genome.traits).join('|') : ''].join('~'); }

/* =====================================================================
   TICK
   ===================================================================== */
function tick(){
  if(state.speed===0||state.gameOver) return;
  const dt=(TICK_MS/1000)*state.speed; state.tSec+=dt;
  if(state.tSec>=state.cycle*60){ state.cycle++; logMsg('Cycle '+state.cycle+' begins.','info'); }
  const upMul=globalMod('upkeepMul',1), prodMul=globalMod('prodMul',1), bRate=globalMod('buildRate',1);
  const debtBefore=state.debt; state._cover=0;
  const OCC=occMap(); state.buildings.forEach(b=>{ b._nbr=neighborsOf(b,OCC); });

  /* v0.30 — debug finishes any timed work on the next tick. Deliberately a RATE and not a
     zero target: every job still opens, logs, and closes through its normal completion path,
     so debug exercises the same code the player does rather than a shortcut around it. */
  const jRate = state.debug ? 1e6 : bRate;
  /* --- scaffold frames raise themselves first --- */
  for(const k in state.scaffold){ const v=state.scaffold[k]; if(v===true) continue;
    v.p=(v.p||0)+dt*jRate; if(v.p>=(v.t||SCAF_BUILD_SEC)) state.scaffold[k]=true; }
  /* --- timed jobs. Iterated BACKWARDS because finishSalvage splices the module out. --- */
  for(let i=state.buildings.length-1;i>=0;i--){ const b=state.buildings[i];
    if(b.build){ b.build.progress += dt*jRate*(1+scaffoldBonus(b.build.scafN));
      if(b.build.progress>=b.build.target){ b.build=null; logMsg('🏗 '+BUILDINGS[b.type].name+' construction complete.','good'); }
      continue; }
    if(b.demo){ b.demo.progress += dt*jRate;
      if(b.demo.progress>=b.demo.target) finishSalvage(b);
      continue; }
    if(b.upg){ b.upg.progress += dt*jRate;
      if(b.upg.progress>=b.upg.target) finishUpgrade(b); } }
  /* --- research runs on its own clock, driven by staffed lab capacity --- */
  advanceResearch(dt);

  const op0={};
  state.buildings.forEach(b=>{ const def=BUILDINGS[b.type];
    if(!isBuilt(b)){ b._factor=0; b._workers=[]; b._op=0; op0[b.id]=0; b._adjOut=1; b._upDisc=0; b._sat=1; b._short=null; return; }
    const st=staffing(b); b._factor=st.factor; b._workers=st.workers;
    b._op = def.role ? st.factor : (def.autonomy!=null?def.autonomy:1)*b.level; op0[b.id]=b._op;
    b._adjOut=1+prodAdjBonus(b); b._upDisc=upkeepDiscount(b); });

  /* --- INPUT GATING ---------------------------------------------------------------
     A module short of a TRADEABLE input still runs and buys the shortfall on credit —
     that is the deliberate design, and it is why the loss condition is financial. But an
     input with no market price cannot be bought at all: autoBuy refuses it, the old code
     then zeroed the stock and produced anyway, and the module ran on nothing forever.
     Instead, throttle the module to the fraction of its unbuyable inputs it actually has.
     Computed against state.res rather than the stock snapshot, because the snapshot is
     taken after the utility pass has already charged credits. */
  state.buildings.forEach(b=>{ b._sat=1; b._short=null; if(!isBuilt(b)) return;
    const def=BUILDINGS[b.type]; if(!def.consumption) return;
    const op=op0[b.id]; if(op<=0) return;
    let sat=1, short=null;
    for(const r in def.consumption){ if(isUtil(r)||priceOf(r)>0) continue;
      const need=def.consumption[r]*dt*op*ocInMul(b,r); if(need<=1e-9) continue;
      const s=Math.min(1,(state.res[r]||0)/need); if(s<sat){ sat=s; short=r; } }
    b._sat=Math.max(0,sat); b._short=short; });

  let popW=0, popO=0; state.citizens.forEach(c=>{ const disc=c.assign!=null?((byId(c.assign)||{})._upDisc||0):0; popW+=cEffect(c,'upkeep',0.06)*upMul*(1-disc); popO+=cEffect(c,'upkeep',0.07)*upMul*(1-disc); });

  ledReset();
  const sup={energy:0,water:0,oxygen:0}, dem={energy:0,water:0,oxygen:0};
  state.buildings.forEach(b=>{ if(!isBuilt(b)) return; const def=BUILDINGS[b.type], T=ocTier(b), op=op0[b.id]*b._sat;
    if(def.production) for(const r in def.production){ if(isUtil(r)){ const a=def.production[r]*op*prodMul*b._adjOut*T.out; sup[r]+=a; ledAdd(r,'prod',b.id,a); } }
    if(def.consumption) for(const r in def.consumption){ if(isUtil(r)){ const a=def.consumption[r]*op*ocInMul(b,r); dem[r]+=a; ledAdd(r,'cons',b.id,a); } } });
  dem.water+=popW; dem.oxygen+=popO;
  ledAdd('water','cons','pop',popW); ledAdd('oxygen','cons','pop',popO);
  state.grid={};
  for(const u of UTIL){ const net=sup[u]-dem[u], cap=bufferCap(u); let bought=0;
    if(net>=0){ state.res[u]=Math.min(cap,(state.res[u]||0)+net*dt); }
    else { let deficit=(-net)*dt; const fromBuf=Math.min(state.res[u]||0, deficit); state.res[u]=(state.res[u]||0)-fromBuf; deficit-=fromBuf; if(deficit>1e-9){ bought=deficit; autoBuy(u, deficit); } }
    state.grid[u]={s:sup[u], d:dem[u], net, bought}; }

  const stock={}; for(const k in RESOURCES){ if(!isUtil(k)) stock[k]=state.res[k]; }
  state.buildings.forEach(b=>{ if(!isBuilt(b)) return; const def=BUILDINGS[b.type], T=ocTier(b), op=op0[b.id]*b._sat;
    if(def.consumption) for(const r in def.consumption){ if(!isUtil(r)){ const need=def.consumption[r]*dt*op*ocInMul(b,r); ledAdd(r,'cons',b.id,need/dt); if(stock[r]>=need) stock[r]-=need; else { autoBuy(r, need-stock[r]); stock[r]=0; } } }
    if(def.production) for(const r in def.production){ if(!isUtil(r)){ let out=def.production[r]*dt*op*prodMul*b._adjOut*T.out;
        if(r==='research') b._workers.forEach(c=> out+=cEffect(c,'research',0)*dt*0.1);
        ledAdd(r,'prod',b.id,out/dt);
        /* clamp the ADDITION, never the holding: salvaging a depot drops the cap below what
           you are already carrying, and Math.min() would have deleted the difference */
        const cap=resCap(r); if(stock[r]<cap){ if(stock[r]+out>cap) ledCap(r); stock[r]=Math.min(cap, stock[r]+out); }
        else if(out>0) ledCap(r);
        if(r==='credits') state.stats.creditsEarned+=out; } }
    if(def.gestate && b.gestation){ const feed=gestFeedRate(b)*dt; ledAdd('nutrients','cons','gest:'+b.id,feed/dt); if(stock.nutrients>=feed) stock.nutrients-=feed; else { autoBuy('nutrients', feed-stock.nutrients); stock.nutrients=0; }
      b.gestation.progress+=dt*globalMod('vatSpeed',1)*(1+vatBoost(b).speed); if(b.gestation.progress>=b.gestation.target) decant(b); }
  });
  let needN=0; state.citizens.forEach(c=>{ const disc=c.assign!=null?((byId(c.assign)||{})._upDisc||0):0; needN+=cEffect(c,'upkeep',0.10)*upMul*(1-disc)*dt; });
  ledAdd('nutrients','cons','pop',needN/dt);
  if(stock.nutrients>=needN) stock.nutrients-=needN; else { autoBuy('nutrients', needN-stock.nutrients); stock.nutrients=0; }
  state.citizens.forEach(c=>{ c.health=Math.min(100,c.health+3*dt);
    if(c.assign!=null){ const b=byId(c.assign); if(b&&isBuilt(b)&&BUILDINGS[b.type].role){ const cat=BUILDINGS[b.type].cat; if(cat!=='Core') c.skills[cat]=Math.min(10,(c.skills[cat]||0)+skillGainRate(c,cat)*dt); } }
    const a=ageOf(c); if(a>state.stats.eldest) state.stats.eldest=a; });
  for(const k in stock) state.res[k]=stock[k];
  runTradeHubs(dt);            // standing orders act on final stock levels

  for(let i=state.citizens.length-1;i>=0;i--){ const c=state.citizens[i]; if(ageOf(c)>=lifespanOf(c)){
    const back=reclaimAugments(c);
    unassignAll(c.id); if(view.selectedCitizen===c.id) view.selectedCitizen=null; state.citizens.splice(i,1);
    logMsg('⧗ '+c.name+' passed away of old age at '+ageOf(c).toFixed(0)+' cycles.'+(back?' ♻ Reclaimed '+back+' from their augments.':''),'info'); } }
  reconcileTradeSlots();

  for(const r in state.market){ const m=state.market[r]; m.price += (m.base-m.price)*PRICE_REVERT*dt + (Math.random()-0.5)*m.base*PRICE_NOISE*dt; m.price=Math.max(m.base*PRICE_MIN_MUL, Math.min(m.base*PRICE_MAX_MUL, m.price)); priceTouch(m); }
  if(state.debt>0) state.debt += state.debt*(interestRate()/60)*dt;
  state.flow={cover: state._cover/dt, debt:(state.debt-debtBefore)/dt};
  const gained=refreshSeenRes();
  if(gained) logMsg(RESOURCES[gained].icon+' '+RESOURCES[gained].name+' is now within reach — it has joined the resource strip.','info');
  for(const id in ACHIEVEMENTS){ if(!state.achievements[id] && ACHIEVEMENTS[id].test()){ state.achievements[id]=true;
    /* remember WHICH one, so the score alert can say why the number moved rather than just
       that it did — transient, consumed by checkAlerts() later this same tick */
    (state._newAch=state._newAch||[]).push(ACHIEVEMENTS[id].name);
    logMsg('🏅 Achievement: '+ACHIEVEMENTS[id].name+' — credit score +'+ACHIEVEMENTS[id].pts+'.','good'); } }
  /* Foreclosure now has a grace window instead of firing the instant you cross the line.
     The ceiling is derived partly from population, so an aging wave used to shrink it under
     a standing debt and end the run with no warning and nothing the player could react to. */
  if(!state.gameOver){
    if(state.debt>debtCeiling()){
      const was=state.overCeiling||0; state.overCeiling=was+dt;
      if(state.overCeiling>=FORECLOSE_GRACE)
        endGame('Unpaid debt of '+Math.round(state.debt)+' 💰 sat above your ceiling of '+debtCeiling()+' 💰 for '+FORECLOSE_GRACE+' seconds. Your creditors have foreclosed and seized the colony.');
      else if(Math.floor(state.overCeiling/5)!==Math.floor(was/5))
        logMsg('⚠ DEBT ABOVE CEILING ('+Math.round(state.debt)+'/'+debtCeiling()+' 💰) — creditors foreclose in '+Math.ceil(FORECLOSE_GRACE-state.overCeiling)+'s. Sell stock or repay now.','warn');
    } else {
      if(state.overCeiling>0) logMsg('Debt back under the ceiling — foreclosure averted.','good');
      state.overCeiling=0;
    }
    if(!state.gameOver && state.citizens.length===0) endGame('The last citizen is gone — no one remains to run the colony.');
  }

  checkAlerts();
  tickLive();
}

/* ---------- gestation ---------- */
/* Gestation economy. Better clones cost more BOTH up front and per second — the seed
   scales with quality so a Gene Lab's speed bonus can't undercut the price of a good clone
   by simply finishing sooner. Quality is locked in when growth starts, so shuffling
   gene-crafters mid-grow doesn't retroactively change the bill. */
const GEST_SEED_BASE   = 50;
const GEST_SEED_PER_Q  = 6;
const GEST_FEED_BASE   = 0.6;
const GEST_FEED_PER_Q  = 0.18;
function gestSeedCost(b,q){ if(q==null) q=gestQuality(b); return Math.round(GEST_SEED_BASE + GEST_SEED_PER_Q*Math.max(0,q)); }
function gestFeedRate(b,q){ if(q==null) q=(b.gestation&&b.gestation.q!=null)?b.gestation.q:gestQuality(b);
  return GEST_FEED_BASE*(1+GEST_FEED_PER_Q*Math.max(0,q))*globalMod('upkeepMul',1); }
function gestSpeedMul(b){ return Math.max(0.0001, globalMod('vatSpeed',1)*(1+vatBoost(b).speed)); }
function gestSeconds(b){ return BUILDINGS[b.type].gestate.time/gestSpeedMul(b); }
function gestGrowCost(b,q){ return gestFeedRate(b,q)*gestSeconds(b); }
function gestTotalCost(b,q){ if(q==null) q=gestQuality(b); return gestSeedCost(b,q)+gestGrowCost(b,q); }
function gestCostLine(b){ const q=gestQuality(b);
  return `Seed <b style="color:var(--ink)">${gestSeedCost(b,q)}</b> ${rIcon('nutrients')} + grow ~${Math.round(gestGrowCost(b,q))} = <b style="color:var(--ink)">${Math.round(gestTotalCost(b,q))}</b> ${rIcon('nutrients')} total`; }
function startGestation(b){ const def=BUILDINGS[b.type], q=gestQuality(b);
  /* Snapshot the crew whose skill just went into this roll. They are held until the decant;
     anyone who arrives later is free to leave and counts toward the next roll instead. */
  const crew = gestCrewMatters(b) ? state.citizens.filter(c=>c.assign===b.id).map(c=>c.id) : [];
  b.gestation={progress:0, target:def.gestate.time, genome:rollGenome(q), q, crew}; }
/* Queued embryos are paid for when you queue them, but rolled when they actually start —
   which is the point, since crew you add mid-grow are supposed to improve the next one.
   That leaves a price gap either way, so settle it at start rather than let an unstaffed
   vat bank cheap seeds and then staff up for free. */
function settleQueuedSeed(b,paid){ if(paid==null || !b.gestation) return;
  const now=gestSeedCost(b, b.gestation.q), delta=now-paid;
  if(Math.abs(delta)<0.5) return;
  if(delta>0){ if(state.res.nutrients<delta){ autoBuy('nutrients', delta-state.res.nutrients); state.res.nutrients=delta; }
    state.res.nutrients-=delta;
    logMsg('The queued embryo rolled richer than it was seeded for — '+Math.round(delta)+' 🧫 topped up to cover the better genome.','info'); }
  else { addRes('nutrients', -delta);
    logMsg('The queued embryo rolled leaner than it was seeded for — '+Math.round(-delta)+' 🧫 refunded.','info'); } }
function seedGestation(b,opts){ opts=opts||{}; const def=BUILDINGS[b.type]; if(!def.gestate) return false;
  if(!isBuilt(b)){ if(!opts.quiet) logMsg(b.demo?'That module is being dismantled.':'That module is still under construction.','warn'); return false; }
  const already = !!b.gestation;
  if(already && (b.queued||0) >= queueCap()){ if(!opts.quiet) logMsg(queueCap()? 'Queue is full.' : 'Already gestating.','warn'); return false; }
  const need=gestSeedCost(b);
  if(state.res.nutrients<need){
    if(opts.noCredit){ if(!opts.quiet) logMsg('Not enough nutrient gel to seed ('+need+' needed).','warn'); return false; }
    autoBuy('nutrients', need-state.res.nutrients); state.res.nutrients=need; }
  state.res.nutrients-=need;
  if(already){ b.queued=(b.queued||0)+1; (b.qpaid=b.qpaid||[]).push(need);
    if(!opts.quiet) logMsg('Queued another citizen behind the one growing ('+b.queued+'/'+queueCap()+') for '+need+' 🧫 — it is rolled when it starts, so crew added before then still count.','info'); }
  else { startGestation(b); if(!opts.quiet) logMsg((def.gestate.core?'Command Core':'Gestation Vat')+' started growing a citizen — '+need+' 🧫 seed, ~'+Math.round(gestGrowCost(b))+' 🧫 to term.','info'); }
  if(!opts.quiet) render();
  return true; }
/* Vat Synchronisation: fill every free vat and queue slot in one click. Deliberately will
   NOT buy gel on credit — a bulk action shouldn't be able to spring a debt on you. */
function seedAllVats(){ if(!techHas('vat_sync')){ logMsg('Research Vat Synchronisation first.','warn'); return; }
  let n=0, guard=0, progress=true;
  while(progress && guard++<64){ progress=false;
    gestModules().forEach(b=>{ if(gestFree(b) && seedGestation(b,{quiet:true,noCredit:true})){ n++; progress=true; } }); }
  logMsg(n? '⇶ Seeded '+n+' gestation'+(n>1?'s':'')+'.' : 'Nothing seeded — no free vats, or not enough gel.', n?'good':'warn');
  render(); }
function autoFillCore(){ const core=state.buildings.find(b=>b.type==='command'); if(!core||!isBuilt(core)) return;
  for(const c of state.citizens){ if(jobFilled(core)>=jobSlots(core)) break; if(c.assign==null) c.assign=core.id; } }
function decant(b){ if(housingCap()<=state.citizens.length){ b._housingBlocked=true; b.gestation.progress=b.gestation.target; return; }
  b._housingBlocked=false; const c=addCitizen(b.gestation.genome);
  const kt=knownTraits(c.traits);
  logMsg('🧬 '+c.name+' decanted — '+(kt.length?'traits: '+kt.map(t=>TRAITS[t].name).join(', '):'featureless')+'.','good');
  const fitted=autoAugment(c);
  if(fitted.length) logMsg('🍼 Decant line fitted '+fitted.join(' + ')+' to '+c.name+'.','good');
  b.gestation=null;
  if((b.queued||0)>0){ b.queued--;
    const paid=(Array.isArray(b.qpaid)&&b.qpaid.length)? b.qpaid.shift() : null;
    startGestation(b); settleQueuedSeed(b,paid);
    logMsg('Next queued citizen began gestating.','info'); }
  autoFillCore(); }

/* =====================================================================
   PLACEMENT, CONSTRUCTION & SCAFFOLDING
   ===================================================================== */
function footprint(b){ return cellsOf(b).map(([dx,dy])=>[b.x+dx,b.y+dy]); }
function absCells(cells,x,y){ return cells.map(([dx,dy])=>[x+dx,y+dy]); }
function occMap(){ const m={}; state.buildings.forEach(b=>footprint(b).forEach(([x,y])=>m[x+','+y]=b.id)); return m; }
/* A scaffold cell is either `true` (raised) or {p,t} (still going up). Only raised frames
   anchor a module or speed its assembly. */
function scafAt(x,y){ return state.scaffold[x+','+y]; }
function isScaffold(x,y){ return scafAt(x,y)===true; }
function anyScaffold(x,y){ return !!scafAt(x,y); }
function scafPending(x,y){ const v=scafAt(x,y); return !!v && v!==true; }
function scaffoldCountAt(cells,x,y){ let n=0; absCells(cells,x,y).forEach(([cx,cy])=>{ if(isScaffold(cx,cy)) n++; }); return n; }
function scaffoldCount(x,y,w,h){ return scaffoldCountAt(rectCells(w,h),x,y); }
function scaffoldBonus(n){ return Math.min(SCAF_RATE_CAP, (n||0)*SCAF_RATE_PER_CELL); }
/* Scaffolding only speeds ASSEMBLY — there is nothing to stand on when you are taking a
   module apart, and an upgrade happens inside a hull that is already there. Construction
   Drones apply to all three, which is most of what makes that tech worth 150🔬 now. */
function buildRateOf(b){ return globalMod('buildRate',1)*(1+scaffoldBonus(b&&b.build?b.build.scafN:0)); }
function consumeScaffoldAt(cells,x,y){ absCells(cells,x,y).forEach(([cx,cy])=> delete state.scaffold[cx+','+cy]); }
function addScaffoldCells(cells){ cells.forEach(([x,y])=>{ if(x>=0&&y>=0&&x<COLS&&y<ROWS) state.scaffold[x+','+y]=true; }); }   // salvage leaves finished frames
function buildSeconds(n){ return Math.max(BUILD_MIN_SEC, n*BUILD_SEC_PER_CELL); }
/* Taking a module apart costs the same clock as putting it up — a Fusion Reactor is not a
   thing you delete, it is a thing a crew spends half a minute cutting out of the hull. */
function salvageSeconds(b){ return buildSeconds(cellsOf(b).length); }
/* Upgrades run at 60% of assembly time PER LEVEL, so the first expansion is quick and the
   seventh Exchange Terminal slot is a project. */
const UPGRADE_SEC_MUL = 0.6;
function upgradeSeconds(b){ return Math.max(BUILD_MIN_SEC,
  cellsOf(b).length*BUILD_SEC_PER_CELL*UPGRADE_SEC_MUL*Math.max(1,b.level)); }
function etaSeconds(b){ const o=jobOf(b); if(!o) return 0;
  return Math.max(0,(o.j.target-o.j.progress)/Math.max(0.0001,buildRateOf(b))); }

/* --- CRADLE MODULES ------------------------------------------------------------------
   The most anchors a footprint can present against one straight run of hull is the number
   of distinct columns (or rows) it occupies — a 4x4 touching a flat wall makes 4 contacts,
   never 5. So a module whose `attach` EXCEEDS that cannot be sited flush against a wall at
   all: it has to be seated in an inside corner where two runs meet at 90°, or on
   scaffolding laid in advance. The Fusion Reactor is deliberately such a module — it needs
   a cradle, not a wall, and that is what makes Modular Scaffolding load-bearing rather than
   a convenience. Derived from the data, so it stays true if any footprint is retuned. */
function maxFlatAnchors(type){ const cells=shapeCells(type), xs=new Set(), ys=new Set();
  cells.forEach(([x,y])=>{ xs.add(x); ys.add(y); });
  return Math.max(xs.size, ys.size); }
function needsCradle(type){ return BUILDINGS[type] ? BUILDINGS[type].attach > maxFlatAnchors(type) : false; }
function canPlace(type,x,y,w,h,cells){
  cells = cells || rectCells(w,h);
  const [bw,bh]=cellBounds(cells);
  if(x<0||y<0||x+bw>COLS||y+bh>ROWS) return {ok:false,reason:'off the grid',att:0,scafAtt:0};
  const occ=occMap(), abs=absCells(cells,x,y), own=new Set();
  for(const [cx,cy] of abs){ if(occ[cx+','+cy]!=null) return {ok:false,reason:'overlaps a module',att:0,scafAtt:0}; own.add(cx+','+cy); }
  /* Scaffolding counts as an anchor, so a frame you laid earlier can carry a module out
     past the existing hull — that is the whole point of pre-staging. */
  let att=0, scafAtt=0;
  abs.forEach(([cx,cy])=>{ [[1,0],[-1,0],[0,1],[0,-1]].forEach(([ux,uy])=>{ const nx=cx+ux,ny=cy+uy;
    if(own.has(nx+','+ny)) return;
    if(occ[nx+','+ny]!=null) att++;
    else if(isScaffold(nx,ny)){ att++; scafAtt++; } }); });
  const need=BUILDINGS[type].attach;
  /* Say WHY four is the most a wall can give, or the refusal reads as a bug. */
  if(state.buildings.length>0 && att<need) return {ok:false,
    reason:`needs ${need} anchor${need>1?'s':''} (${att})`+(needsCradle(type)?' · corner or scaffold':''),att,scafAtt};
  return {ok:true,att,scafAtt};
}
function findSpot(type,w,h,cells){ cells=cells||rectCells(w,h); const [bw,bh]=cellBounds(cells);
  for(let y=0;y<=ROWS-bh;y++)for(let x=0;x<=COLS-bw;x++){ if(canPlace(type,x,y,bw,bh,cells).ok) return {x,y}; } return null; }

/* Debug mode waives unlock costs outright — research AND materials — and lets construction
   be paid for with resources you don't have, without booking the shortfall as debt.
   Toggled by the full Konami code. */
function effCost(cost){ return state.debug? {} : cost; }
function canAfford(cost){ for(const r in cost){ if((state.res[r]||0)<cost[r]) return false; } return true; }
/* The handling fee is levied on MATERIALS only. Now that base costs carry an explicit
   credit component, folding credits into `mat` would compound the fee on top of itself. */
/* 10% off anything built or upgraded touching the Command Core — rewards a dense core
   rather than sprawl, and gives the starting module a lasting role. */
function coreAdjacent(absCells){ const core=state.buildings.find(b=>b.type==='command');
  if(!core||!isBuilt(core)) return false;
  const own=new Set(absCells.map(c=>c[0]+','+c[1]));
  const coreSet=new Set(footprint(core).map(c=>c[0]+','+c[1]));
  for(const [x,y] of absCells){ for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
    const k=(x+d[0])+','+(y+d[1]); if(!own.has(k)&&coreSet.has(k)) return true; } }
  return false; }
function discounted(cost,frac){ if(!frac) return cost; const c={};
  for(const r in cost) c[r]=Math.max(0, Math.round(cost[r]*(1-frac))); return c; }
function siteCost(type,level,absCells){ return discounted(buildCost(type,level), coreAdjacent(absCells)?CORE_COST_DISCOUNT:0); }
function upgradeCostAt(b){ return discounted(upgradeCost(b), coreAdjacent(footprint(b))?CORE_COST_DISCOUNT:0); }
function buildCost(type,level){ const c={},base=BUILDINGS[type].cost,m=Math.pow(1.6,level); let mat=0;
  for(const r in base){ c[r]=Math.round(base[r]*m); if(r!=='credits') mat+=base[r]; }
  const fee=Math.round(mat*0.6*m); if(fee>0) c.credits=(c.credits||0)+fee; return c; }
/* Exchange slots escalate hard on purpose — 7 slots should be a late-game trophy, not a
   default. 140/301/647/1391/2991/6430 credits for slots 2…7. */
function tradeSlotCost(level){ return {credits:Math.round(140*Math.pow(2.15,level-1)), composites:Math.round(8*Math.pow(1.6,level-1))}; }
function upgradeCost(b){ const def=BUILDINGS[b.type];
  if(b.type==='trade') return tradeSlotCost(b.level);
  if(def.role) return {credits:Math.round(45*Math.pow(1.55,b.level-1)*def.slots)};
  return buildCost(b.type,b.level); }
function isUnlocked(type){ if(type===SCAF_TOOL) return techHas('scaffolding');
  const def=BUILDINGS[type]; if(def.reqTech&&!state.techs[def.reqTech]) return false;
  return def.requires.every(r=> state.buildings.some(b=>b.type===r && isBuilt(b))); }
function lockReason(type){ const def=BUILDINGS[type]; if(def.reqTech&&!state.techs[def.reqTech]) return 'needs research: '+TECHS[def.reqTech].name;
  const missing=def.requires.filter(r=> !state.buildings.some(b=>b.type===r && isBuilt(b)));
  const building=missing.filter(r=> state.buildings.some(b=>b.type===r));
  return (building.length? 'waiting on construction: ':'needs ')+missing.map(r=>BUILDINGS[r].name).join(', '); }
function countOf(type){ return state.buildings.filter(b=>b.type===type).length; }

function placeBuild(type,x,y,w,h,cells){ const def=BUILDINGS[type];
  if(def.unique&&countOf(type)>0){ logMsg('Only one '+def.name+' allowed.','warn'); return false; }
  cells = cells || rectCells(w,h);
  const chk=canPlace(type,x,y,w,h,cells); if(!chk.ok){ logMsg('Cannot place '+def.name+': '+chk.reason+'.','warn'); return false; }
  const cost=siteCost(type,0,absCells(cells,x,y));
  if(guardBlocked(cost)){ logMsg(blockMsg(cost),'warn'); return false; }
  const credit=!canAfford(cost);
  const scafN=scaffoldCountAt(cells,x,y), n=cells.length;
  /* Remember exactly which raised frames this placement eats, and exactly what it was
     charged. Cancelling the build hands both back — see cancelBuild(). */
  const eaten=absCells(cells,x,y).filter(([cx,cy])=>isScaffold(cx,cy));
  payCostWithCredit(cost); consumeScaffoldAt(cells,x,y);
  const o=inst(type,x,y); o.cells=cells.map(c=>[c[0],c[1]]); const bb=cellBounds(cells); o.w=bb[0]; o.h=bb[1];
  o.build={progress:0, target:buildSeconds(n), scafN, scaf:(n?scafN/n:0),
           paid:{...cost}, scafCells:eaten};
  state.buildings.push(o);
  logMsg('Laid down '+def.name+' — assembling, '+Math.ceil(etaSeconds(o))+'s'+(scafN>0?' (on '+scafN+' frame'+(scafN>1?'s':'')+', +'+Math.round(scaffoldBonus(scafN)*100)+'% rate)':'')+(credit?', materials bought on credit':'')+'.', credit?'warn':'info');
  return true; }
function buildNew(type){ const def=BUILDINGS[type], cells=shapeCells(type), bb=cellBounds(cells), s=findSpot(type,bb[0],bb[1],cells);
  if(!s){ logMsg('No valid space to auto-place '+def.name+'.','warn'); return; } placeBuild(type,s.x,s.y,bb[0],bb[1],cells); render(); }
/* --- UPGRADES TAKE TIME (v0.27) -----------------------------------------------------
   The cost is charged when you commit, and the LEVEL lands when the work finishes. The
   module keeps producing at its current level throughout and keeps every worker — an
   expansion is a crew bolting a second bay onto a running machine, not a shutdown. A new
   worker slot therefore only opens on completion, which is the whole point of the delay. */
function upgrade(b){ const def=BUILDINGS[b.type]; if(b.level>=def.maxLevel) return;
  if(!isBuilt(b)){ logMsg(b.demo?'That module is being dismantled.':'Wait for construction to finish first.','warn'); return; }
  if(b.upg){ logMsg(def.name+' is already being upgraded — '+Math.ceil(etaSeconds(b))+'s left.','warn'); return; }
  const cost=upgradeCostAt(b);
  if(guardBlocked(cost)){ logMsg(blockMsg(cost),'warn'); return; }
  const credit=!canAfford(cost); payCostWithCredit(cost);
  b.upg={progress:0, target:upgradeSeconds(b), paid:{...cost}, toLevel:b.level+1};
  logMsg('⬆ '+def.name+(def.role?' expansion':' upgrade')+' under way — '+Math.ceil(etaSeconds(b))+'s'+(credit?', paid on credit':'')+'. It keeps running until the work lands.','info');
  render(); }
function finishUpgrade(b){ const def=BUILDINGS[b.type]; b.upg=null;
  if(b.level<def.maxLevel) b.level++;
  logMsg('⬆ '+def.name+(def.role?' expanded to '+jobSlots(b)+' slots':' upgraded to Lv'+b.level)+'.','good');
  sync(); render(); }

/* --- SALVAGE TAKES TIME (v0.27) -----------------------------------------------------
   Starting a dismantle takes the module offline immediately and reassigns its crew: they
   are the ones doing the cutting, and leaving them "posted" to a module that produces
   nothing was the confusing option. Materials come back when the job finishes, so a
   salvage can be called off right up until then.
   A module still under construction does not route here at all — see cancelBuild(). */
function salvage(b){ const def=BUILDINGS[b.type];
  if(def.permanent){ logMsg('The '+def.name+' cannot be removed.','warn'); return; }
  if(b.build){ cancelBuild(b); return; }
  if(b.demo){ logMsg(def.name+' is already being dismantled — '+Math.ceil(etaSeconds(b))+'s left.','warn'); return; }
  if(b.upg){ const lost=costStrPlain(b.upg.paid);
    b.upg=null; logMsg('The pending upgrade to '+def.name+' was abandoned'+(lost?' — '+lost+' written off':'')+'.','warn'); }
  /* An embryo cannot survive its vat being cut apart. Say so; a silent loss reads as a bug. */
  if(def.gestate && (b.gestation || (b.queued||0)>0)){
    const n=(b.gestation?1:0)+(b.queued||0);
    b.gestation=null; b.queued=0; b.qpaid=[];
    logMsg('⚠ '+n+' embryo'+(n>1?'s were':' was')+' lost with the '+def.name+'.','warn'); }
  unassignBuilding(b.id);
  b.demo={progress:0, target:salvageSeconds(b)};
  logMsg('🧱 Dismantling '+def.name+' — '+Math.ceil(etaSeconds(b))+'s. It is offline and its crew are free to repost; materials come back when the work is done.','info');
  sync(); render(); }
function cancelSalvage(b){ if(!b||!b.demo) return;
  b.demo=null; logMsg('Dismantling of '+BUILDINGS[b.type].name+' called off — the module is back online.','good');
  sync(); render(); }
function finishSalvage(b){ const def=BUILDINGS[b.type], base=def.cost, ref=[];
  for(const r in base){ if(r==='credits') continue; const amt=Math.floor(base[r]*b.level*SALVAGE_REFUND); if(amt>0){ const put=addRes(r,amt); if(put>0) ref.push(Math.round(put)+' '+RESOURCES[r].icon); } }
  const cells=footprint(b); addScaffoldCells(cells);
  state.buildings=state.buildings.filter(x=>x.id!==b.id);
  if(view.selectedBuilding===b.id) view.selectedBuilding=null;
  state.stats.salvaged=(state.stats.salvaged||0)+1;
  logMsg('🧱 '+def.name+' salvaged'+(ref.length?' — recovered '+ref.join(' '):'')+'. '+cells.length+' frame'+(cells.length>1?'s':'')+' left standing: +'+Math.round(scaffoldBonus(cells.length)*100)+'% rebuild rate here.','good');
  sync(); render(); }

/* --- CANCELLING A BUILD (v0.27) -----------------------------------------------------
   Cancelling is NOT salvaging a module you never finished, and it must not behave like it.
   Two things were wrong before: it paid out the 50% salvage refund on a build that had
   consumed nothing, and it left a full pad of scaffold frames standing — so laying a big
   module down and immediately cancelling it MINTED frames for less than they cost.
   Now: nothing is left behind except the frames the placement itself ate, handed back
   exactly as they were, and the refund slides from the whole bill at 0% progress down to
   the ordinary salvage rate at completion. Cancel a misclick and you lose nothing; cancel
   a nearly-finished module and you are salvaging it, which is what it is. */
function cancelRefundFrac(b){ const j=b.build; if(!j) return SALVAGE_REFUND;
  const left=Math.max(0, Math.min(1, 1-(j.progress/Math.max(0.0001,j.target))));
  return SALVAGE_REFUND + (1-SALVAGE_REFUND)*left; }
function cancelBuild(b){ const def=BUILDINGS[b.type], j=b.build; if(!j) return;
  const frac=cancelRefundFrac(b), paid=j.paid||buildCost(b.type,0), ref=[];
  for(const r in paid){ const amt=Math.floor((paid[r]||0)*frac); if(amt<=0) continue;
    const put=addRes(r,amt); if(put>0) ref.push(Math.round(put)+' '+RESOURCES[r].icon); }
  if(Array.isArray(j.scafCells) && j.scafCells.length) addScaffoldCells(j.scafCells);
  unassignBuilding(b.id);
  state.buildings=state.buildings.filter(x=>x.id!==b.id);
  if(view.selectedBuilding===b.id) view.selectedBuilding=null;
  logMsg('✕ '+def.name+' cancelled at '+Math.round(jobPct(b))+'% — '+(ref.length?'refunded '+ref.join(' '):'nothing recovered')
    +' ('+Math.round(frac*100)+'%). '+((j.scafCells&&j.scafCells.length)? j.scafCells.length+' frame'+(j.scafCells.length>1?'s':'')+' returned.' : 'No frames left behind.'),'info');
  sync(); render(); }
function costStrPlain(cost){ const p=[]; for(const r in (cost||{})) if(cost[r]>0) p.push(Math.round(cost[r])+' '+RESOURCES[r].icon); return p.join(' '); }

function placeScaffold(x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS){ return false; }
  const occ=occMap();
  if(occ[x+','+y]!=null){ logMsg('A module already occupies that cell.','warn'); return false; }
  if(anyScaffold(x,y)){ delete state.scaffold[x+','+y]; logMsg('Scaffold frame dismantled.','info'); return true; }
  const adj=[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=> occ[(x+dx)+','+(y+dy)]!=null || anyScaffold(x+dx,y+dy));
  if(state.buildings.length>0 && !adj){ logMsg('Scaffolding must attach to the station or to existing scaffolding.','warn'); return false; }
  if(guardBlocked(SCAF_COST)){ logMsg(blockMsg(SCAF_COST),'warn'); return false; }
  payCostWithCredit(SCAF_COST); state.scaffold[x+','+y]={p:0,t:SCAF_BUILD_SEC}; return true; }

/* ---------- assignment ---------- */
function unassignAll(cid){ const c=state.citizens.find(x=>x.id===cid); if(c)c.assign=null; }
function unassignBuilding(bid){ state.citizens.forEach(c=>{ if(c.assign===bid) c.assign=null; }); }
/* --- CREW LOCK (v0.25) ---------------------------------------------------------
   A gestating vat used to be sealed outright: nobody in, nobody out. That was a blunt fix
   for a real exploit — post two elite gene-crafters, seed a five-star embryo, then walk
   them straight back to the Foundry and collect the quality for free, because quality is
   locked at seed time anyway.
   The rule now targets that exploit directly instead of freezing the whole module:
     · whoever is on station when growth STARTS is locked in until the decant — they paid
       for the roll with their labour and they keep paying;
     · empty slots stay open, so you can staff up mid-grow whenever you like;
     · late arrivals do NOT touch the embryo already growing (its quality was rolled and
       stored at seed time) — they only count toward the NEXT roll, including a queued one.
   Crew are only locked when their presence actually moved the number. A Command Core
   without the Somatic Cloning Matrix clones at a flat -1.3 regardless of who is aboard,
   so there is nothing to game and its crew stay free to work. */
function gestCrewMatters(b){ const d=BUILDINGS[b.type];
  return !!d.gestate && (!d.gestate.core || techHas('core_matrix')); }
function lockedCrewIds(b){ return (b && b.gestation && Array.isArray(b.gestation.crew)) ? b.gestation.crew : []; }
/* the module a citizen is contractually stuck in, or null */
function crewLockOf(c){ if(!c || c.assign==null) return null;
  const b=byId(c.assign); if(!b) return null;
  return lockedCrewIds(b).includes(c.id) ? b : null; }
function isCrewLocked(c){ return !!crewLockOf(c); }
function lockedCrewOf(b){ const ids=lockedCrewIds(b);
  return ids.length? state.citizens.filter(c=>c.assign===b.id && ids.includes(c.id)) : []; }
function jobSlots(b){ const def=BUILDINGS[b.type]; if(!def.slots||!isBuilt(b)) return 0; return def.slots+(b.level-1); }
function jobFilled(b){ return state.citizens.filter(c=>c.assign===b.id).length; }
function coreId(){ const c=state.buildings.find(b=>b.type==='command'); return c?c.id:null; }
/* pool of citizens available to a module: the unassigned, plus anyone currently on
   Command-Core duty (core work trains no skill, so pulling them out is the normal move) */
function hirePool(b){ const cid=coreId();
  return state.citizens.filter(c=> c.assign==null || (cid!=null && c.assign===cid && b.id!==cid) )
    .sort((x,y)=>{ const ax=x.assign==null?0:1, ay=y.assign==null?0:1;   // truly idle first
      return ax!==ay ? ax-ay : x.name.localeCompare(y.name); }); }
const CORE_TINT='#5bc8ff';
function assignCitizen(cid,bid){ const c=state.citizens.find(x=>x.id===Number(cid)); if(!c)return;
  const lock=crewLockOf(c);
  if(lock){ logMsg(c.name+' is locked into the '+BUILDINGS[lock.type].name+' until this embryo decants — their work is already priced into it.','warn'); render(); return; }
  if(bid===''||bid==null){ c.assign=null; render(); return; }
  const b=state.buildings.find(x=>x.id===Number(bid)); if(!b||!BUILDINGS[b.type].role){ render(); return; }
  if(!isBuilt(b)){ logMsg(b.demo?'That module is being dismantled — nobody can be posted to it.':'That module is still under construction.','warn'); render(); return; }
  const filled=state.citizens.filter(x=>x.assign===b.id&&x.id!==c.id).length;
  if(filled>=jobSlots(b)){ logMsg(BUILDINGS[b.type].name+' has no free worker slots — expand it for more.','warn'); render(); return; }
  c.assign=Number(bid);
  /* Joining mid-grow is allowed and deliberately inert: say so, or a player who staffs a
     running vat will sit there waiting for the star rating to move. */
  if(BUILDINGS[b.type].gestate && b.gestation && gestCrewMatters(b))
    logMsg(c.name+' joined the '+BUILDINGS[b.type].name+' mid-grow — the embryo in the tank is already rolled, so they count toward the next one.','info');
  if(b.type==='trade') autoBindBroker(b,c);      // land them on the first slot with no broker
  render(); }
function autoBindBroker(b,c){ const progs=progsOf(b), n=jobSlots(b);
  if(progs.some(p=>p.cit===c.id)) return;
  for(let i=0;i<n;i++){ if(progs[i].cit==null || !slotBroker(b,progs[i])){ progs[i].cit=c.id; return; } } }

/* ---------- market & finance ---------- */
function sellRes(r,amount){ const m=state.market[r]; amount=Math.min(amount, Math.floor(state.res[r])); if(amount<=0) return;
  const revenue=Math.round(amount*m.price); state.res[r]-=amount; state.res.credits+=revenue; state.stats.creditsEarned+=revenue;
  const impact=amount/(amount+150); m.price=Math.max(m.base*PRICE_MIN_MUL, m.price*(1-impact*0.4)); priceTouch(m);
  logMsg('Sold '+amount+' '+RESOURCES[r].name+' for '+revenue+' 💰.','info'); render(); }
function buyRes(r,amount){ const m=state.market[r], cap=resCap(r); amount=Math.min(amount, Math.max(0, cap-Math.floor(state.res[r]))); if(amount<=0){ logMsg('Storage full for '+RESOURCES[r].name+'.','warn'); return; }
  const cost=Math.round(amount*m.price), wasDebt=state.debt; chargeCredits(cost); state.res[r]+=amount;
  const impact=amount/(amount+150); m.price=Math.min(m.base*PRICE_MAX_MUL, m.price*(1+impact*0.4)); priceTouch(m);
  logMsg('Bought '+amount+' '+RESOURCES[r].name+' for '+cost+' 💰'+((state.debt>wasDebt)?' (on credit)':'')+'.','info'); render(); }
function takeLoan(amount){ const avail=borrowLimit()-state.debt; amount=Math.min(amount, Math.floor(avail)); if(amount<=0){ logMsg('Borrowing limit reached.','warn'); return; }
  state.res.credits+=amount; state.debt+=amount; state.hasLoan=true; logMsg('Borrowed '+amount+' 💰. Debt now '+Math.round(state.debt)+' at '+Math.round(interestRate()*100)+'%/cycle.','warn'); render(); }
function repayDebt(amount){ if(state.debt<=0) return; const max=Math.min(state.res.credits,state.debt);
  const amt=Math.min(amount!=null?amount:max, max); if(amt<=0){ logMsg('No credits available to repay.','warn'); return; }
  state.res.credits-=amt; state.debt-=amt;
  if(state.debt<=0.5){ state.debt=0; if(state.hasLoan){ state.stats.loansRepaid++; state.hasLoan=false; logMsg('Loan fully repaid — creditworthiness improved!','good'); } }
  else logMsg('Repaid '+Math.round(amt)+' 💰. Debt now '+Math.round(state.debt)+'.','info'); render(); }

/* ---------- research, augments & log ---------- */
/* --- RESEARCH IS A PROJECT, NOT A PURCHASE (v0.27) ---------------------------------
   Clicking Research charges the cost and opens a project; the tech itself arrives when the
   colony has worked through it. One at a time. Cancelling refunds the cost in full and
   throws away the progress, so switching targets costs you time and nothing else. */
function buyTech(id){ const t=TECHS[id]; if(!t) return;
  if(state.techs[id]) return;
  if(!t.requires.every(r=>state.techs[r])) return;
  if(state.research){ logMsg('The labs are already working on '+TECHS[state.research.id].name+' — '+Math.ceil(researchEta())+'s left. Cancel it first.','warn'); render(); return; }
  const cost=effCost(t.cost);
  if(!canAfford(cost)){ logMsg('Not enough research for '+t.name+'.','warn'); return; }
  for(const r in cost) state.res[r]-=cost[r];
  state.research={id, progress:0, target:techSeconds(id), paid:{...cost}};
  logMsg('🔬 Project opened: '+t.name+' — ~'+Math.ceil(researchEta())+'s at current lab capacity. Staff more Research Labs to shorten it.','info');
  render(); }
function cancelResearch(){ const R=state.research; if(!R) return;
  const t=TECHS[R.id]; for(const r in (R.paid||{})) addRes(r, R.paid[r]);
  state.research=null;
  logMsg('Project '+(t?t.name:R.id)+' abandoned at '+Math.round(researchPctOf(R))+'% — the cost was refunded, the work was not.','warn');
  render(); }
function researchPctOf(R){ return R? Math.max(0,Math.min(100, R.progress/Math.max(0.0001,R.target)*100)) : 0; }
/* Completing a project can reveal techs that did not exist a moment ago. Announce them —
   that log line IS the discovery, and without it a hidden tree just looks small. */
function advanceResearch(dt){ const R=state.research; if(!R) return;
  const t=TECHS[R.id];
  if(!t || state.techs[R.id]){ state.research=null; return; }
  R.progress += dt*(state.debug ? 1e6 : researchRate());   // v0.30: debug researches instantly
  if(R.progress < R.target) return;
  const before=new Set(Object.keys(TECHS).filter(techDiscovered));
  state.techs[R.id]=true; state.research=null;
  logMsg('🔬 Researched '+t.name+'.','good');
  const revealed=Object.keys(TECHS).filter(id=>techDiscovered(id) && !before.has(id));
  if(revealed.length) logMsg('🔎 New line of enquiry opened: '+revealed.map(id=>TECHS[id].icon+' '+TECHS[id].name).join(', ')+'.','info');
  sync(); render(); }
function unlockAug(id){ const a=AUGMENTS[id]; if(!a||state.augments[id]) return;
  const cost=effCost(a.research);
  if(!canAfford(cost)){ logMsg('Cannot afford to unlock '+a.name+'.','warn'); return; }
  for(const r in cost) state.res[r]-=cost[r]; state.augments[id]=true;
  logMsg('🦾 Augment unlocked: '+a.name+'. Install it on colonists from the Augments tab.','good'); render(); }
/* Augment Reclamation: when an augmented colonist dies, hand back a share of what their
   implants cost to fit, instead of losing it entirely. */
/* Adding stock must never REDUCE it. Math.min(cap, cur+amt) silently destroyed the excess
   whenever a stockpile was already over cap — which happens as soon as you salvage a depot
   and the cap drops below what you are holding. */
function addRes(r,amt){ if(!(amt>0)) return 0; const cur=state.res[r]||0;
  if(r==='credits'||r==='research'){ state.res[r]=cur+amt; return amt; }
  const cap=resCap(r); if(cur>=cap) return 0;
  const put=Math.min(amt, cap-cur); state.res[r]=cur+put; return put; }
function reclaimAugments(c){ const frac=globalMod('augReclaim',0); if(frac<=0) return null;
  const got={};
  (c.augs||[]).forEach(id=>{ const a=AUGMENTS[id]; if(!a) return;
    for(const r in a.install){ const put=addRes(r, a.install[r]*frac); if(put>0) got[r]=(got[r]||0)+put; } });
  const keys=Object.keys(got); if(!keys.length) return null;
  return keys.map(r=>Math.round(got[r])+' '+RESOURCES[r].icon).join(' '); }
/* Decant-Line Augmentation: fit every flagged augment to a new citizen, materials allowing. */
function autoAugment(c){ if(!techHas('aug_natal')) return [];
  const done=[]; c.augs=c.augs||[];
  for(const id in AUGMENTS){ if(!state.augments[id] || !state.autoAug[id]) continue;
    if(c.augs.length>=AUG_SLOTS) break;
    const a=AUGMENTS[id]; if(c.augs.includes(id) || !canAfford(a.install)) continue;
    for(const r in a.install) state.res[r]-=a.install[r];
    c.augs.push(id); state.stats.augsInstalled=(state.stats.augsInstalled||0)+1; done.push(a.name); }
  return done; }
function toggleAutoAug(id){ if(!AUGMENTS[id]||!state.augments[id]) return;
  state.autoAug[id]=!state.autoAug[id]; render(); }
/* Fitting an augment may be financed like construction: the shortfall is bought on the
   market and booked as debt, still bounded by the same 80%-of-ceiling guard. Unlock costs
   are NOT financeable — research cannot be bought. */
function installAug(id,cid,opts){ opts=opts||{}; cid=Number(cid); if(!cid) return false;
  const a=AUGMENTS[id], c=state.citizens.find(x=>x.id===cid);
  if(!a||!c||!state.augments[id]) return false; c.augs=c.augs||[];
  const fail=(msg)=>{ if(!opts.quiet){ if(msg) logMsg(msg,'warn'); render(); } return false; };
  if(c.augs.includes(id)) return fail(null);
  if(c.augs.length>=AUG_SLOTS) return fail(c.name+' has no free augment slots.');
  if(guardBlocked(a.install)) return fail(blockMsg(a.install));
  const credit=!canAfford(a.install);
  payCostWithCredit(a.install);
  c.augs.push(id); state.stats.augsInstalled=(state.stats.augsInstalled||0)+1;
  if(!opts.quiet){ logMsg('🦾 '+a.name+' fitted to '+c.name+(credit?' — financed on credit.':'.'), credit?'warn':'good'); rosterRender(); }
  return true; }
/* Debug-only: wipe the balance sheet. Konami debug already waives unlock costs and lets
   construction ignore the guard, but there was no way to undo a debt already booked, which
   made testing anything downstream of the credit guard a restart. Deliberately does NOT
   count as a repaid loan — free money must not buy achievements or credit score. */
function debugClearDebt(){ if(!state.debug){ logMsg('That is a debug-mode action.','warn'); return; }
  if(state.debt<=0){ logMsg('No debt to clear.','info'); render(); return; }
  const was=Math.round(state.debt);
  state.debt=0; state.hasLoan=false; state.overCeiling=0;
  logMsg('🐞 Debug: '+was+' 💰 of debt written off at no cost. Credit score and the repaid-loan count are untouched.','warn');
  render(); }
function logMsg(text,kind){ state.log.unshift({t:fmtTime(state.tSec),text,kind:kind||'info'}); if(state.log.length>140) state.log.pop(); }
function fmtTime(s){ const m=Math.floor(s/60),ss=Math.floor(s%60); return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }

/* =====================================================================
   RENDER
   ===================================================================== */
const $ = s => document.querySelector(s);

function catColor(cat){ return ({Core:'#3fd1c7',Power:'#f5c451',Life:'#5fe08a',Industry:'#c39b7a',Vats:'#e07ad6',Science:'#7b9cff',Economy:'#f0b64a'})[cat]||'#7d93a8'; }
const CAT_ORDER=['Core','Power','Industry','Life','Vats','Science','Economy'];
function catIdx(b){ const i=CAT_ORDER.indexOf(BUILDINGS[b.type].cat); return i<0?99:i; }

/* Refresh adjacency once per render so panels that read it (storage bonus, supply links)
   are never a tick stale right after a placement, and don't each rebuild the occupancy map. */
function refreshAdjacency(){ const OCC=occMap(); state.buildings.forEach(b=>{ b._nbr=neighborsOf(b,OCC); }); }
/* render() replaces #view wholesale, which silently scrolls the tab back to the top. That
   was invisible while every render came from clicking inside the tab you were looking at —
   but the gestation bar is pinned above the tabs and its buttons call render() too, so
   seeding a vat from halfway down the Research tree threw you back to the first category.
   Hold the scroll across any render that stays on the same tab; a genuine tab change still
   starts at the top, which is what you want there. */

/* --- v0.26: render is decoupled from mutation. ------------------------------------------
   Two dozen gameplay functions used to mutate state and then paint the whole UI themselves,
   which meant the view layer could not be swapped without touching simulation code — and
   several single user actions triggered two or three full rebuilds.

   `render()` now REQUESTS a paint; `renderNow()` performs one. Callers keep calling
   `render()` and get coalescing for free: many mutations in one action collapse into a
   single paint on the next frame.

   The trap this has to dodge: render() was also doing simulation work — refreshAdjacency()
   and reconcileTradeSlots() ran before every paint, so panels read fresh adjacency purely as
   a side effect of painting. Deferring the paint would have let adjacency go stale under any
   panel that reads it. Both now live in sync(), which runs at MUTATION time, not paint time. */
function sync(){ refreshAdjacency(); refreshSeenRes(); reconcileTradeSlots(); }
function render(){ sync(); view.dirty = true; }
function renderNow(){ view.dirty = false;
  const v0=$('#view'), keep=(v0&&view.lastRenderTab===view.uiTab)?v0.scrollTop:0;
  sync(); renderTop(); renderAlerts(true); renderGestBar(true); renderTabs(); renderView(); refreshResPop();
  view.lastRenderTab=view.uiTab;
  /* the same-tab scroll retention from v0.25 has to survive coalescing, or the pinned
     gestation bar starts throwing you to the top of the Research tree again */
  if(keep>0){ const v=$('#view'); if(v){ void v.offsetHeight; v.scrollTop=keep; } } }
/* A requested paint waits for the finger to come up; the request itself is not lost, so
   the frame after release shows everything that accumulated. renderNow() stays unlatched —
   its direct callers are explicit player actions that should never be deferred. */
function renderIfDirty(){ if(view.dirty && !holdingPointer()) renderNow(); }
const TALL_TABS = new Set(['colony','citizens']);
function renderView(){ const v=$('#view'); if(v) v.classList.toggle('tall', TALL_TABS.has(view.uiTab));
  if(view.uiTab==='colony') renderColonyFull(); else if(view.uiTab==='staffing') renderStaffing(); else if(view.uiTab==='citizens') renderRoster(); else if(view.uiTab==='market') renderMarket(); else if(view.uiTab==='research') renderResearch(); else if(view.uiTab==='augments') renderAugments(); else if(view.uiTab==='ledger') renderLedger(); else if(view.uiTab==='log') renderLog(); }
/* Colony & Citizens diff in place every tick. The heavier tabs rebuild at most once a
   second, and Augments never auto-rebuilds (it holds <select> menus). */
function tickLive(){ if(holdingPointer()) return;   /* v0.34 — never repaint under a press */
  renderTop(); renderAlerts(); renderGestBar(); renderTabs(); refreshResPop();
  if(view.uiTab==='colony'){ updateColonyLive(); return; }
  if(view.uiTab==='staffing'){ updateStaffingLive(); return; }
  if(view.uiTab==='citizens'){ updateRosterLive(); return; }
  if(view.uiTab==='augments') return;
  view.slowAcc+=TICK_MS; if(view.slowAcc<1000) return; view.slowAcc=0;
  /* these rebuild #view wholesale once a second — hold the scroll position, and never
     redraw while the player is interacting with something inside */
  const v=$('#view'); if(v && v.contains(document.activeElement)) return;
  const sc=v?v.scrollTop:0;
  if(view.uiTab==='market') renderMarket();
  else if(view.uiTab==='research') updateResearchLive();
  else if(view.uiTab==='ledger') renderLedger();
  else if(view.uiTab==='log') renderLog();
  const nv=$('#view'); if(nv) nv.scrollTop=sc; }

/* Which alert gets the always-visible row: the most severe, then the most recent. A
   foreclosure countdown must never be the one pushed into the overflow. */
const ALERT_RANK = {danger:0, warn:1, good:2, info:3};
function alertsForDisplay(){ return (view.alerts||[]).slice()
  .sort((a,b)=> (ALERT_RANK[a.kind]-ALERT_RANK[b.kind]) || (b.at-a.at)); }
function alertRowHTML(a){ const K=ALERT_KINDS[a.kind]||ALERT_KINDS.info;
  /* .al-n is always present, even when empty, so the in-place patch has somewhere to write
     without having to rebuild the row. */
  return `<div class="alert ${a.kind}" data-k="${a.key}" ${a.go?`onclick="${a.go}"`:''}>
    <span class="al-i">${K.icon}</span><span class="al-t">${a.text}</span>
    <span class="al-n" title="${a.cond?'how long this has been true':'how many times this has fired'}">${alertMeta(a)}</span>
    <button class="al-x" onclick="event.stopPropagation();dropAlert('${a.key}')" title="dismiss">✕</button></div>`; }
function alertBarHTML(){ const list=alertsForDisplay();
  const more=list.slice(1).map(alertRowHTML).join(''), n=list.length-1;
  if(n<1) view.alMoreOpen=false;                 /* nothing to hold open */
  const open=!!view.alMoreOpen;
  const handle = n>0 ? `<button class="al-more-t${open?' on':''}" onclick="toggleAlertMore(event)" title="${open
      ? 'These rows are live. Click to make them read-only again so they cannot take a click meant for the bar below.'
      : n+' more alert'+(n>1?'s':'')+'. They are read-only where they hang, so they never steal a click — open them to dismiss or follow one.'}">＋${n} ${open?'▴':'▾'}</button>` : '';
  return `<div class="al-first">${list.length?alertRowHTML(list[0]):''}${handle}</div>`
       + (more?`<div class="al-more${open?' open':''}">${more}</div>`:''); }
function toggleAlertMore(ev){ if(ev) ev.stopPropagation();
  view.alMoreOpen=!view.alMoreOpen; renderAlerts(true); }
/* The SET of alerts decides a rebuild — not their text. A deficit's rate changes every tick,
   and rebuilding the strip four times a second destroyed the row under the cursor, so the
   dismiss button could not reliably be clicked and hover never settled. Same keys in the
   same order → patch the text and the meta chip in place instead. */
function alertSetSig(){ return alertsForDisplay().map(a=>a.key+':'+a.kind).join('|'); }
function renderAlerts(force){ const el=$('#alertbar'); if(!el) return;
  const list=alertsForDisplay(), sig=alertSetSig();
  const nodes=el.querySelectorAll('.alert');
  if(!force && sig===view.alertSig && nodes.length===list.length){
    list.forEach((a,i)=>{ const node=nodes[i]; if(!node) return;
      const t=node.querySelector('.al-t'); if(t && t.textContent!==a.text) t.textContent=a.text;
      const m=node.querySelector('.al-n'), meta=alertMeta(a);
      if(m && m.textContent!==meta) m.textContent=meta; });
    return; }
  view.alertSig=sig;
  el.innerHTML=alertBarHTML();
  /* the element is always in the layout at the same height; only its skin changes */
  el.classList.toggle('live', list.length>0); }
/* --- the brand menu ------------------------------------------------------------------- */
function brandMenuHTML(){ return `
  <div class="bm-k">Colony</div>
  <div class="bm-i" onclick="brandDo('saveGame')">💾 <span>Save</span></div>
  <div class="bm-i" onclick="brandDo('loadGame')">📂 <span>Load</span></div>
  <div class="bm-sep"></div>
  <div class="bm-k">File</div>
  <div class="bm-i" onclick="brandDo('exportGame')">⬇ <span>Export to file…</span></div>
  <div class="bm-i" onclick="brandDo('importGame')">⬆ <span>Import from file…</span></div>
  <div class="bm-sep"></div>
  <div class="bm-i warn" onclick="brandDo('confirmReset')">↺ <span>New colony…</span></div>
  <div class="bm-s">⬡ VATLING v${__vat.version} · cycle ${state.cycle} · autosaves every 30s${state.debug?' · 🐞 debug':''}</div>`; }
function toggleBrandMenu(ev){ if(ev) ev.stopPropagation();
  const el=$('#brandmenu'), br=$('#brand'); if(!el||!br) return;
  const open=!el.classList.contains('open');
  if(open){ el.innerHTML=brandMenuHTML();
    const r=br.getBoundingClientRect();
    el.style.left=Math.max(6,r.left)+'px'; el.style.top=(r.bottom+5)+'px'; }
  el.classList.toggle('open', open); br.classList.toggle('open', open); }
function closeBrandMenu(){ const el=$('#brandmenu'), br=$('#brand');
  if(el) el.classList.remove('open'); if(br) br.classList.remove('open'); }
/* every entry closes the menu first, so a confirm() dialog is not drawn under it */
function brandDo(fn){ closeBrandMenu();
  const f=(typeof window!=='undefined')? window[fn] : null;
  if(typeof f==='function') f(); }
document.addEventListener('click', e=>{ if(!e.target.closest('#brandmenu') && !e.target.closest('#brand')) closeBrandMenu();
  /* an opened alert overflow is modal-ish: the next click anywhere else puts the glass back */
  if(view.alMoreOpen && !e.target.closest('#alertbar')){ view.alMoreOpen=false; renderAlerts(true); } });
function renderTop(){
  let h='', shown=[];
  for(const k in RESOURCES){ const R=RESOURCES[k];
    if(!resShown(k)) continue;                      // progressive reveal — see refreshSeenRes
    shown.push(k);
    if(isUtil(k)){ const g=(state.grid&&state.grid[k])||{s:0,d:0,net:0}, net=g.net!=null?g.net:(g.s-g.d), cap=bufferCap(k), buf=state.res[k]||0, rc=net>0.01?'pos':net<-0.01?'neg':'zero', deficit=net<-1e-6;
      h+=`<div class="res util" data-r="${k}" title="${R.name} — ${R.desc}${deficit?' Currently buying the shortfall.':''}"><div class="top"><span class="icon">${R.icon}</span><span class="val ${rc}">${net>=0?'+':''}${net.toFixed(1)}</span></div>
        <div class="rate ${rc}">▲${g.s.toFixed(1)} ▼${g.d.toFixed(1)}</div>
        ${cap>0?`<div class="bar" title="buffer ${Math.round(buf)}/${cap}"><i style="width:${Math.min(100,buf/cap*100)}%;background:${R.color}"></i></div>`:`<div class="bar"><i style="width:100%;background:${deficit?'var(--warn)':R.color}"></i></div>`}</div>`;
    } else { const clk=!!PRICES[k]||k==='credits'||k==='research', cap=resCap(k), val=state.res[k], rate=view.lastRates[k]||0, rc=rate>0.001?'pos':rate<-0.001?'neg':'zero', showBar=cap<9999999, pct=showBar?Math.min(100,val/cap*100):0;
      const tip = R.name+" — "+(k==='credits'? R.desc+' Click for borrow / repay.' : k==='research'? R.desc+' Click to open the tech tree.' : R.desc);
      h+=`<div class="res${clk?' clickable':''}" data-r="${k}" ${clk?`data-res="${k}" onclick="openResPop('${k}',event)"`:''} title="${tip}"><div class="top"><span class="icon">${R.icon}</span><span class="val">${fmt(val)}</span></div>
        <div class="rate ${rc}">${rate>=0?'+':''}${rate.toFixed(2)}/s</div>${showBar?`<div class="bar"><i style="width:${pct}%;background:${pct>92?'var(--warn)':R.color}"></i></div>`:''}</div>`; }
  }
  const sig=shown.join(',');
  $('#resbar').innerHTML=h;
  /* flash whatever is new since the last draw, so a reveal is noticed rather than merely
     present — but only when the SET changed, not on every tick */
  if(view.shownRes && sig!==view.shownRes){ const was=new Set(view.shownRes.split(','));
    shown.forEach(k=>{ if(!was.has(k)){ const el=document.querySelector('.res[data-r="'+k+'"]'); if(el) el.classList.add('fresh'); } }); }
  view.shownRes=sig;
  renderFin(); renderBot();
  updateGameOver();
}
/* The finance panel: the two numbers the loss condition is made of, at a size that matches
   how much they matter. Debt carries the debt colour throughout — see the palette note. */
function renderFin(){ const el=$('#fin'); if(!el) return;
  const ceil=debtCeiling(), owed=state.debt, dp=ceil>0?Math.min(100,owed/ceil*100):0;
  const oc=state.overCeiling||0, limit=borrowLimit(), avail=Math.max(0,limit-owed);
  const crisis=oc>0, owing=owed>0.5;
  el.innerHTML=`
    <div class="finbox clickable ${crisis?'crisis':owing?'owing':''}" onclick="openDebtPop(event)" title="Debt against the ceiling at which creditors foreclose. Discretionary spending is refused past ${Math.round(guardLimit())} 💰. Click to repay.">
      <span class="fk">Debt</span>
      <span class="fv ${owing?'debt':''}">${owing?fmt(owed):'—'}<small> / ${fmt(ceil)}</small></span>
      ${owing?`<div class="fbar"><i style="width:${dp}%;background:${dp>=80?'var(--warn)':'var(--debt)'}"></i></div>`:'<span class="fsub">no debt outstanding</span>'}
      ${crisis?`<span class="fore">⚠ FORECLOSURE IN ${Math.ceil(FORECLOSE_GRACE-oc)}s</span>`:''}
    </div>
    <div class="finbox clickable" onclick="openResPop('credits',event)" title="What you may still borrow, and the creditworthiness that sets it. Raised by achievements. Click to borrow.">
      <span class="fk">Credit limit</span>
      <span class="fv">${fmt(limit)}<small> · ${fmt(avail)} free</small></span>
      <span class="fsub">⚖ ${creditScore()} ${scoreBand(creditScore())} · ${Math.round(interestRate()*100)}%/cycle</span>
    </div>`; }
/* Status, not decisions: the clock, the speed control and the head count. */
function renderBot(){ const el=$('#botbar'); if(!el) return;
  const names={0:'❚❚',1:'1×',2:'2×',3:'4×'}, ocn=ocCount();
  el.innerHTML=`<div class="bb-s speed" id="speed">${SPEEDS.map((sp,i)=>`<button class="${state.speed===sp?'on':''}" onclick="setSpeed(${sp})">${sp===0?'❚❚':names[i]}</button>`).join('')}</div>
    <span class="bb-i"><b>CYCLE&nbsp;${state.cycle}</b>&nbsp;·&nbsp;${fmtTime(state.tSec)}</span>
    <span class="bb-i" title="colonists / housing capacity">👥&nbsp;${state.citizens.length}/${housingCap()}</span>
    ${ocn?`<span class="bb-i" style="color:var(--gold)" title="modules running above rated output">⚙ ${ocn}</span>`:''}

    <span style="flex:1"></span>
    <span class="bb-i" style="font-size:10px;opacity:.7">Space pause · 0 1 2 3 speed · R rotate · Esc back</span>`; }
function updateGameOver(){ const go=$('#gameover'); if(!go) return;
  if(state.gameOver){ go.style.display='flex'; const m=$('#gomsg'); if(m) m.textContent=state._goMsg||'Your creditors have seized the colony.';
    const gs=$('#gostats'); if(gs) gs.innerHTML=`<div class="s"><b>${state.cycle}</b><span>Cycles</span></div><div class="s"><b>${state.citizens.length}</b><span>Citizens</span></div><div class="s"><b>${creditScore()}</b><span>Credit Score</span></div><div class="s"><b>${fmt(state.stats.creditsEarned)}</b><span>Lifetime 💰</span></div>`;
  } else go.style.display='none'; }
/* how many techs are unlocked, unresearched and payable right now — the Research pip */
function affordableTechs(){ let n=0; for(const id in TECHS){ if(state.techs[id]) continue;
    const t=TECHS[id]; if(!t.requires.every(r=>state.techs[r])) continue;
    if(canAfford(effCost(t.cost))) n++; } return n; }
function renderTabs(){
  const idleCit=state.citizens.filter(c=>c.assign==null).length;
  const building=state.buildings.filter(b=>!!jobOf(b)).length;
  /* while a project is running the Research pip is the project, not the shopping list */
  const rpip=state.research? '⏳' : (affordableTechs()||'');
  const tabs=[['colony','Colony',building||''],['staffing','Staffing',idleCit||''],['citizens','Citizens',''],['market','Market',''],['research','Research',rpip]];
  if(techHas('cybernetics')) tabs.push(['augments','Augments','']);
  if(techHas('telemetry')) tabs.push(['ledger','Ledger', ledAlertCount()||'']);
  tabs.push(['log','Log','']);
  $('#tabs').innerHTML=tabs.map(([id,name,pip])=>`<div class="tab ${view.uiTab===id?'on':''}" onclick="switchTab('${id}')">${name}${pip!==''?`<span class="pip">${pip}</span>`:''}</div>`).join(''); }

/* ---------- Colony grid ---------- */
function renderColonyFull(){
  refreshAdjHL();
  const old=$('#boardwrap'); const sl=old?old.scrollLeft:null, st=old?old.scrollTop:null;
  const od=$('#detail'); const dsc=od?od.scrollTop:0;
  const detail=detailHTML();
  $('#view').innerHTML=`<div class="toolbar">
      <span class="hint" id="colhint">${colHint()}</span><span class="spacer"></span>

  if(M.kind==='debt'){

    else if(state.debt>0) risk=`<span class="perk">on credit · debt ${Math.round(state.debt)}/${Math.round(g)}</span>`; }

      : `<div class="hint" style="font-size:10px">No available colonists — grow more or free one up.</div>`;
    if(broker){

          if(M.kind==='buy') h+=`<label class="chk"><input type="checkbox" ${p.credit?'checked':''} onchange="setProgCredit(${b.id},${i},this.checked)"> buy on credit <span class="hint" style="font-size:10px">(stops at ${Math.round(guardLimit())} 💰)</span></label>`;

          h+=slotStatusHTML(b,p);
          h+=`<div class="hint" style="font-size:10px">${M.help||''}</div>`;
        }
      }
    }
    h+=`</div>`; }
  return h; }
/* --- v0.28: price thresholds are a slider on the market's real rails -------------------
   A bare number box asked the player to guess two things the game had never told them: how
   far the price can legally move (30%–220% of base — the tick clamps it), and how far it
   ACTUALLY moves (much less, until somebody trades in size). The track shows both: a shaded
   band for where this good has traded this session, a white pin for the live price, and a
   gold pin for the threshold. If the threshold sits outside the band the order is called
   out as one that may never fire. */
function psAt(v){ return Math.max(0, Math.min(100, (v-PRICE_MIN_PCT)/(PRICE_MAX_PCT-PRICE_MIN_PCT)*100)); }
function priceSliderHTML(b,i,p,nm){ const r=p.res;
  const now=pricePct(r), seen=priceSeen(r)||{lo:100,hi:100};
  const val=Math.max(PRICE_MIN_PCT, Math.min(PRICE_MAX_PCT, Math.round(p.pricePct)));
  const sell=p.mode==='sell_high';
  const dead = sell ? val>seen.hi+0.5 : val<seen.lo-0.5;
  const armed = sell ? now>=val : now<=val;
  return `<div class="pslide">
    <div class="row"><span class="cost">${nm.label}</span><span class="spacer"></span>
      <b class="lvl ps-val">${val}%</b></div>
    <div class="ps-track" title="shaded: where ${RESOURCES[r].name} has traded this session · white: right now · gold: your threshold">
      <i class="ps-band" style="left:${psAt(seen.lo)}%;width:${Math.max(0.8,psAt(seen.hi)-psAt(seen.lo))}%"></i>
      <i class="ps-base" style="left:${psAt(100)}%"></i>
      <i class="ps-now" style="left:${psAt(now)}%"></i>
      <i class="ps-mark" style="left:${psAt(val)}%"></i></div>
    <input class="ps-range" type="range" min="${PRICE_MIN_PCT}" max="${PRICE_MAX_PCT}" step="1" value="${val}"
      oninput="priceSlideLive(this)" onchange="setProgNum(${b.id},${i},'pricePct',this.value)">
    <div class="ps-key"><span>now <b style="color:var(--ink)">${Math.round(now)}%</b></span>
      <span>seen ${Math.round(seen.lo)}–${Math.round(seen.hi)}%</span>
      <span>rails ${PRICE_MIN_PCT}–${PRICE_MAX_PCT}%</span>
      <span style="color:${armed?'var(--good)':'var(--dim)'}">${armed?'▶ over the line':'❚❚ waiting'}</span></div>
    ${dead?`<div class="cost bad">⚠ ${RESOURCES[r].name} has not ${sell?'risen above':'fallen below'} ${val}% this session. Prices drift only a few percent on their own — anything wider is caused by somebody trading in size, and it decays back to base with a ~23s half-life.</div>`:''}</div>`; }
/* dragging must not re-render: progRender() rebuilds the whole detail card and would drop
   the slider out from under the cursor. Live feedback is a text and a pin, committed on release. */
function priceSlideLive(el){ const box=el.closest('.pslide'); if(!box) return;
  const v=box.querySelector('.ps-val'); if(v) v.textContent=el.value+'%';
  const mk=box.querySelector('.ps-mark'); if(mk) mk.style.left=psAt(Number(el.value))+'%'; }
function tradeHubById(id){ const b=state.buildings.find(x=>x.id===id); return (b&&b.type==='trade')?b:null; }
function setProgMode(bid,i,mode){ const b=tradeHubById(bid); if(!b||!TRADE_MODES[mode]) return; const p=progsOf(b)[i]; if(!p) return;
  if(!MODES_FOR[progTarget(p)].includes(mode)) return;
  p.mode=mode; p.active=false;                            // a changed order must be re-armed
  if(mode==='sell_high'&&p.pricePct<100) p.pricePct=108;
  if(mode==='buy_low'&&p.pricePct>100) p.pricePct=92;
  progRender(); }
function toggleProgActive(bid,i){ const b=tradeHubById(bid); if(!b) return; const p=progsOf(b)[i]; if(!p) return;
  if(!progReady(p)){ logMsg('Finish configuring the slot before arming it.','warn'); progRender(); return; }
  p.active=!p.active; progRender(); }
/* Target first, action second: switching between a good and the debt clears an action that
   no longer applies, rather than leaving a nonsensical pairing behind. */
function setProgTarget(bid,i,val){ const b=tradeHubById(bid); if(!b) return; const p=progsOf(b)[i]; if(!p) return;
  if(val===DEBT_TARGET){ p.target='debt'; if(!MODES_FOR.debt.includes(p.mode)){ p.mode='off'; p.active=false; } }
  else { if(!PRICES[val]) return; p.target='res'; p.res=val; if(!MODES_FOR.res.includes(p.mode)){ p.mode='off'; p.active=false; } }
  progRender(); }
function setProgNum(bid,i,field,val){ const b=tradeHubById(bid); if(!b) return; const p=progsOf(b)[i]; if(!p) return;
  let v=Number(val); if(!isFinite(v)) v=0;
  /* a threshold outside the market's own rails is not a strict order, it is a dead one */
  p[field] = (field==='pricePct') ? Math.max(PRICE_MIN_PCT, Math.min(PRICE_MAX_PCT, v)) : Math.max(0,v);
  progRender(); }
function setProgCredit(bid,i,on){ const b=tradeHubById(bid); if(!b) return; const p=progsOf(b)[i]; if(p){ p.credit=!!on; progRender(); } }
/* Posting a broker to a slot also posts them to the terminal, and frees whatever slot they
   previously held — one citizen can only run one standing order. */
function setProgCit(bid,i,cid){ const b=tradeHubById(bid); if(!b) return; const progs=progsOf(b), p=progs[i]; if(!p) return;
  if(cid===''||cid==null){ const old=p.cit; p.cit=null;
    if(old!=null){ const c=state.citizens.find(x=>x.id===old); if(c&&c.assign===b.id) c.assign=null; }
    progRender(); return; }
  const c=state.citizens.find(x=>x.id===Number(cid)); if(!c){ progRender(); return; }
  progs.forEach((q,j)=>{ if(j!==i&&q.cit===c.id) q.cit=null; });
  if(p.cit!=null&&p.cit!==c.id){ const prev=state.citizens.find(x=>x.id===p.cit); if(prev&&prev.assign===b.id) prev.assign=null; }
  const staffed=state.citizens.filter(x=>x.assign===b.id&&x.id!==c.id).length;
  if(c.assign!==b.id && staffed>=jobSlots(b)){ logMsg('The terminal has no free postings — buy another slot.','warn'); progRender(); return; }
  c.assign=b.id; p.cit=c.id; progRender(); }

function reconcileTradeSlots(){ state.buildings.forEach(b=>{ if(b.type!=='trade'||!b.progs) return;
